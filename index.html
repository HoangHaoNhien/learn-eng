<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Khung Câu Giao Tiếp</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --panel2:#fbfaf7; --ink:#1d1b18; --muted:#6d6862;
  --line:#e3ded4; --line2:#efeae1; --accent:#b0501c; --accent2:#8a3e14; --accent-soft:#fcf0e6;
  --en:#0f3d63; --en-soft:#eaf1f8; --ok:#1c6b42; --ok-soft:#e9f4ee; --bad:#b0261c; --bad-soft:#fbeceb;
  --chip:#f1ece3; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -16px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --panel:#1e1c17; --panel2:#232019; --ink:#ece7dd; --muted:#a09a8f;
    --line:#332f27; --line2:#2a2721; --accent:#e8874a; --accent2:#f0a271; --accent-soft:#2b1f16;
    --en:#8fc2ee; --en-soft:#182634; --ok:#6cc894; --ok-soft:#14261c; --bad:#f08a80; --bad-soft:#2b1917;
    --chip:#2a2620; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --panel:#1e1c17; --panel2:#232019; --ink:#ece7dd; --muted:#a09a8f;
  --line:#332f27; --line2:#2a2721; --accent:#e8874a; --accent2:#f0a271; --accent-soft:#2b1f16;
  --en:#8fc2ee; --en-soft:#182634; --ok:#6cc894; --ok-soft:#14261c; --bad:#f08a80; --bad-soft:#2b1917;
  --chip:#2a2620; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}

.top{
  position:sticky; top:0; z-index:40; display:flex; gap:12px; align-items:center;
  padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0}
.brand b{font-size:17px; letter-spacing:-.2px; white-space:nowrap}
.brand span{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.btn{
  border:1px solid var(--line); background:var(--panel2); color:var(--ink);
  border-radius:9px; padding:7px 12px; font-size:13.5px; cursor:pointer; font-family:inherit;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.icon{padding:7px 10px}
.mode{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 9px; white-space:nowrap}
.wrap{display:grid; grid-template-columns:302px minmax(0,1fr); gap:0; align-items:start}

.side{
  position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--panel2); padding:14px 12px 40px;
}
.search{
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); font-family:inherit; font-size:14px; margin-bottom:6px;
}
.search:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.prog{font-size:12px; color:var(--muted); padding:4px 4px 10px}
.grp{margin-bottom:4px}
.grp>summary{
  cursor:pointer; list-style:none; padding:8px 8px; border-radius:8px;
  font-size:12.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--muted);
  display:flex; gap:8px; align-items:center;
}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{background:var(--chip); color:var(--ink)}
.grp>summary::before{content:"\25B8"; font-size:10px; transition:transform .15s}
.grp[open]>summary::before{transform:rotate(90deg)}
.item{
  display:flex; gap:9px; align-items:flex-start; width:100%; text-align:left;
  padding:7px 9px; border:0; border-radius:8px; background:transparent; color:inherit;
  font-family:inherit; font-size:13.5px; line-height:1.4; cursor:pointer;
}
.item:hover{background:var(--chip)}
.item.on{background:var(--accent-soft); color:var(--accent2); font-weight:600}
.item .n{font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--muted); padding-top:2px; min-width:20px}
.item.on .n{color:var(--accent)}
.item .t{min-width:0}
.item .t i{display:block; font-style:normal; font-size:11.5px; color:var(--muted); margin-top:1px}
.item.done .t b::after{content:" \2713"; color:var(--ok)}
.item.full .t b::after{content:" \2605"; color:var(--accent); font-size:10px}
.item.full.done .t b::after{content:" \2605\2713"; color:var(--ok); font-size:10px}
.item .t b{font-weight:inherit}

/* Cot noi dung: rong hon truoc (900 -> 1240), va le trai/phai co gian theo man hinh.
   clamp() bao dam KHONG BAO GIO duoi 10px — man hinh hep den may van con khe ho. */
main{padding:26px clamp(10px, 2.4vw, 36px) 90px; max-width:1240px; margin:0 auto; min-width:0}
.eyebrow{font-size:12px; letter-spacing:.9px; text-transform:uppercase; color:var(--accent); font-weight:700}
h1{font-size:clamp(23px,3.3vw,31px); line-height:1.25; margin:6px 0 4px; letter-spacing:-.4px}
.sub{color:var(--muted); font-size:15px; margin:0 0 20px}
h2{
  font-size:18px; margin:34px 0 12px; padding-top:20px; border-top:1px solid var(--line);
  letter-spacing:-.2px; display:flex; gap:9px; align-items:center;
}
h2 .num{
  font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft);
  border-radius:6px; padding:2px 7px; font-variant-numeric:tabular-nums;
}
h3{font-size:14.5px; margin:20px 0 8px; color:var(--muted); letter-spacing:.2px; text-transform:uppercase}
p{margin:0 0 11px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:16px 18px; box-shadow:var(--shadow)}
.hero{background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
.pat{
  font-family:"Cascadia Mono",Consolas,ui-monospace,monospace; font-size:clamp(17px,2.6vw,22px);
  color:var(--en); font-weight:600; line-height:1.5; margin:0 0 6px; word-break:break-word;
}
.pat em{font-style:normal; color:var(--accent)}
.meta{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.tag{font-size:12px; background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--muted)}
.tag.hot{background:var(--accent-soft); color:var(--accent2); border-color:transparent; font-weight:600}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:12px}
.mini{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:13px 15px}
.mini h4{margin:0 0 5px; font-size:14px}
.mini h4 .ic{margin-right:6px}
.mini p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.55}

table{width:100%; border-collapse:collapse; font-size:14px; margin:4px 0 12px; display:block; overflow-x:auto}
th,td{border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top}
th{background:var(--chip); font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted)}
td code,.k{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace; font-size:13px; color:var(--en); background:var(--en-soft); padding:1px 5px; border-radius:5px}

.ex{border-left:3px solid var(--line2); padding:7px 0 7px 13px; margin:0 0 10px}
.ex:hover{border-left-color:var(--accent)}
.ex .en{margin:0; color:var(--en); font-weight:600; font-size:15.5px; line-height:1.5}
.ex .vi{margin:2px 0 0; color:var(--muted); font-size:13.5px}
.ex .note{margin:3px 0 0; font-size:12.5px; color:var(--muted); font-style:italic}
.say{
  border:0; background:transparent; cursor:pointer; color:var(--muted); font-size:13px;
  padding:0 4px; border-radius:5px; opacity:.45; vertical-align:middle;
}
.say:hover{opacity:1; color:var(--accent)}

.dlg{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px}
.dlg .who{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:8px}
.dlg .line{margin:0 0 9px}
.dlg .line p{margin:0}
.dlg .line .en{color:var(--en); font-weight:600}
.dlg .line .vi{font-size:13px; color:var(--muted)}
.dlg .line.me{background:var(--accent-soft); border-radius:9px; padding:8px 11px}

/* --- BAY nguoi Viet hay mac: MOT khoi, cau sai tren, cau dung ngay duoi ---
   Truoc day hai cau nam hai cot canh nhau: mat phai nhay ngang de so, va cho
   khac nhau khong thang hang nen rat kho thay da sua cai gi. Xep doc thi hai
   cau thang cot chu, cho sua lo ra ngay.

   <b> trong DU LIEU chinh la phan duoc sua, nen phai la INLINE.

   TEN LOP PHAI RIENG: .pr-row da thuoc ve danh sach "De noi & viet" (muc 20),
   va luat ".pr-row .tx b{display:block}" cua no tung bien phan highlight thanh
   khoi -> mot cau bi chat thanh nhieu dong. Dat ten .pp-row de het va cham. */
.pair{border:1px solid var(--line); border-radius:11px; overflow:hidden;
  margin:0 0 14px; background:var(--card)}
.pp-row{display:flex; gap:9px; align-items:baseline; padding:11px 13px;
  font-size:15px; line-height:1.75}
.pp-row.w{background:var(--bad-soft)}
.pp-row.r{background:var(--ok-soft); border-top:1px solid var(--line)}
.pp-row .mk{flex:0 0 40px; font-size:10.5px; letter-spacing:.4px; font-weight:700;
  text-transform:uppercase; white-space:nowrap}
.pp-row.w .mk{color:var(--bad)}
.pp-row.r .mk{color:var(--ok)}
.pp-row .tx{flex:1 1 auto; min-width:0}
/* Phan duoc sua: KHONG khung nen, chi doi mau + gach. Khung nen co padding lam
   cau trong nhu bi chat thanh tung manh; bo di thi cau doc lien mot mach va
   xuong dong o dau cung tu nhien.
   display:inline ghi han ra de khong luat nao sau nay bien no thanh khoi nua. */
.pp-row b{display:inline; font-weight:700; background:none; padding:0;
  font-size:inherit}
.pp-row.w b{color:var(--bad); text-decoration:line-through;
  text-decoration-thickness:1.5px}
.pp-row.r b{color:var(--ok); text-decoration:underline;
  text-decoration-thickness:2px; text-underline-offset:3px}
.pp-row i{display:inline; font-style:italic; color:var(--muted); font-size:13.5px}
.pair > .why{font-size:13px; color:var(--muted); margin:0; line-height:1.7;
  padding:10px 14px 12px; border-top:1px dashed var(--line); background:var(--panel2)}

.scale{display:flex; border-radius:10px; overflow:hidden; border:1px solid var(--line); margin-bottom:12px}
.scale div{flex:1; padding:10px 11px; font-size:13px; background:var(--panel); border-right:1px solid var(--line)}
.scale div:last-child{border-right:0}
.scale div b{display:block; color:var(--en); font-size:13.5px}
.scale div i{font-style:normal; color:var(--muted); font-size:11.5px}

.q{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 15px; margin-bottom:10px}
.q p{margin:0 0 4px}
.q .vi{font-size:13px; color:var(--muted); margin-bottom:6px}
.q .blank{color:var(--en); font-weight:600}
.q .ans{display:none; margin-top:7px; padding-top:7px; border-top:1px dashed var(--line); color:var(--ok); font-weight:600; font-size:14.5px}
.q.open .ans{display:block}
.q .rev{font-size:12.5px; border:1px solid var(--line); background:var(--panel2); color:var(--muted); border-radius:7px; padding:3px 9px; cursor:pointer; font-family:inherit}
.q .rev:hover{color:var(--accent); border-color:var(--accent)}

/* ---------- ngân hàng câu: 2 panel ---------- */
.bank{
  display:grid; grid-template-columns:320px minmax(0,1fr);
  border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:0 0 16px; background:var(--panel);
}
.bk-list{border-right:1px solid var(--line); background:var(--panel2)}
.bk-grp{border-bottom:1px solid var(--line)}
.bk-grp:last-child{border-bottom:0}
.bk-items{max-height:400px; overflow-y:auto; overscroll-behavior:contain}
.bk-sit{
  width:100%; display:flex; gap:8px; align-items:center;
  background:var(--panel2); border:0; border-bottom:1px solid var(--line2);
  padding:9px 13px; cursor:pointer; font-family:inherit; text-align:left;
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
}
.bk-sit:hover{background:var(--chip); color:var(--ink)}
.bk-grp.open>.bk-sit{color:var(--ink)}
.bk-sit .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bk-sit .cnt{margin-left:auto; font-size:10.5px; font-weight:600; background:var(--chip); border-radius:999px; padding:1px 7px}
.bk-grp.open>.bk-sit .cnt{background:var(--accent-soft); color:var(--accent2)}
.bk-sit .car{font-size:9px; transition:transform .15s; transform:rotate(-90deg)}
.bk-grp.open>.bk-sit .car{transform:none}
.bk-grp:not(.open)>.bk-items{display:none}
.bk-row{
  display:block; width:100%; text-align:left; border:0; background:transparent; color:inherit;
  font-family:inherit; padding:9px 13px; cursor:pointer; border-bottom:1px solid var(--line2); line-height:1.4;
}
.bk-row:hover{background:var(--chip)}
.bk-row.on{background:var(--accent-soft)}
.bk-row b{display:block; font-size:13.5px; font-weight:600; color:var(--en)}
.bk-row.on b{color:var(--accent2)}
.bk-row i{display:block; font-style:normal; font-size:12px; color:var(--muted); margin-top:1px}
.bk-row .fr{font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.bk-pane{padding:16px 20px; min-height:300px}
.bk-hint{color:var(--muted); font-size:14px; text-align:center; padding:52px 16px; line-height:1.6}
.bk-hint .big{font-size:30px; opacity:.45; margin-bottom:10px}
.bk-pane.picked .bk-hint{display:none}
.bk-d{display:none}
.bk-d.on{display:block}
.bk-d .sit{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); font-weight:700; margin-bottom:8px}
.bk-d .head .en{font-size:18px; color:var(--en); font-weight:600; margin:0; line-height:1.45}
.bk-d .head .vi{font-size:14px; color:var(--muted); margin:3px 0 0}
.bk-d .note{font-size:13px; color:var(--muted); background:var(--chip); border-radius:8px; padding:8px 11px; margin:11px 0 0}
.bk-d h5{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
  margin:18px 0 7px; padding-top:12px; border-top:1px solid var(--line2);
}
.bk-d .en{color:var(--en); font-weight:600; font-size:14.5px; margin:0}
.bk-d .vi{color:var(--muted); font-size:13px; margin:1px 0 0}
.bk-d .step{border-left:3px solid var(--line2); padding:2px 0 2px 11px; margin-bottom:9px}
.bk-d .step.you{border-left-color:var(--accent)}
.bk-d .rp{background:var(--panel2); border:1px solid var(--line2); border-radius:10px; padding:10px 12px; margin-bottom:9px}
.bk-d .rp .them .en::before{content:"\1F464 "; opacity:.5; font-weight:400}
.bk-d .rp .you{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line)}
.bk-d .rp .you .en{color:var(--accent2)}
.bk-d .rp .you .en::before{content:"\21B3 "; opacity:.6; font-weight:400}
.bk-d .goto{display:inline-block; margin-top:14px; font-size:13px}

/* ---------- ôn tập trộn ---------- */
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:18px}
.seg button{border:0; background:var(--panel); color:var(--muted); font-family:inherit; font-size:13px; padding:7px 13px; cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft); color:var(--accent2); font-weight:600}

.callout{background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:12px 15px; margin:0 0 14px; font-size:14.5px}
.callout b{color:var(--accent2)}
.soon{text-align:center; padding:56px 20px; color:var(--muted)}
.soon .big{font-size:38px; margin-bottom:10px}
.err{max-width:640px; margin:40px auto; background:var(--panel); border:1px solid var(--bad); border-radius:13px; padding:20px 24px}
.err h2{border:0; margin:0 0 10px; padding:0; color:var(--bad)}
.err pre{background:var(--chip); border-radius:8px; padding:10px 12px; overflow-x:auto; font-size:13px; margin:0 0 10px}
.done-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:26px 0 0; padding-top:18px; border-top:1px solid var(--line)}
.nav{display:flex; gap:8px; margin-left:auto}
ul.tight{margin:0 0 12px; padding-left:20px}
ul.tight li{margin-bottom:5px}

/* --- tab chuyen che do: Khung cau / Ngu phap --- */
.tabs{display:inline-flex; flex:0 0 auto; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.tabs button{border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:13px; padding:6px 13px; cursor:pointer; white-space:nowrap}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--accent-soft); color:var(--accent2); font-weight:600}

/* --- khoi "tree": so do chon dang dung --- */
.tree{margin:0 0 16px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel)}
.tree .tq{margin:0; padding:11px 15px; background:var(--chip); border-bottom:1px solid var(--line); font-size:14px; font-weight:600}
.tree .tn{padding:11px 15px; border-bottom:1px solid var(--line)}
.tree .tn:last-child{border-bottom:0}
.tree .tl{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap; margin:0; font-size:14px}
.tree .ti{color:var(--muted); flex:1 1 180px; min-width:0}
.tree .ta{color:var(--accent); font-weight:700}
.tree .tt{font-weight:600; color:var(--accent2); flex:1 1 160px}
.tree .tx{margin:7px 0 0; font-size:13.5px; color:var(--en); font-style:italic}

/* --- khoi "link": cau noi sang khung cau --- */
.lnk{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:10px; margin:0 0 16px}
.lnk a{display:block; padding:11px 14px; border:1px solid var(--line); border-radius:11px; background:var(--panel); text-decoration:none; color:inherit}
.lnk a:hover{border-color:var(--accent); background:var(--accent-soft)}
.lnk a b{display:block; font-size:13px; color:var(--accent2); margin-bottom:3px}
.lnk a i{font-style:normal; font-size:13.5px; color:var(--muted); line-height:1.45}

/* --- dai tham chieu nguoc: khung cau -> bai ngu phap --- */
.gback{margin:0 0 20px}
.gback .lbl{display:block; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 9px}
.gback .lnk{margin:0}

/* --- Tu dien loi --- */
.errbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px}
.errbar input{flex:1 1 240px; min-width:0; padding:9px 13px; border:1px solid var(--line); border-radius:10px;
  background:var(--panel); color:inherit; font-family:inherit; font-size:14px}
.errbar input:focus{outline:0; border-color:var(--accent)}
.errcount{font-size:13px; color:var(--muted); margin:0 0 14px}
.errbox{margin:0 0 18px}
.errbox .pair{margin:0 0 14px}
.errbox .pair:last-child{margin-bottom:0}
/* .src noi tiep ngay duoi .why trong cung mot day chan the */
.errbox .pair > .why{padding-bottom:5px}
.errbox .src{margin:0; padding:0 14px 11px; font-size:12.5px;
  background:var(--panel2)}
.errbox .src a{color:var(--accent2); text-decoration:none; border-bottom:1px dotted var(--accent)}
.errbox .src a:hover{background:var(--accent-soft)}
.errmore{display:block; width:100%; padding:11px; border:1px dashed var(--line); border-radius:11px;
  background:transparent; color:var(--muted); font-family:inherit; font-size:13.5px; cursor:pointer}
.errmore:hover{border-color:var(--accent); color:var(--accent2)}

/* --- Bang dong tu bat quy tac --- */
.vbbar{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:0 0 14px}
.vbonly{display:inline-flex; gap:7px; align-items:center; font-size:13px; color:var(--muted); cursor:pointer}
.vbonly input{accent-color:var(--accent); cursor:pointer}
/* O tim ngay tren bang: tren man hinh hep thanh ben bi gap lai nen o tim o do khong voi toi duoc */
.vbfind{position:relative; flex:1 1 230px; min-width:180px; max-width:360px}
.vbfind input{width:100%; padding:9px 32px 9px 32px; border:1px solid var(--line); border-radius:10px;
  background:var(--card); color:var(--ink); font-family:inherit; font-size:14px}
.vbfind input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.vbfind .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%);
  font-size:13px; color:var(--muted); pointer-events:none}
.vbfind .clr{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:24px; height:24px;
  border:0; border-radius:50%; background:transparent; color:var(--muted); font-size:15px; line-height:1;
  cursor:pointer; display:none}
.vbfind .clr:hover{background:var(--chip); color:var(--ink)}
.vbfind.has .clr{display:block}
.vbwrap{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:0 0 10px}
table.vb{width:100%; border-collapse:collapse; font-size:14.5px}
table.vb th{background:var(--chip); text-align:left; padding:10px 13px; font-size:12px; font-weight:600;
  letter-spacing:.03em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line)}
table.vb td{padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:top}
table.vb tr:last-child td{border-bottom:0}
table.vb tr.hot td.c1 .w{color:var(--accent2); font-weight:700}
table.vb tr.hot{background:var(--accent-soft)}
table.vb td.c1,table.vb td.c2,table.vb td.c3{font-family:ui-monospace,"Cascadia Code",Consolas,monospace; color:var(--en)}
table.vb td.vi{color:var(--muted); position:relative; padding-right:78px}
table.vb td.vi .say{position:absolute; right:8px; top:6px}
table.vb td.vi .ptag{position:absolute; right:34px; top:9px; font-size:10.5px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--muted); background:var(--chip); border-radius:4px; padding:2px 5px}
/* che cot de tu kiem tra — re chuot hoac cham vao o la hien lai */
table.vb.hide-v23 td.c2 .w,table.vb.hide-v23 td.c3 .w,table.vb.hide-v1 td.c1 .w{
  background:var(--chip); color:transparent; border-radius:5px; cursor:pointer; user-select:none}
table.vb.hide-v23 td.c2:hover .w,table.vb.hide-v23 td.c3:hover .w,table.vb.hide-v1 td.c1:hover .w{
  background:transparent; color:var(--en)}
.vbnote{font-size:13px; color:var(--muted); margin:0 0 18px; line-height:1.6}
/* --- Bang tu vung --- */
table.vc{width:100%; border-collapse:collapse; font-size:14.5px}
table.vc td{padding:10px 13px; border-bottom:1px solid var(--line); vertical-align:top}
table.vc tr:last-child td{border-bottom:0}
table.vc tr.hot{background:var(--accent-soft)}
table.vc td.cw{width:28%; min-width:130px; position:relative; padding-right:34px}
table.vc td.cw .w{font-weight:600; color:var(--accent2)}
table.vc td.cw .pos{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; font-style:italic}
table.vc td.cw .say{position:absolute; right:6px; top:8px}
/* Phien am: giu nguyen mau chu, khong in nghieng — IPA nghieng rat kho doc */
table.vc td.cw .ipa{display:block; margin-top:3px; font-size:12.5px; color:var(--muted);
  font-family:"Segoe UI","Noto Sans",system-ui,sans-serif; letter-spacing:.01em}
table.vc.hide-en td.cw .ipa{visibility:hidden}
table.vc.hide-en td.cw:hover .ipa{visibility:visible}
table.vc td.cm{width:26%; min-width:120px; position:relative; padding-right:44px}
table.vc td.cm .ptag{position:absolute; right:8px; top:11px}
table.vc td.cx{position:relative}
table.vc td.cx .en{margin:0; font-size:14px; color:var(--en); position:relative; padding-right:30px}
table.vc td.cx .en .say{position:absolute; right:0; top:-1px}
table.vc td.cx .vi{margin:3px 0 0; font-size:13.5px; color:var(--muted)}
table.vc.hide-vi td.cm .w,table.vc.hide-en td.cw .w{
  background:var(--chip); color:transparent; border-radius:5px; cursor:pointer; user-select:none}
table.vc.hide-vi td.cm:hover .w,table.vc.hide-en td.cw:hover .w{background:transparent}
table.vc.hide-vi td.cm:hover .w{color:inherit}
table.vc.hide-en td.cw:hover .w{color:var(--accent2)}
table.vc.hide-vi td.cx .vi{color:transparent; background:var(--chip); border-radius:5px; cursor:pointer}
table.vc.hide-vi td.cx:hover .vi{color:var(--muted); background:transparent}
.item.soon-topic{opacity:.45}

/* --- Tab Tu vung: hai panel trai/phai ---
   Ca khu vuc chiem tron chieu cao con lai cua man hinh; CHI hai panel cuon ben trong,
   trang khong cuon. Nho vay thanh phan trang luon nam o day panel trai, khong bi troi
   mat khi doc den cuoi danh sach. */
main.vcmode{height:calc(100vh - 53px); display:flex; flex-direction:column;
  padding-bottom:0; overflow:hidden}
main.vcmode > .vc2{flex:1 1 auto; min-height:0; margin-bottom:12px}
.vc2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.08fr); gap:13px}
.vc-pane{display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
  border:1px solid var(--line); border-radius:13px; background:var(--panel)}
.vc-cap{flex:0 0 auto; padding:8px 13px; border-bottom:1px solid var(--line);
  background:var(--panel2); font-size:12.5px; color:var(--muted)}
.vc-rows{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain}
.vc-foot{flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel2); padding:7px 10px}
.vc-foot .pager{margin:0; flex-wrap:wrap}
.vc-foot .pager .pginfo{margin-left:auto}

.vcrow{display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line);
  background:transparent; color:var(--ink); font-family:inherit; font-size:14px;
  padding:9px 13px; cursor:pointer; position:relative}
.vcrow:last-child{border-bottom:0}
.vcrow:hover{background:var(--chip)}
.vcrow.hot{background:var(--accent-soft)}
.vcrow.on{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.vcrow .w{font-weight:600; color:var(--accent2)}
.vcrow .pos{font-size:11.5px; color:var(--muted); font-style:italic; margin-left:6px}
.vcrow .ipa{font-size:12px; color:var(--muted); margin-left:6px;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.vcrow .m{display:block; color:var(--muted); font-size:13px; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vc-rows.hide-vi .vcrow .m{color:transparent; background:var(--chip); border-radius:5px}
.vc-rows.hide-vi .vcrow:hover .m{color:var(--muted); background:transparent}
.vc-rows.hide-en .vcrow .w,.vc-rows.hide-en .vcrow .ipa{color:transparent; background:var(--chip); border-radius:5px}
.vc-rows.hide-en .vcrow:hover .w{color:var(--accent2); background:transparent}
.vc-rows.hide-en .vcrow:hover .ipa{color:var(--muted); background:transparent}

.vc-det{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:20px 22px 34px}
.vc-det .hd{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 2px}
.vc-det .hd .w{font-size:27px; font-weight:700; color:var(--accent2); letter-spacing:-.4px}
.vc-det .hd .ipa{font-size:15px; color:var(--muted);
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.vc-det .hd .pos{font-size:13px; color:var(--muted); font-style:italic}
.vc-det .mean{font-size:16.5px; margin:8px 0 14px}
.vc-det h4{font-size:12px; letter-spacing:.7px; text-transform:uppercase; color:var(--accent);
  margin:20px 0 7px; font-weight:700}
.vc-det .ex{border-left:3px solid var(--line); padding:2px 0 2px 11px; margin:0 0 10px}
.vc-det .ex .en{margin:0; color:var(--en); font-size:14.5px}
.vc-det .ex .vi{margin:2px 0 0; color:var(--muted); font-size:13.5px}
.vc-det .wl{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.vc-det .wl li{font-size:14px}
.vc-det .wl b{font-weight:600; color:var(--accent2)}
.vc-det .wl i{font-style:normal; color:var(--muted); font-size:13px}
.vc-det .jump{border:0; background:transparent; padding:0; font:inherit; color:var(--accent2);
  font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.vc-det .nope{color:var(--muted); font-size:13.5px; margin:0}
.vc-det .near{display:flex; flex-wrap:wrap; gap:6px}
.vc-det .near button{border:1px solid var(--line); background:var(--panel2); color:var(--ink);
  border-radius:999px; padding:3px 10px; font:inherit; font-size:13px; cursor:pointer}
.vc-det .near button:hover{border-color:var(--accent); color:var(--accent)}
.vc-empty{display:flex; align-items:center; justify-content:center; height:100%;
  color:var(--muted); text-align:center; padding:30px; font-size:14px}

/* --- Tab On tap --- */
.ot-hero{border:1px solid var(--line); border-radius:14px; background:var(--card);
  padding:26px 20px; text-align:center; margin:0 0 22px}
.ot-hero .big{font-size:52px; font-weight:700; line-height:1; color:var(--accent2)}
.ot-hero .lb{margin-top:6px; font-size:13.5px; color:var(--muted)}
.ot-hero .go{margin-top:16px; padding:10px 22px; font-size:15px;
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent2); font-weight:600}
.ot-hero .ok{margin:12px 0 0; font-size:13.5px; color:var(--muted); line-height:1.6}
.ot-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); margin:0 0 20px}
.ot-card{border:1px solid var(--line); border-radius:12px; background:var(--card);
  padding:14px 15px; cursor:pointer}
.ot-card:hover{border-color:var(--accent)}
.ot-card.has{border-color:var(--accent); background:var(--accent-soft)}
.ot-card .nm{font-weight:600; font-size:15px}
.ot-card .sub{margin-top:3px; font-size:12px; color:var(--muted)}
.ot-card .row{margin-top:10px; font-size:13px; color:var(--muted)}
.ot-card .row b{font-size:18px; color:var(--accent2)}
.ot-card .bar{height:5px; border-radius:3px; background:var(--chip); overflow:hidden; margin-top:8px}
.ot-card .bar i{display:block; height:100%; background:var(--accent)}
.ot-card .foot{margin-top:6px; font-size:11.5px; color:var(--muted)}
.ot-boxes{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); margin:0 0 14px}
.ot-boxes .bx{border:1px solid var(--line); border-radius:11px; padding:12px 10px; text-align:center}
.ot-boxes .bx .n{font-size:20px; font-weight:700; color:var(--accent2)}
.ot-boxes .bx .d{margin-top:3px; font-size:11.5px; color:var(--muted)}
.ot-boxes .bx .c{margin-top:6px; font-size:13px}
.ot-soon{border:1px dashed var(--line); border-radius:11px; padding:13px 15px;
  font-size:13px; color:var(--muted); line-height:1.65}
.ot-opts{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:-8px 0 22px}
/* Lich 7 ngay */
.ot-fc{display:flex; gap:8px; align-items:flex-end; margin:0 0 12px}
.ot-fc .col{flex:1; text-align:center; min-width:0}
.ot-fc .v{font-size:13px; font-weight:600; color:var(--accent2); height:18px}
.ot-fc .b{height:76px; display:flex; align-items:flex-end; border-radius:7px; background:var(--chip);
  overflow:hidden}
.ot-fc .b i{display:block; width:100%; background:var(--accent); border-radius:7px 7px 0 0}
.ot-fc .col.now .b i{background:var(--accent2)}
.ot-fc .d{margin-top:6px; font-size:11.5px; color:var(--muted); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.ot-fc .col.now .d{color:var(--accent2); font-weight:600}
.ot-fc .dd{font-size:10.5px; color:var(--muted); opacity:.75}
/* Thong ke */
.ot-stat{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); margin:0 0 14px}
.ot-stat .s{border:1px solid var(--line); border-radius:11px; padding:13px 12px; text-align:center}
.ot-stat .s b{display:block; font-size:24px; color:var(--accent2)}
.ot-stat .s span{display:block; margin-top:3px; font-size:11.5px; color:var(--muted)}
.ot-rec{margin:0 0 16px}
.ot-rec .r{display:flex; gap:10px; align-items:center; margin:0 0 7px; font-size:13px}
.ot-rec .nm{flex:0 0 86px; color:var(--muted)}
.ot-rec .bar{flex:1; height:7px; border-radius:4px; background:var(--chip); overflow:hidden}
.ot-rec .bar i{display:block; height:100%; background:var(--accent)}
.ot-rec .pc{flex:0 0 96px; text-align:right}
.ot-rec .pc i{color:var(--muted); font-style:normal; font-size:11.5px}
/* Sao luu */
textarea.ot-io{width:100%; min-height:84px; padding:11px 13px; border:1px solid var(--line);
  border-radius:11px; background:var(--card); color:var(--muted); font-family:ui-monospace,monospace;
  font-size:12px; line-height:1.5; resize:vertical}
textarea.ot-io:focus{outline:none; border-color:var(--accent); color:var(--ink)}
/* --- Phien on: the lat --- */
.ot-top{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin:0 0 10px}
.ot-top .pill{padding:4px 10px; border-radius:20px; background:var(--chip);
  font-size:12px; color:var(--muted)}
.ot-top .cnt{margin-left:auto; font-size:13px; color:var(--muted)}
.ot-prog{height:5px; border-radius:3px; background:var(--chip); overflow:hidden; margin:0 0 18px}
.ot-prog i{display:block; height:100%; background:var(--accent); transition:width .2s}
.ot-flip{border:1px solid var(--line); border-radius:14px; background:var(--card);
  padding:30px 24px; min-height:190px; display:flex; flex-direction:column;
  justify-content:center; text-align:center}
.ot-flip .face.back{display:none}
.ot-flip.open .face.back{display:block; margin-top:20px; padding-top:18px;
  border-top:1px dashed var(--line)}
.ot-flip .q{margin:0; font-size:21px; line-height:1.5; font-weight:500}
.ot-flip .wrong{margin:0; font-size:19px; line-height:1.5; color:var(--bad);
  text-decoration:line-through; text-decoration-thickness:1px}
.ot-flip .blank{margin:12px 0 0; font-size:17px; color:var(--en); font-family:ui-monospace,monospace}
.ot-flip .hint{margin:14px 0 0; font-size:12.5px; color:var(--muted); font-style:italic}
.ot-flip .a{margin:0; font-size:22px; font-weight:600; color:var(--accent2); line-height:1.45}
.ot-flip .ipa{margin:6px 0 0; font-size:14px; color:var(--muted)}
.ot-flip .ex{margin:12px 0 0; font-size:15px; color:var(--en)}
.ot-flip .exvi{margin:4px 0 0; font-size:13.5px; color:var(--muted)}
.ot-flip .why{margin:12px 0 0; font-size:13.5px; color:var(--muted); line-height:1.65}
.ot-bar{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 14px}
.ot-bar .go{padding:11px 26px; font-size:15px; background:var(--accent-soft);
  border-color:var(--accent); color:var(--accent2); font-weight:600}
.ot-bar .yes{padding:11px 22px; font-size:15px; font-weight:600;
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent2)}
.ot-bar .no{padding:11px 22px; font-size:15px}
/* --- Muc 21a: bai kiem tra dau vao --- */
.pt-q{border:1px solid var(--line); border-radius:13px; background:var(--card);
  padding:16px 18px; margin:0 0 12px}
.pt-q.done{border-color:var(--accent)}
.pt-q .no{font-size:11.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted)}
.pt-q .vi{margin:6px 0 2px; font-size:14px; color:var(--muted)}
.pt-q .en{margin:0 0 11px; font-size:17px; color:var(--en); font-family:ui-monospace,monospace;
  line-height:1.55}
.pt-opts{display:grid; gap:7px}
.pt-opts button{text-align:left; padding:9px 13px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel); color:var(--ink);
  font-family:ui-monospace,monospace; font-size:14.5px; cursor:pointer}
.pt-opts button:hover:not(:disabled){border-color:var(--accent)}
.pt-opts button.pick{background:var(--accent-soft); border-color:var(--accent);
  color:var(--accent2); font-weight:600}
.pt-opts button:disabled{cursor:default}
.pt-why{margin:11px 0 0; font-size:13.5px; color:var(--muted); line-height:1.65}
.pt-why.bad{color:var(--bad)}
/* Ket qua */
.pt-res{border:1px solid var(--accent); border-radius:14px; background:var(--accent-soft);
  padding:22px 22px 20px; margin:0 0 20px}
.pt-res .lv{font-size:34px; font-weight:700; color:var(--accent2); line-height:1.1}
.pt-res .lvn{margin:2px 0 0; font-size:14px; color:var(--muted)}
.pt-res .say{margin:14px 0 0; font-size:15px; line-height:1.7}
.pt-res .sc{margin:12px 0 0; font-size:13.5px; color:var(--muted)}
.pt-gs{display:grid; gap:8px; margin:0 0 18px}
.pt-gs .g{display:flex; gap:10px; align-items:center; font-size:13.5px}
.pt-gs .g .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
.pt-gs .g .bar{flex:0 0 92px; height:7px; border-radius:4px; background:var(--chip);
  overflow:hidden}
.pt-gs .g .bar i{display:block; height:100%; background:var(--accent)}
.pt-gs .g .bar i.low{background:var(--bad)}
.pt-gs .g .sc{flex:0 0 46px; text-align:right; color:var(--muted);
  font-variant-numeric:tabular-nums}
.pt-gs .g.start .nm{color:var(--accent2); font-weight:600}
/* Dai goi y o dau thanh ben tab Ngu phap */
.pt-hint{border:1px solid var(--accent); border-radius:11px; background:var(--accent-soft);
  padding:10px 12px; margin:0 0 10px; font-size:12.5px; line-height:1.6}
.pt-hint b{color:var(--accent2)}
.pt-hint .go{display:block; width:100%; margin-top:8px; padding:6px 10px; font-size:12px;
  text-align:center; border:1px solid var(--accent); border-radius:8px;
  background:var(--panel); color:var(--accent2); font-family:inherit; cursor:pointer}
/* --- Muc 21c: trang "Ban dang o dau" --- */
.cd-lv{border:1px solid var(--line); border-radius:14px; background:var(--panel);
  padding:0; margin:0 0 14px; overflow:hidden}
.cd-lv > .hd{display:flex; gap:12px; align-items:center; padding:14px 17px;
  background:var(--panel2); border-bottom:1px solid var(--line)}
.cd-lv > .hd .tag{flex:0 0 auto; font-size:21px; font-weight:700; color:var(--accent2);
  letter-spacing:-.5px}
.cd-lv > .hd .nm{flex:1 1 auto; min-width:0}
.cd-lv > .hd .nm b{display:block; font-size:14.5px}
.cd-lv > .hd .nm i{display:block; margin-top:2px; font-size:12.5px; color:var(--muted);
  font-style:normal; line-height:1.55}
.cd-lv > .hd .pc{flex:0 0 auto; font-size:13px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.cd-lv.full > .hd{background:var(--accent-soft)}
.cd-lv.full > .hd .pc{color:var(--accent2); font-weight:600}
.cd-it{border-top:1px solid var(--line); padding:13px 17px}
.cd-it:first-child{border-top:0}
.cd-it .top{display:flex; gap:10px; align-items:flex-start}
.cd-it .bx{flex:0 0 auto; width:19px; height:19px; margin-top:1px; padding:0;
  border:1px solid var(--line); border-radius:5px; background:var(--panel);
  color:var(--accent2); font-size:13px; line-height:1; cursor:pointer}
.cd-it .bx.on{background:var(--accent-soft); border-color:var(--accent)}
.cd-it .do{flex:1 1 auto; min-width:0; font-size:14.5px; line-height:1.6}
.cd-it.on .do{color:var(--muted)}
.cd-task{margin:9px 0 0 29px; font-size:13px; color:var(--muted); line-height:1.65}
.cd-task b{color:var(--accent2)}
.cd-links{display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 0 29px}
.cd-links button{padding:4px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); color:var(--muted); font-family:inherit; font-size:11.5px;
  cursor:pointer}
.cd-links button:hover{border-color:var(--accent); color:var(--accent2)}
/* --- Muc 19a: nghe chep chinh ta --- */
.dt-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px}
.dt-card{border:1px solid var(--line); border-radius:14px; background:var(--card);
  padding:24px 22px; margin:0 0 14px}
.dt-play{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;
  margin:0 0 18px}
.dt-play .big{padding:13px 30px; font-size:16px; font-weight:600;

<script>
/* =======================================================================
   NGUỒN DỮ LIỆU
   - Mở qua http://  → đọc trực tiếp data/index.json và data/frames/NNN.json
   - Mở bằng file:// → trình duyệt chặn fetch, tự động dùng data/bundle.js
     (bundle.js do build.bat sinh ra từ chính các file JSON đó)
   ======================================================================= */
var DATA_DIR  = "data/";
var IS_FILE   = location.protocol === "file:";
var bundle    = null;       // window.KC_DATA khi chạy ở chế độ file://
var frameCache = {};

function pad3(n){ return ("00" + n).slice(-3); }

function loadBundle(){
  return new Promise(function(resolve, reject){
    if(window.KC_DATA){ resolve(window.KC_DATA); return; }
    var s = document.createElement("script");
    s.charset = "utf-8";
    s.src = DATA_DIR + "bundle.js";
    s.onload = function(){
      if(window.KC_DATA) resolve(window.KC_DATA);
      else reject(new Error("bundle.js không chứa KC_DATA"));
    };
    s.onerror = function(){ reject(new Error("Không đọc được " + DATA_DIR + "bundle.js")); };
    document.head.appendChild(s);
  });
}

function getJSON(path){
  return fetch(path, {cache:"no-cache"}).then(function(r){
    if(!r.ok) throw new Error(r.status + " " + path);
    return r.json();
  });
}

function loadIndex(){
  if(IS_FILE){
    return loadBundle().then(function(d){ bundle = d; return d.index; });
  }
  return getJSON(DATA_DIR + "index.json").catch(function(){
    // http nhưng thiếu file / lỗi CORS → thử bundle
    return loadBundle().then(function(d){ bundle = d; return d.index; });
  });
}

function loadFrame(id){
  if(frameCache[id] !== undefined) return Promise.resolve(frameCache[id]);
  var done = function(v){ frameCache[id] = v; return v; };
  if(bundle) return Promise.resolve(done(bundle.frames[id] || null));
  return getJSON(DATA_DIR + "frames/" + pad3(id) + ".json")
    .then(done)
    .catch(function(){ return done(null); });
}

/* ---- phan ngu phap: data/grammar.json + data/grammar/NNN.json ---- */
function loadGrammarIndex(){
  if(bundle) return Promise.resolve(bundle.gindex || null);
  if(IS_FILE) return loadBundle().then(function(d){ bundle = d; return d.gindex || null; });
  return getJSON(DATA_DIR + "grammar.json").catch(function(){
    return loadBundle().then(function(d){ bundle = d; return d.gindex || null; });
  });
}

function loadLesson(id){
  var key = "g" + id;
  if(frameCache[key] !== undefined) return Promise.resolve(frameCache[key]);
  var done = function(v){ frameCache[key] = v; return v; };
  if(bundle) return Promise.resolve(done((bundle.lessons || {})[id] || null));
  return getJSON(DATA_DIR + "grammar/" + pad3(id) + ".json")

/* ===================== TRẠNG THÁI ===================== */
function load(k, d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
var doneSet = load("kc_done", []);   // khung câu đã học
var ngDone  = load("ng_done", []);   // bài ngữ pháp đã học
var vbDone  = load("vb_done", []);   // nhóm động từ đã học
var skDone  = load("sk_done", []);   // bài kỹ năng đã học
var nmDone  = load("nm_done", []);   // bài nhập môn đã học
var MODE    = load("kc_mode", "lt"); // "kc" khung câu · "ng" ngữ pháp · "vb" động từ · "sk" kỹ năng
var current = 1;                     // số = khung câu · "gN"/"sN" = bài · "vb"/"vc"/"ot"/"sit"/"err" = trang đơn
var INDEX = null, FLAT = [];
var GINDEX = null, GFLAT = [];
var SINDEX = null, SFLAT = [];
var BINDEX = null, BFLAT = [];       // nhập môn A0 — tab đứng đầu tiên
var VINDEX = null;                   // động từ bất quy tắc: một trang duy nhất, không có mục lục con
var CINDEX = null;                   // từ vựng B2: cũng một trang duy nhất
var PLACE  = null;                   // bài kiểm tra đầu vào — có thể chưa có file
/* Kết quả lần làm gần nhất. Giữ trong localStorage chứ không chỉ trong biến, vì
   dải gợi ý ở tab Ngữ pháp phải còn đó sau khi đóng trình duyệt. */
/* res giu NGAY trong bo nho, localStorage chi la cho luu lai giua cac phien.
   Trinh duyet an danh / chan storage van doc duoc ket qua vua cham — khong thi
   nguoi hoc lam xong 30 cau roi nhan mot trang trang. */
var PT = { ans: null, done: false, res: null };
var CANDO = null;                    // trang "Bạn đang ở đâu" — có thể chưa có file
var PRODUCE = null;                  // đề nói / viết — có thể chưa có file
var READING = null;                  // bài đọc dài — có thể chưa có file
/* Ôn tập không có file dữ liệu riêng — thẻ rút từ bốn nguồn đã có.
   Vẫn cần một "mục lục" giả vì setMode() dùng ctx(m).idx để biết tab có dùng được không. */
var OINDEX = { title: "Ôn tập lặp ngắt quãng",
               tagline: "thẻ rút từ chính tài liệu bạn đã học · ôn đúng lúc sắp quên" };
/* Lộ trình cũng là một trang đơn nên cần "mục lục" giả, giống OINDEX. */
var LTINDEX = { title: "Khóa học A0 → B2",
                tagline: "14 chặng, mỗi bài gom đủ nội dung học ngay trong một trang" };
var ROADMAP = null;                  // data/roadmap.json — có thể chưa có file
var TCINDEX = { title: "Luyện TOEIC",
                tagline: "làm theo từng part, chấm ngay từng câu" };
var TOEIC = null;                    // data/toeic.json — có thể chưa có file

function isG(id){ return typeof id === "string" && /^g\d+$/.test(id); }
function isS(id){ return typeof id === "string" && /^s\d+$/.test(id); }
function isN(id){ return typeof id === "string" && /^n\d+$/.test(id); }
function gNum(id){ return parseInt(String(id).slice(1), 10); }

/* Chế độ của một id. Số -> khung câu, "gN" -> ngữ pháp, "sN" -> kỹ năng, "vb" -> bảng động từ. */
function modeOf(id){
  if(id === "lt") return "lt";
  if(id === "tc") return "tc";
  if(id === "vb") return "vb";
  if(id === "vc") return "vc";
  if(id === "ot") return "ot";
  if(isG(id)) return "ng";
  if(isS(id)) return "sk";
  if(isN(id)) return "nm";
  return typeof id === "number" ? "kc" : null;
}

/* Mọi thứ phụ thuộc chế độ gom về một chỗ — thêm chế độ mới chỉ cần thêm một dòng.
   Chế độ "vb" chỉ có MỘT trang nên flat rỗng: không có nút Trước/Sau, không đếm tiến độ. */
function ctx(m){
  m = m || MODE;
  if(m === "ng") return { m:"ng", idx:GINDEX, flat:GFLAT, done:ngDone,
                          skey:"ng_done", last:"ng_last", label:"Bài ", first:"g1" };
  if(m === "sk") return { m:"sk", idx:SINDEX, flat:SFLAT, done:skDone,
                          skey:"sk_done", last:"sk_last", label:"Bài ", first:"s1" };
  if(m === "nm") return { m:"nm", idx:BINDEX, flat:BFLAT, done:nmDone,
                          skey:"nm_done", last:"nm_last", label:"Bài ", first:"n1" };
  if(m === "vb") return { m:"vb", idx:VINDEX, flat:[],    done:vbDone,
                          skey:"vb_done", last:"vb_last", label:"",     first:"vb" };
  if(m === "vc") return { m:"vc", idx:CINDEX, flat:[],    done:[],
                          skey:"vc_done", last:"vc_last", label:"",     first:"vc" };
  if(m === "ot") return { m:"ot", idx:OINDEX, flat:[],    done:[],
                          skey:"ot_done", last:"ot_last", label:"",     first:"ot" };
  if(m === "lt") return { m:"lt", idx:LTINDEX, flat:[],   done:[],
                          skey:"lt_done", last:"lt_last", label:"",     first:"lt" };
  if(m === "tc") return { m:"tc", idx:TCINDEX, flat:[],   done:[],
                          skey:"tc_done", last:"tc_last", label:"",     first:"tc" };
  return             { m:"kc", idx:INDEX,  flat:FLAT,  done:doneSet,
                          skey:"kc_done", last:"kc_last", label:"Khung ", first:1 };
}
function keyOf(m, n){
  return m === "ng" ? "g" + n : (m === "sk" ? "s" + n : (m === "nm" ? "n" + n : n));
}

/* ===================== DỰNG HTML TỪ JSON ===================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* Dung khi nhet vao thuoc tinh ("value=..."): dau nhay doi phai duoc thoat, esc() khong lam viec do. */
function escAttr(s){ return esc(s).replace(/"/g, "&quot;"); }
var bankSeq = 0, SITS = {};
function sitName(id){
  var s = SITS[id];
  return s ? ((s.icon ? s.icon + " " : "") + s.name) : id;
}

/* ---- panel 2 cột: trái danh sách (accordion), phải nội dung chi tiết ----
   Dùng chung cho khối "bank" (ngân hàng câu) và "words" (từ hay đi kèm). */
function panelHTML(groups){
  bankSeq++;
  var bid = "bk" + bankSeq, list = "", panes = "", n = 0;
  groups.forEach(function(g){
    var rows = "", items = g.items || [];
    items.forEach(function(it){
      var pid = bid + "-" + n;
      rows += '<button class="bk-row" type="button" data-p="' + pid + '">' +
              (it.badge ? '<span class="fr">' + esc(it.badge) + "</span>" : "") +
              "<b>" + esc(it.label) + "</b>" +
              (it.sub ? "<i>" + esc(it.sub) + "</i>" : "") + "</button>";
      panes += '<div class="bk-d" id="' + pid + '">' + it.pane + "</div>";
      n++;
    });
    list += '<div class="bk-grp">' +
              '<button class="bk-sit" type="button" aria-expanded="false">' +
                '<span class="nm">' + esc(g.title) + "</span>" +
                '<span class="cnt">' + items.length + "</span>" +
                '<span class="car">&#9662;</span>' +
              "</button>" +
              '<div class="bk-items">' + rows + "</div>" +
            "</div>";
  });
  var hint = '<div class="bk-hint"><div class="big">&#9776;</div>' +
             "Mở một nhóm ở cột trái,<br>rồi chọn một mục để xem chi tiết.</div>";
  return '<div class="bank" id="' + bid + '"><div class="bk-list">' + list +
         '</div><div class="bk-pane">' + hint + panes + "</div></div>";
}

/* ---- nội dung chi tiết của một câu trong ngân hàng câu ---- */
function bkStep(o, isYou){
  return '<div class="step' + (isYou ? " you" : "") + '">' +
         '<p class="en">' + esc(o.en) + "</p>" +
         (o.vi ? '<p class="vi">' + esc(o.vi) + "</p>" : "") + "</div>";
}
function bkBody(sit, it){
  var h = "";
  h += '<div class="sit">' + esc(sitName(sit)) +
       (it.frame ? " · Khung " + pad3(it.frame).slice(1) : "") + "</div>";
  if(it.open) h += "<h5>Mở lời trước đó</h5>" + bkStep(it.open, false);
  h += '<div class="head"><p class="en">' + esc(it.en) + '</p><p class="vi">' + esc(it.vi) + "</p></div>";
  if(it.note) h += '<p class="note">' + it.note + "</p>";
  if(it.reply && it.reply.length){
    h += "<h5>Họ có thể đáp lại — và bạn nói tiếp</h5>";
    it.reply.forEach(function(r){
      h += '<div class="rp"><div class="them"><p class="en">' + esc(r.them) + "</p>" +
           (r.themvi ? '<p class="vi">' + esc(r.themvi) + "</p>" : "") + "</div>" +
           '<div class="you"><p class="en">' + esc(r.you) + "</p>" +
           (r.youvi ? '<p class="vi">' + esc(r.youvi) + "</p>" : "") + "</div></div>";
    });
  }
  if(it.vars && it.vars.length){
    h += "<h5>Biến thể cùng mẫu</h5>";
    it.vars.forEach(function(v){ h += bkStep(v, false); });
  }
  if(it.close) h += "<h5>Câu kết</h5>" + bkStep(it.close, false);
  if(it.frame) h += '<a class="goto" href="#" data-go="' + it.frame + '">&rarr; Mở khung ' +
                    pad3(it.frame).slice(1) + " để học đầy đủ</a>";
  return h;
}
function bankHTML(groups){
  return panelHTML((groups || []).map(function(g){
    return {
      title: sitName(g.sit),
      items: (g.items || []).map(function(it){
        return {
          label: it.en,
          sub:   it.vi,
          badge: it.frame ? "Khung " + pad3(it.frame).slice(1) : "",
          pane:  bkBody(g.sit, it)
        };
      })
    };
  }));
}

/* ---- nội dung chi tiết của một từ hay đi kèm ---- */
function wordsHTML(groups){
  return panelHTML((groups || []).map(function(g){
    return {
      title: g.title,
      items: (g.items || []).map(function(w){
        var h = '<div class="sit">' + esc(g.title) + "</div>";
        h += '<div class="head"><p class="en">' + esc(w.w) + "</p>" +
             (w.vi ? '<p class="vi">' + esc(w.vi) + "</p>" : "") + "</div>";
        if(w.note) h += '<p class="note">' + w.note + "</p>";
        if(w.ex) h += "<h5>Ví dụ cắm vào khung câu</h5>" + bkStep({ en:w.ex, vi:w.exvi }, false);
        return { label: w.w, sub: w.vi, pane: h };
      })
    };
  }));
}

/* Mot cap Sai/Dung. Dung chung cho khoi "pairs" trong bai va cho trang Tu
   dien loi — truoc day hai cho giu hai ban sao markup giong het nhau. */
function pairHTML(p, extra){

  scale:  function(b){

  },
  /* Muc 19b — nghe giong NGUOI THAT. TTS doc chuan o cap tu nhung khong noi am,
     khong nuot am, khong lam dang yeu; bon bai Ky nang 07-10 day dung nhung thu
     do nen bat buoc phai co tieng nguoi that.
     DA CHOT: nhung link ngoai thay vi thu am. Nhuoc diem da biet cua cach nay la
     LINK CO THE CHET, nen moi muc van giu nguyen en + vi + focus: mat mang hay
     link hong thi bai hoc chi mat phan nghe, khong mat noi dung. */
  listen: function(b){
    var h = '<div class="lsn">' +
            (b.intro ? '<div class="intro">' + b.intro + "</div>" : "");

      h += '<div class="lsn-row">' +

  link:   function(b){
    return linkHTML((b.items || []).map(function(it){

/* Lưới thẻ liên kết. ng=false -> trỏ sang khung câu, ng=true -> trỏ sang bài ngữ pháp. */
function linkHTML(items, ng){
  var flat  = ng ? GFLAT : FLAT;
  var label = ng ? "Ngữ pháp " : "Khung ";
  return '<div class="lnk">' + items.map(function(it){
    var m = flat.filter(function(x){ return x.id === it.id; })[0];
    return '<a href="#" data-go="' + (ng ? "g" : "") + it.id + '"><b>' + label + pad3(it.id).slice(1) +
           (m ? " · " + esc(m.pat) : "") + "</b><i>" + esc(it.why || (m ? m.vi : "")) + "</i></a>";
  }).join("") + "</div>";
}

/* Dùng chung cho khung câu (kind="kc") và bài ngữ pháp (kind="ng").
   Khác nhau đúng hai chỗ: nhãn "Khung"/"Bài" và trường pattern/rule. */
function renderDoc(f, kind){
  var ng = kind !== "kc";   // ngữ pháp và kỹ năng dùng chung khuôn: nhãn "Bài" + trường "rule"
  var h = '<div class="eyebrow">' + esc(f.group) + (ng ? " · Bài " : " · Khung ") + pad3(f.id).slice(1) + "</div>";
  h += "<h1>" + esc(f.title) + "</h1>";
  if(f.subtitle) h += '<p class="sub">' + esc(f.subtitle) + "</p>";
  h += '<div class="card hero"><p class="pat">' + ((ng ? f.rule : f.pattern) || []).join("<br>") + "</p>";
  if(f.meaning) h += '<p style="margin:10px 0 0;font-size:14.5px">= <b>' + esc(f.meaning) + "</b></p>";
  if(f.tags && f.tags.length){
    h += '<div class="meta">' + f.tags.map(function(t){
      return '<span class="tag' + (t.hot ? " hot" : "") + '">' + esc(t.text) + "</span>";
    }).join("") + "</div>";
  }
  h += "</div>";
  // khung câu -> bài ngữ pháp (chiều ngược của khối "link" trong bài ngữ pháp)
  if(!ng && GFLAT.length && f.grammar && f.grammar.length){
    h += '<div class="gback"><span class="lbl">Ngữ pháp đứng sau khung này</span>' +
         linkHTML(f.grammar.map(function(id){ return { id: id }; }), true) + "</div>";
  }
  (f.sections || []).forEach(function(sec, i){
    h += '<h2><span class="num">' + (i+1) + "</span>" + esc(sec.title) + "</h2>";
    (sec.blocks || []).forEach(function(b){
      var fn = BLOCK[b.t];
      h += fn ? fn(b) : '<p style="color:var(--bad)">[Khối không rõ kiểu: ' + esc(b.t) + "]</p>";
    });
  });
  // [Khung 07] / [Ngữ pháp 12] trong nội dung -> link nhảy tới bài đó
  return h
    .replace(/\[Khung (\d{1,3})\]/g, function(m, n){
      return '<a href="#" data-go="' + parseInt(n, 10) + '">Khung ' + n + "</a>";
    })
    .replace(/\[Ngữ pháp (\d{1,3})\]/g, function(m, n){
      return '<a href="#" data-go="g' + parseInt(n, 10) + '">Ngữ pháp ' + n + "</a>";
    })
    .replace(/\[Kỹ năng (\d{1,3})\]/g, function(m, n){
      return '<a href="#" data-go="s' + parseInt(n, 10) + '">Kỹ năng ' + n + "</a>";
    })
    .replace(/\[Nhập môn (\d{1,3})\]/g, function(m, n){
      return '<a href="#" data-go="n' + parseInt(n, 10) + '">Nhập môn ' + n + "</a>";
    });
}
function renderFrame(f){ return renderDoc(f, "kc"); }

    return list.filter(Boolean);

function loadAllSkills(){

function eachBlock(frames, type, cb){
  frames.forEach(function(f){
    (f.sections||[]).forEach(function(s){
      (s.blocks||[]).forEach(function(b){ if(b.t === type) cb(b, f); });
    });
  });
}

/* --- Tra theo tình huống --- */
function viewSituations(){
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  loadAllFrames().then(function(frames){
    if(current !== "sit") return;
    var buckets = {};
    eachBlock(frames, "bank", function(b, f){
      (b.groups||[]).forEach(function(g){
        buckets[g.sit] = buckets[g.sit] || [];
        (g.items||[]).forEach(function(it){
          var c = {}; for(var k in it) c[k] = it[k];
          c.frame = f.id;
          buckets[g.sit].push(c);
        });
      });
    });
    var order = (INDEX.situations||[]).map(function(s){ return s.id; });
    Object.keys(buckets).forEach(function(k){ if(order.indexOf(k) < 0) order.push(k); });
    var gs = order.filter(function(k){ return buckets[k] && buckets[k].length; })
                  .map(function(k){ return { sit:k, items:buckets[k] }; });
    var total = gs.reduce(function(a, g){ return a + g.items.length; }, 0);

    var h = '<div class="eyebrow">Tra cứu</div><h1>Tra theo tình huống</h1>';
    h += '<p class="sub">' + total + " câu rút từ " + frames.length +
         " khung đã soạn, xếp theo nơi bạn sẽ dùng. Chọn một câu bên trái để xem cách mở lời, " +
         "câu người ta sẽ đáp lại và cách bạn nói tiếp.</p>";
    h += gs.length ? bankHTML(gs)
       : '<div class="soon"><div class="big">&#128269;</div><p><b>Chưa có câu nào.</b></p>' +
         "<p>Các khung có khối <code>bank</code> sẽ tự động xuất hiện ở đây.</p></div>";
    mainEl.innerHTML = h;
    decorate();
    window.scrollTo(0,0);
  });
}

function shuffle(a){
  for(var i=a.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ===================== ÔN TẬP LẶP NGẮT QUÃNG =====================
   Không có file dữ liệu riêng: thẻ được RÚT RA từ bốn nguồn đã có, y như cách
   Từ điển lỗi gom khối "pairs". Soạn thêm một bài là tự có thêm thẻ.

   Trạng thái lưu trong localStorage theo id thẻ:
     ot_srs  { "<id>": [hộp 1..5, mốc đến hạn] }
     ot_log  { "YYYY-MM-DD": { n: số thẻ đã ôn, ok: số thẻ nhớ được } }

   Id thẻ dựng TỪ NỘI DUNG chứ không từ chỉ số mảng — nếu dùng chỉ số thì chỉ cần
   chèn một từ mới vào giữa là toàn bộ tiến độ cũ lệch sang thẻ khác. */
var otSrs = load("ot_srs", {});
var otLog = load("ot_log", {});
/* deck "" = tất cả các bộ · sub = chủ đề/nguồn/nhóm con · dir = chiều hỏi bộ từ vựng */
var OT = { cards: null, deck: "", sub: "", onlyDone: false, dir: "vi", sess: null };
var OT_DAYS = [0, 1, 2, 4, 8, 16];   // hộp 1..5 -> ôn lại sau bao nhiêu ngày
var DAY_MS  = 86400000;

var OT_DECKS = [
  ["vc", "Từ vựng",  "nghĩa tiếng Việt &rarr; từ tiếng Anh"],
  ["qz", "Bài tập",  "câu tiếng Việt &rarr; câu tiếng Anh"],
  ["er", "Sửa lỗi",  "câu SAI &rarr; câu ĐÚNG"],
  ["vb", "Động từ",  "V1 &rarr; V2 / V3"]
];
function deckName(d){
  var x = OT_DECKS.filter(function(k){ return k[0] === d; })[0];
  return x ? x[1] : d;
}

/* Băm ngắn, ổn định — chỉ cần đủ phân biệt, không cần chống va chạm kiểu mật mã. */
function hash36(s){
  var h = 5381;
  s = String(s);
  for(var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function srsBox(id){ var s = otSrs[id]; return s ? s[0] : 0; }      // 0 = chưa từng gặp
function srsDue(id){ var s = otSrs[id]; return s ? s[1] : 0; }      // 0 = đến hạn ngay
function isDue(id, now){ return srsDue(id) <= (now || Date.now()); }

/* Gom thẻ từ MỌI nguồn tài liệu. Giữ lại trong OT.cards để không đọc lại mỗi lần vẽ.
   Tab Nhập môn cũng nằm trong đây — người mới cần ôn nhất, bỏ ra thì vô lý. */
function collectCards(){
  if(OT.cards) return Promise.resolve(OT.cards);
  return Promise.all([loadAllFrames(), loadAllLessons(),
                      loadAllSkills(), loadAllBasics()]).then(function(r){
    var out = [];

    // 1. Từ vựng — mặt trước là nghĩa tiếng Việt, mặt sau là từ + phiên âm + ví dụ
    ((CINDEX && CINDEX.words) || []).forEach(function(w){
      out.push({ id: "v:" + hash36(w[0] + "|" + w[3]), deck: "vc",
                 front: w[2], back: w[0], ipa: w[7] || "", pos: w[1],
                 ex: w[4], exvi: w[5], topic: w[3], say: w[0] });
    });

    // 2. Bài tập — khối "quiz" của mọi nguồn
    var takeQuiz = function(docs, src){
      eachBlock(docs, "quiz", function(b, f){
        (b.items || []).forEach(function(q){
          // Một câu tiếng Việt có thể có NHIỀU chỗ trống trong cùng bài — mỗi chỗ là
          // một mục quiz riêng, cùng "vi" nhưng khác đáp án. Phải băm cả đáp án,
          // nếu không thì chúng đè lên nhau và chỉ còn một thẻ.
          out.push({ id: "q:" + src + ":" + f.id + ":" +
                         hash36(q.vi + "\u0001" + (q.blank || "") + "\u0001" + q.a), deck: "qz",
                     front: q.vi, blank: q.blank || "", back: q.a,
                     src: src, fid: f.id, title: f.title, say: q.a });
        });
      });
    };

    // 3. Sửa lỗi — khối "pairs" của mọi nguồn
    var takePairs = function(docs, src){
      eachBlock(docs, "pairs", function(b, f){
        (b.items || []).forEach(function(p){
          out.push({ id: "p:" + src + ":" + f.id + ":" +
                         hash36(stripTags(p.wrong) + "\u0001" + stripTags(p.right)), deck: "er",
                     front: stripTags(p.wrong), back: stripTags(p.right), why: p.why || "",
                     src: src, fid: f.id, title: f.title, say: stripTags(p.right) });
        });
      });
    };

    takeQuiz(r[0], "kc");  takeQuiz(r[1], "ng");
    takeQuiz(r[2], "sk");  takeQuiz(r[3], "nm");
    takePairs(r[0], "kc"); takePairs(r[1], "ng");
    takePairs(r[2], "sk"); takePairs(r[3], "nm");

    // 4. Động từ bất quy tắc — V1 hỏi V2/V3. Có từ hai dòng cùng V1 (hang/hung,
    //    hang/hanged) nên id phải gộp cả V2 mới phân biệt được.
    ((VINDEX && VINDEX.verbs) || []).forEach(function(v){
      out.push({ id: "b:" + hash36(v[0] + "|" + v[1]), deck: "vb",
                 front: v[0], back: v[1] + " · " + v[2], vi: v[3], pat: v[4], say: v[0] });
    });

    OT.cards = out;
    return out;
  });
}

/* Đếm theo bộ: tổng, đến hạn, đã thuộc (hộp 5), chưa gặp bao giờ. */
function deckStats(cards, now){
  var by = {};
  OT_DECKS.forEach(function(d){ by[d[0]] = { n:0, due:0, seen:0, done:0 }; });
  cards.forEach(function(c){
    var s = by[c.deck];
    if(!s) return;
    s.n++;
    var b = srsBox(c.id);
    if(b) s.seen++;
    if(b === 5) s.done++;
    if(isDue(c.id, now)) s.due++;
  });
  return by;
}

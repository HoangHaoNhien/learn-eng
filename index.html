           '<p class="dt-lbl">Câu vừa đọc</p>' +
           '<div class="dt-line">' + esc(LQ.q.en) + "</div>" +
           '<p class="dt-hint" style="margin-top:8px">' + esc(LQ.q.vi) + "</p>" +
           '<p class="dt-meta">Bài ' + pad3(LQ.q.lesson).slice(1) + " · " + esc(LQ.q.title) +
             '<button type="button" id="lqGo">Mở bài</button></p>' +
         "</div>";
  }
  h += "</div>";
  h += '<div class="ot-bar"><button type="button" class="btn' +
       (LQ.pick !== null ? " go" : "") + '" id="lqSkip">' +
       (LQ.pick !== null ? "Câu tiếp theo &rarr;" : "Bỏ qua câu này") + "</button></div>";

  mainEl.innerHTML = h;
  lqWire();
}

function lqWire(){
  var byId = function(x){ return document.getElementById(x); };
  mainEl.querySelectorAll("#lqMode button").forEach(function(b){
    b.onclick = function(){ LQ.mode = b.getAttribute("data-m"); lqNext(); drawListenQuiz(); };
  });
  mainEl.querySelectorAll("#lqSrc button").forEach(function(b){
    b.onclick = function(){ LQ.src = b.getAttribute("data-s"); lqNext(); drawListenQuiz(); };
  });
  mainEl.querySelectorAll("#lqRate button").forEach(function(b){
    b.onclick = function(){
      LQ.rate = parseFloat(b.getAttribute("data-r"));
      drawListenQuiz();
      if(LQ.q) speak(LQ.q.en, LQ.rate);
    };
  });
  var play = byId("lqPlay"), slow = byId("lqSlow");
  if(play) play.onclick = function(){ speak(LQ.q.en, LQ.rate); };
  if(slow) slow.onclick = function(){ speak(LQ.q.en, 0.55); };
  mainEl.querySelectorAll(".lq-opts button").forEach(function(b){
    b.onclick = function(){
      LQ.pick = parseInt(b.getAttribute("data-i"), 10);
      LQ.n++;
      if(LQ.opts[LQ.pick] === LQ.q) LQ.ok++;
      drawListenQuiz();
    };
  });
  var skip = byId("lqSkip");
  if(skip) skip.onclick = function(){ lqNext(); drawListenQuiz(); window.scrollTo(0, 0); };
  var go = byId("lqGo");
  if(go) go.onclick = function(){
    show(LQ.q.src === "kc" ? LQ.q.lesson
       : (LQ.q.src === "ng" ? "g" : LQ.q.src === "sk" ? "s" : "n") + LQ.q.lesson);
  };
}

/* ===================== NOI BAM GIO (muc 20) =====================
   Day la cho DUY NHAT trong ca tai lieu tao ra ap luc thoi gian. Moi phan khac
   cho nguoi hoc NHAN RA cau dung; o day ho phai TU TAO RA cau, va phai tao kip.
   Khong ai cham bai — thay vao do moi de co thang tu soat "must", hien SAU khi
   het gio de nguoi hoc tu doi chieu. Tu soat moi la ky nang theo ho suot doi. */
var TM = { g: 0, i: -1, left: 0, on: false, done: false, tick: null, ticked: [] };

function tmList(g){
  var all = (PRODUCE && PRODUCE.timed) || [];
  return g ? all.filter(function(x){ return x.g === g; }) : all;
}
function tmStop(){
  if(TM.tick){ clearInterval(TM.tick); TM.tick = null; }
  TM.on = false;
}
function tmFmt(sec){
  var m = Math.floor(sec / 60), r = sec % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}

function viewTimed(){
  tmStop();
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  loadProduce().then(function(d){
    if(current !== "tm") return;
    PRODUCE = d;
    TM = { g: 0, i: -1, left: 0, on: false, done: false, tick: null, ticked: [] };
    drawTimed();
    window.scrollTo(0, 0);
  });
}

function drawTimed(){
  if(!PRODUCE || !tmList(0).length){
    mainEl.innerHTML = '<div class="eyebrow">Sản sinh</div><h1>Nói bấm giờ</h1>' +
      '<div class="soon"><div class="big">&#9201;</div>' +
      "<p><b>Chưa có đề nào.</b></p>" +
      "<p>Tạo <code>data/produce.json</code> rồi chạy <code>build.bat</code>.</p></div>";
    return;
  }
  var h = '<div class="eyebrow">Sản sinh</div><h1>Nói bấm giờ</h1>';

  if(TM.i < 0){
    h += '<p class="sub">' + (PRODUCE.tagline ? esc(PRODUCE.tagline) + " — " : "") +
         "chọn một nhóm ngữ pháp rồi nói liền trong thời gian cho trước. " +
         "<b>Nói thành tiếng</b>, đừng nghĩ thầm — nghĩ thầm thì câu nào cũng trôi, " +
         "mở miệng ra mới biết chỗ nào kẹt.</p>";
    if(PRODUCE.intro) h += '<div class="callout">' + PRODUCE.intro + "</div>";
    h += '<div class="tm-pick">';
    (GINDEX ? GINDEX.groups : []).forEach(function(g, i){
      var n = tmList(i + 1).length;
      if(!n) return;
      h += '<button type="button" data-g="' + (i + 1) + '">' +
             '<span class="nm">' + esc(g.name) + "</span>" +
             '<span class="sec">' + n + " đề</span></button>";
    });
    h += "</div>";
    mainEl.innerHTML = h;
    mainEl.querySelectorAll(".tm-pick button").forEach(function(b){
      b.onclick = function(){
        TM.g = parseInt(b.getAttribute("data-g"), 10);
        tmPick(0);
      };
    });
    return;
  }

  var list = tmList(TM.g), it = list[TM.i];
  var gname = (GINDEX && GINDEX.groups[TM.g - 1] || {}).name || "";
  var pcLeft = it.seconds ? Math.round(TM.left * 100 / it.seconds) : 0;

  h += '<p class="sub">' + esc(gname) + " · đề " + (TM.i + 1) + "/" + list.length + "</p>" +
       '<div class="dt-card">' +
         '<div class="tm-clock' + (TM.on ? " run" : (TM.done ? " end" : "")) + '" id="tmClock">' +
           tmFmt(TM.left) + "</div>" +
         '<div class="tm-ring"><i class="' + (TM.done ? "end" : "") +
           '" id="tmRing" style="width:' + pcLeft + '%"></i></div>' +
         '<p class="tm-task">' + esc(it.task) + "</p>" +
         (it.start ? '<p class="tm-start">Mở lời bằng: <code>' + esc(it.start) + "</code></p>" : "");

  if(TM.done){
    h += '<div class="tm-must"><div class="hd">Hết giờ — tự soát lại</div><ul>';
    (it.must || []).forEach(function(m, i){
      var on = TM.ticked.indexOf(i) > -1;
      h += '<li><button type="button" class="bx" data-t="' + i + '">' +
           (on ? "\u2611" : "\u2610") + "</button>" + esc(m) + "</li>";
    });
    h += "</ul></div>";
  }else{
    h += '<p class="dt-hint">Thang tự soát sẽ hiện <b>sau khi hết giờ</b> — ' +
         "đọc trước thì bạn sẽ bám vào danh sách thay vì nói tự nhiên.</p>";
  }
  h += "</div>";

  h += '<div class="ot-bar">';
  if(!TM.on && !TM.done) h += '<button type="button" class="btn go" id="tmGo">Bắt đầu nói</button>';
  if(TM.on) h += '<button type="button" class="btn" id="tmStop">Dừng</button>';
  if(TM.done) h += '<button type="button" class="btn go" id="tmAgain">Nói lại đề này</button>';
  if(TM.i < list.length - 1) h += '<button type="button" class="btn" id="tmNext">Đề tiếp theo &rarr;</button>';
  h += '<button type="button" class="btn" id="tmBack">&larr; Chọn nhóm khác</button></div>';

  mainEl.innerHTML = h;
  var byId = function(x){ return document.getElementById(x); };
  var go = byId("tmGo");
  if(go) go.onclick = tmRun;
  var st = byId("tmStop");
  if(st) st.onclick = function(){ tmStop(); TM.done = true; drawTimed(); };
  var ag = byId("tmAgain");
  if(ag) ag.onclick = function(){ tmPick(TM.i); };
  var nx = byId("tmNext");
  if(nx) nx.onclick = function(){ tmPick(TM.i + 1); window.scrollTo(0, 0); };
  var bk = byId("tmBack");
  if(bk) bk.onclick = function(){ tmStop(); TM.i = -1; TM.g = 0; drawTimed(); window.scrollTo(0, 0); };
  mainEl.querySelectorAll(".tm-must .bx").forEach(function(b){
    b.onclick = function(){
      var i = parseInt(b.getAttribute("data-t"), 10), at = TM.ticked.indexOf(i);
      if(at > -1) TM.ticked.splice(at, 1); else TM.ticked.push(i);
      drawTimed();
    };
  });
}

function tmPick(i){
  tmStop();
  var list = tmList(TM.g);
  if(i < 0 || i >= list.length) return;
  TM.i = i; TM.left = list[i].seconds; TM.done = false; TM.ticked = [];
  drawTimed();
}

/* Dem nguoc. Chi ve lai DONG HO va THANH, khong ve lai ca trang moi giay —
   ve lai ca trang thi nut dang bam bi thay moi giay, bam khong an. */
function tmRun(){
  tmStop();
  TM.on = true; TM.done = false;
  drawTimed();
  var it = tmList(TM.g)[TM.i];
  TM.tick = setInterval(function(){
    TM.left--;
    var c = document.getElementById("tmClock"), r = document.getElementById("tmRing");
    if(!c || !r){ tmStop(); return; }     // da sang trang khac
    c.textContent = tmFmt(Math.max(0, TM.left));
    r.style.width = Math.max(0, Math.round(TM.left * 100 / it.seconds)) + "%";
    if(TM.left <= 0){
      tmStop();
      TM.done = true;
      speak("Time is up.", 0.9);
      drawTimed();
      window.scrollTo(0, 0);
    }
  }, 1000);
}

/* ===================== DE NOI & VIET (muc 20) =====================
   Thu tu tren trang la co y: DE -> Y BAT BUOC -> cho lam -> roi MOI den bai mau
   va thang tu cham. Hien bai mau truoc thi nguoi hoc chep lai y, va bai mat sach
   gia tri. Thang "check" moi la phan quan trong nhat: no day nguoi hoc TU SOAT,
   thu se theo ho suot doi, thay cho mot nguoi cham bai luc nao cung san. */
var PR_MODE = [["all", "Tất cả"], ["speak", "Nói"], ["write", "Viết"]];
var PR = { mode: "all", i: -1, said: "", reveal: false, ticked: [] };

function prList(){
  var all = (PRODUCE && PRODUCE.prompt) || [];
  return PR.mode === "all" ? all
       : all.filter(function(x){ return x.mode === PR.mode; });
}
function prSkill(id){
  var nm = "";
  if(SINDEX) SINDEX.groups.forEach(function(g){
    (g.items || []).forEach(function(it){ if(it.id === id) nm = it.vi || it.pat || ""; });
  });
  return nm;
}

function viewPrompt(){
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  loadProduce().then(function(d){
    if(current !== "pr") return;
    PRODUCE = d;
    PR = { mode: PR.mode, i: -1, said: "", reveal: false, ticked: [] };
    drawPrompt();
    window.scrollTo(0, 0);
  });
}

function drawPrompt(){
  if(!PRODUCE || !((PRODUCE.prompt || []).length)){
    mainEl.innerHTML = '<div class="eyebrow">Sản sinh</div><h1>Đề nói &amp; viết</h1>' +
      '<div class="soon"><div class="big">&#9997;</div>' +
      "<p><b>Chưa có đề nào.</b></p>" +
      "<p>Tạo <code>data/produce.json</code> rồi chạy <code>build.bat</code>.</p></div>";
    return;
  }
  var list = prList();
  var h = '<div class="eyebrow">Sản sinh</div><h1>Đề nói &amp; viết</h1>';

  if(PR.i < 0){
    h += '<p class="sub">Mỗi đề có <b>ý bắt buộc</b>, một chỗ để bạn tự làm, rồi mới ' +
         "đến <b>bài mẫu</b> và <b>thang tự chấm</b>. Bài mẫu chỉ hiện khi bạn bấm — " +
         "xem trước thì bạn chép lại ý của nó và đề mất sạch giá trị.</p>" +
         '<div class="dt-bar"><div class="seg" id="prMode" style="margin:0">';
    PR_MODE.forEach(function(mp){
      h += '<button data-m="' + mp[0] + '"' + (PR.mode === mp[0] ? ' class="on"' : "") + ">" +
           mp[1] + "</button>";
    });
    h += "</div></div>";
    h += '<div class="pr-list">';
    list.forEach(function(x, i){
      h += '<button type="button" class="pr-row" data-i="' + i + '">' +
             '<span class="md' + (x.mode === "write" ? " w" : "") + '">' +
               (x.mode === "write" ? "Viết" : "Nói") + "</span>" +
             '<span class="tx"><b>' + esc(x.task) + "</b>" +
               '<i>Bài ' + pad3(x.s).slice(1) + " · " + esc(prSkill(x.s)) + "</i></span>" +
           "</button>";
    });
    h += "</div>";
    mainEl.innerHTML = h;
    mainEl.querySelectorAll("#prMode button").forEach(function(b){
      b.onclick = function(){ PR.mode = b.getAttribute("data-m"); drawPrompt(); };
    });
    mainEl.querySelectorAll(".pr-row").forEach(function(b){
      b.onclick = function(){
        PR.i = parseInt(b.getAttribute("data-i"), 10);
        PR.said = ""; PR.reveal = false; PR.ticked = [];
        drawPrompt(); window.scrollTo(0, 0);
      };
    });
    return;
  }

  var it = list[PR.i];
  if(!it){ PR.i = -1; drawPrompt(); return; }
  h += '<p class="sub">' + (it.mode === "write" ? "Đề viết" : "Đề nói") + " · bài " +
       pad3(it.s).slice(1) + " · " + esc(prSkill(it.s)) + "</p>" +
       '<p class="tm-task">' + esc(it.task) + "</p>" +
       '<div class="pr-must"><div class="hd">Bắt buộc có</div><ul>';
  (it.must || []).forEach(function(m){ h += "<li>" + esc(m) + "</li>"; });
  h += "</ul></div>";

  if(it.mode === "write"){
    h += '<textarea class="pr-work" id="prWork" placeholder="Viết bài của bạn ở đây…">' +
         esc(PR.said) + "</textarea>" +
         '<p class="pr-count" id="prCount">0 từ</p>';
  }else{
    h += '<div class="dt-card"><p class="dt-hint" style="margin:0">' +
         "<b>Nói thành tiếng</b> rồi mới bấm xem bài mẫu. Nghĩ thầm thì câu nào cũng trôi; " +
         "mở miệng ra mới biết chỗ nào kẹt. Thu lại bằng điện thoại để nghe lại càng tốt." +
         "</p></div>";
  }

  if(PR.reveal){
    h += '<div class="pr-model"><div class="hd">Bài mẫu — một cách làm, không phải cách duy nhất</div>' +
           '<div class="bd">' + esc(it.model) + "</div></div>" +
         '<div class="pr-check"><div class="hd">Tự chấm</div>';
    (it.check || []).forEach(function(q, i){
      var on = PR.ticked.indexOf(i) > -1;
      h += '<div class="q"><button type="button" class="bx' + (on ? " on" : "") +
           '" data-c="' + i + '">' + (on ? "\u2713" : "") + "</button>" + esc(q) + "</div>";
    });
    h += "</div>";
  }

  h += '<div class="ot-bar">';
  if(!PR.reveal) h += '<button type="button" class="btn go" id="prShow">Tôi làm xong rồi — xem bài mẫu</button>';
  if(PR.i < list.length - 1) h += '<button type="button" class="btn" id="prNext">Đề tiếp theo &rarr;</button>';
  h += '<button type="button" class="btn" id="prBack">&larr; Về danh sách đề</button></div>';

  mainEl.innerHTML = h;
  var byId = function(x){ return document.getElementById(x); };
  var work = byId("prWork");
  if(work){
    var count = function(){
      var n = work.value.trim() ? work.value.trim().split(/\s+/).length : 0;
      byId("prCount").textContent = n + " từ";
    };
    work.addEventListener("input", function(){ PR.said = work.value; count(); });
    count();
  }
  var sh = byId("prShow");
  if(sh) sh.onclick = function(){ PR.reveal = true; drawPrompt(); };
  var nx = byId("prNext");
  if(nx) nx.onclick = function(){
    PR.i++; PR.said = ""; PR.reveal = false; PR.ticked = [];
    drawPrompt(); window.scrollTo(0, 0);
  };
  var bk = byId("prBack");
  if(bk) bk.onclick = function(){ PR.i = -1; drawPrompt(); window.scrollTo(0, 0); };
  mainEl.querySelectorAll(".pr-check .bx").forEach(function(b){
    b.onclick = function(){
      var i = parseInt(b.getAttribute("data-c"), 10), at = PR.ticked.indexOf(i);
      if(at > -1) PR.ticked.splice(at, 1); else PR.ticked.push(i);
      drawPrompt();
    };
  });
}

/* ===================== DONG VAI (muc 20) =====================
   100 khung cau DA CO san 200 khoi "dialog" — chi thieu dung mot buoc: BAN dong
   mot vai. Nen file du lieu chi giu ba dong moi khung (vai cua ban, vai doi dien,
   muc tieu); hoi thoai mau va cum huu dung lay THANG tu khoi dialog va pattern
   cua chinh khung do. Chep lai 200 hoi thoai sang file khac la tao ra ban sao
   thu hai phai bao tri song song.
   Luot cua BAN bi giau di cho den khi bam hien — day la toan bo cai moi so voi
   mot khoi dialog thuong: ban phai TU NGHI ra cau truoc khi doc cau mau. */
var RP = { i: -1, show: false, doc: null };

function rpList(){ return (PRODUCE && PRODUCE.roleplay) || []; }
function rpFrameName(id){
  var nm = "";
  if(INDEX) INDEX.groups.forEach(function(g){
    (g.items || []).forEach(function(it){ if(it.id === id) nm = it.pat || ""; });
  });
  return nm;
}
/* Hoi thoai mau + cum huu dung, lay thang tu khung cau. */
function rpFromFrame(doc){
  var lines = [], useful = [];
  (doc.sections || []).forEach(function(sec){
    (sec.blocks || []).forEach(function(b){
      if(b.t === "dialog" && !lines.length) lines = b.lines || [];
      if(b.t === "bank"){
        (b.groups || []).forEach(function(g){
          (g.items || []).forEach(function(it){
            if(useful.length < 6 && it.en) useful.push(it.en);
          });
        });
      }
    });
  });
  return { lines: lines, useful: useful };
}

function viewRoleplay(){
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  loadProduce().then(function(d){
    if(current !== "rp") return;
    PRODUCE = d;
    RP = { i: -1, show: false, doc: null };
    drawRoleplayList();
    window.scrollTo(0, 0);
  });
}

function drawRoleplayList(){
  var list = rpList();
  if(!list.length){
    mainEl.innerHTML = '<div class="eyebrow">Sản sinh</div><h1>Đóng vai</h1>' +
      '<div class="soon"><div class="big">&#127917;</div>' +
      "<p><b>Chưa có màn nào.</b></p>" +
      "<p>Tạo <code>data/produce.json</code> rồi chạy <code>build.bat</code>.</p></div>";
    return;
  }
  var h = '<div class="eyebrow">Sản sinh</div><h1>Đóng vai</h1>' +
          '<p class="sub">' + list.length + " màn, mỗi màn gắn với một khung câu. " +
          "Bạn nhận một vai và một <b>mục tiêu giao tiếp</b>; lượt của bạn bị giấu đi " +
          "cho đến khi bấm hiện. Phải tự nghĩ ra câu trước đã — đọc sẵn thì chỉ là " +
          "đọc hội thoại, không phải đóng vai.</p>" +
          '<div class="pr-list">';
  list.forEach(function(x, i){
    h += '<button type="button" class="pr-row" data-i="' + i + '">' +
           '<span class="md">' + pad3(x.f).slice(1) + "</span>" +
           '<span class="tx"><b>' + esc(x.goal) + "</b>" +
             "<i>" + esc(x.you) + " · khung " + esc(rpFrameName(x.f)) + "</i></span>" +
         "</button>";
  });
  h += "</div>";
  mainEl.innerHTML = h;
  mainEl.querySelectorAll(".pr-row").forEach(function(b){
    b.onclick = function(){ rpOpen(parseInt(b.getAttribute("data-i"), 10)); };
  });
}

function rpOpen(i){
  var x = rpList()[i];
  if(!x) return;
  RP.i = i; RP.show = false; RP.doc = null;
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải khung câu…</p>';
  loadFrame(x.f).then(function(doc){
    if(current !== "rp" || RP.i !== i) return;
    RP.doc = doc;
    drawRoleplay();
    window.scrollTo(0, 0);
  });
}

function drawRoleplay(){
  var x = rpList()[RP.i];
  if(!x){ drawRoleplayList(); return; }
  var src = RP.doc ? rpFromFrame(RP.doc) : { lines: [], useful: [] };
  var h = '<div class="eyebrow">Đóng vai</div><h1>' + esc(rpFrameName(x.f)) + "</h1>" +
          '<p class="sub">Khung ' + pad3(x.f).slice(1) +
            ' · <a href="#" data-go="' + x.f + '">mở khung câu này</a></p>' +
          '<div class="rp-roles">' +
            '<div class="rp-role me"><div class="hd">Vai của bạn</div>' +
              '<div class="bd">' + esc(x.you) + "</div></div>" +
            '<div class="rp-role"><div class="hd">Người đối diện</div>' +
              '<div class="bd">' + esc(x.them) + "</div></div>" +
          "</div>" +
          '<div class="rp-goal"><b>Mục tiêu:</b> ' + esc(x.goal) + "</div>";

  if(src.useful.length){
    h += '<p class="dt-lbl">Cụm có thể dùng</p><div class="rp-use">';
    src.useful.forEach(function(u){ h += "<span>" + esc(u) + "</span>"; });
    h += "</div>";
  }

  h += '<div class="dt-card">';
  if(!src.lines.length){
    h += '<p class="dt-hint" style="margin:0">Khung này chưa có hội thoại mẫu. ' +
         "Cứ tự dựng lấy màn của bạn theo mục tiêu ở trên.</p>";
  }else{
    h += '<p class="dt-lbl">Hội thoại' + (RP.show ? "" : " — lượt của bạn đang bị giấu") + "</p>";
    src.lines.forEach(function(l){
      var me = !!l.me;
      h += '<div class="rp-turn' + (me ? " me" : "") + '">' +
             '<div class="who">' + esc(l.speaker || (me ? "Bạn" : "")) + "</div>" +
             '<div class="bd">';
      if(me && !RP.show){
        h += '<div class="rp-hide">… đến lượt bạn — tự nghĩ ra câu rồi mới bấm hiện …</div>';
      }else{
        h += '<div class="en">' + esc(l.en || "") + "</div>" +
             '<div class="vi">' + esc(l.vi || "") + "</div>";
      }
      h += "</div></div>";
    });
  }
  h += "</div>";

  h += '<div class="ot-bar">';
  if(src.lines.length && !RP.show)
    h += '<button type="button" class="btn go" id="rpShow">Tôi nói xong rồi — hiện lượt của tôi</button>';
  if(RP.i < rpList().length - 1)
    h += '<button type="button" class="btn" id="rpNext">Màn tiếp theo &rarr;</button>';
  h += '<button type="button" class="btn" id="rpBack">&larr; Về danh sách màn</button></div>';

  mainEl.innerHTML = h;
  var byId = function(v){ return document.getElementById(v); };
  var sh = byId("rpShow");
  if(sh) sh.onclick = function(){ RP.show = true; drawRoleplay(); };
  var nx = byId("rpNext");
  if(nx) nx.onclick = function(){ rpOpen(RP.i + 1); };
  var bk = byId("rpBack");
  if(bk) bk.onclick = function(){ RP.i = -1; drawRoleplayList(); window.scrollTo(0, 0); };
  wireGo(mainEl);
}

/* ===================== DOC DOAN DAI (muc 22) =====================
   Dat o tab TU VUNG chu khong phai Ky nang: moi bai la mot chu de tu vung da
   soan, nhoi 15-25 tu cua chu de do vao ngu canh that. Nguoi hoc tu danh sach
   tu bam thang sang bai doc, va tu bai doc bam nguoc lai tung tu.
   Thu tu co y: DOC het mot luot -> TRA LOI -> roi moi den danh sach tu. Hien
   danh sach tu truoc thi nguoi hoc tra tung tu va khong bao gio doc lien mach,
   dung cai ma muc 22 muon chua. */
var RD = { i: -1, ans: null, done: false, big: false };

function rdList(){ return (READING && READING.items) || []; }
function rdTopicName(id){
  var nm = id;
  if(CINDEX) (CINDEX.topics || []).forEach(function(t){
    if(t.id === id) nm = t.vi || t.name || id;
  });
  return nm;
}
var RD_KIND = { main: "Ý chính", detail: "Chi tiết", guess: "Đoán nghĩa" };

function viewReading(){
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  loadReading().then(function(d){
    if(current !== "rd") return;
    READING = d;
    RD = { i: -1, ans: null, done: false, big: RD.big };
    drawReadingList();
    window.scrollTo(0, 0);
  });
}

function drawReadingList(){
  var list = rdList();
  if(!list.length){
    mainEl.innerHTML = '<div class="eyebrow">Đọc</div><h1>Đọc đoạn dài</h1>' +
      '<div class="soon"><div class="big">&#128214;</div>' +
      "<p><b>Chưa có bài đọc nào.</b></p>" +
      "<p>Tạo <code>data/reading.json</code> rồi chạy <code>build.bat</code>.</p></div>";
    return;
  }
  var h = '<div class="eyebrow">Đọc</div><h1>' + esc(READING.title || "Đọc đoạn dài") + "</h1>" +
          '<p class="sub">' + esc(READING.tagline || "") + " — " + list.length + " bài.</p>" +
          (READING.intro ? '<div class="callout">' + READING.intro + "</div>" : "") +
          '<div class="pr-list">';
  list.forEach(function(x, i){
    var n = (x.text || []).join(" ").split(/\s+/).length;
    h += '<button type="button" class="pr-row" data-i="' + i + '">' +
           '<span class="md' + (x.lv === "B2" ? " w" : "") + '">' + esc(x.lv) + "</span>" +
           '<span class="tx"><b>' + esc(x.title) + " · " + esc(x.vi) + "</b>" +
             "<i>" + esc(rdTopicName(x.topic)) + " · " + n + " từ · " +
             (x.gloss || []).length + " từ chủ đề</i></span>" +
         "</button>";
  });
  h += "</div>";
  mainEl.innerHTML = h;
  mainEl.querySelectorAll(".pr-row").forEach(function(b){
    b.onclick = function(){
      RD.i = parseInt(b.getAttribute("data-i"), 10);
      RD.ans = (rdList()[RD.i].q || []).map(function(){ return null; });
      RD.done = false;
      drawReading(); window.scrollTo(0, 0);
    };
  });
}

function drawReading(){
  var x = rdList()[RD.i];
  if(!x){ drawReadingList(); return; }
  var left = RD.ans.filter(function(a){ return a === null; }).length;
  var n = (x.text || []).join(" ").split(/\s+/).length;

  var h = '<div class="eyebrow">Đọc · ' + esc(rdTopicName(x.topic)) + "</div>" +
          "<h1>" + esc(x.title) + "</h1>" +
          '<p class="sub">' + esc(x.vi) + "</p>" +
          '<div class="rd-meta">' +
            '<span class="pill lv">' + esc(x.lv) + "</span>" +
            '<span class="pill">' + n + " từ</span>" +
            '<span class="pill">' + (x.gloss || []).length + " từ chủ đề</span>" +
            '<button type="button" class="btn" id="rdBig">' +
              (RD.big ? "Cỡ chữ thường" : "Cỡ chữ to hơn") + "</button>" +
          "</div>" +
          '<div class="rd-text">';
  (x.text || []).forEach(function(para){ h += "<p>" + esc(para) + "</p>"; });
  h += "</div>";

  h += '<div class="rd-qs"><h2>Câu hỏi</h2>';
  (x.q || []).forEach(function(q, i){
    var pick = RD.ans[i], ok = pick === q.a;
    h += '<div class="rd-q"><div class="hd">' +
           '<span class="tag">' + esc(RD_KIND[q.kind] || q.kind || "") + "</span>" +
           '<span class="tx">' + (i + 1) + ". " + esc(q.q) + "</span></div>" +
         '<div class="pt-opts">';
    q.opts.forEach(function(o, j){
      var cls = "";
      if(RD.done){ if(j === q.a || j === pick) cls = " pick"; }
      else if(j === pick) cls = " pick";
      h += '<button type="button" class="' + cls.trim() + '" data-q="' + i +
           '" data-o="' + j + '"' + (RD.done ? " disabled" : "") + ">" + esc(o) + "</button>";
    });
    h += "</div>";
    if(RD.done){
      h += '<p class="pt-why' + (ok ? "" : " bad") + '">' +
           (ok ? "\u2713 Đúng." : "\u2717 Đáp án đúng: <b>" + esc(q.opts[q.a]) + "</b>.") +
           "</p>";
    }
    h += "</div>";
  });
  h += "</div>";

  if(RD.done){
    var right = (x.q || []).filter(function(q, i){ return RD.ans[i] === q.a; }).length;
    h += '<div class="pt-res"><div class="lv">' + right + "/" + x.q.length + "</div>" +
         '<p class="say">' +
         (right >= 4 ? "Đọc hiểu tốt. Giờ mới nên xem danh sách từ bên dưới."
                     : "Dưới ngưỡng. Đọc lại bài một lượt nữa trước khi xem đáp án chi tiết.") +
         "</p></div>";
    h += '<div class="rd-gloss"><div class="hd">Từ chủ đề xuất hiện trong bài — ' +
           "bấm để mở trong tab Từ vựng</div><div class=\"rd-gw\">";
    (x.gloss || []).forEach(function(g){
      h += '<button type="button" data-w="' + escAttr(g[0]) + '">' +
             "<b>" + esc(g[0]) + "</b><i>" + esc(g[1]) + "</i>" +
             "<span>" + esc(g[2]) + "</span></button>";
    });
    h += "</div></div>";
  }

  h += '<div class="ot-bar">';
  if(!RD.done){
    h += '<button type="button" class="btn go" id="rdCheck"' + (left ? " disabled" : "") + ">" +
         (left ? "Còn " + left + " câu chưa trả lời" : "Chấm bài") + "</button>";
  }
  if(RD.i < rdList().length - 1)
    h += '<button type="button" class="btn" id="rdNext">Bài tiếp theo &rarr;</button>';
  h += '<button type="button" class="btn" id="rdBack">&larr; Về danh sách bài</button></div>';

  mainEl.innerHTML = h;
  mainEl.classList.toggle("rd-big", !!RD.big);

  var byId = function(v){ return document.getElementById(v); };
  mainEl.querySelectorAll(".pt-opts button").forEach(function(b){
    b.onclick = function(){
      RD.ans[parseInt(b.getAttribute("data-q"), 10)] = parseInt(b.getAttribute("data-o"), 10);
      drawReading();
    };
  });
  var bg = byId("rdBig");
  if(bg) bg.onclick = function(){ RD.big = !RD.big; drawReading(); };
  var ck = byId("rdCheck");
  if(ck) ck.onclick = function(){ RD.done = true; drawReading(); window.scrollTo(0, 0); };
  var nx = byId("rdNext");
  if(nx) nx.onclick = function(){
    RD.i++; RD.ans = (rdList()[RD.i].q || []).map(function(){ return null; });
    RD.done = false; drawReading(); window.scrollTo(0, 0);
  };
  var bk = byId("rdBack");
  if(bk) bk.onclick = function(){ RD.i = -1; drawReadingList(); window.scrollTo(0, 0); };
  mainEl.querySelectorAll(".rd-gw button").forEach(function(b){
    b.onclick = function(){
      var w = b.getAttribute("data-w");
      show("vc");
      setTimeout(function(){ if(typeof vcFindWord === "function") vcFindWord(w); }, 60);
    };
  });
}

/* ===================== KHOA HOC A0 -> B2 (muc 26) =====================
   Tab Lo trinh nay la KHOA HOC: 14 chang (chang 0 = Nhap mon A0), moi chang chia
   thanh bai, moi bai la mot chuoi BUOC tro vao noi dung san co — bai ngu phap,
   lat tu vung, khung cau + dong vai, bai ky nang, bai doc, de noi bam gio, de
   viet, TOEIC, kiem tra chang. data/course.json chi giu CHO TRO, khong chep noi
   dung: sua mot bai ngu phap la khoa hoc tu doi theo.

   MOI BUOC VE NGAY TRONG BAI — khong buoc nao chuyen sang tab khac. Moi buoc co
   trang thai rieng trong closure cua no (khong dung RD / TM / PR / CP toan cuc),
   va id phan tu deu mang tien to cua buoc, nen hai buoc cung kieu nam chung mot
   trang khong dam vao nhau.

   Tien do:
     - bai khoa hoc da xong <- co_done (khoa MOI duy nhat; bai Doc / Noi khong co
                               co "xong" nao khac de suy ra)
     - tu da thuoc  <- otSrs (the vao hop >=3) — nut Nho / Chua nho trong buoc tu
                       vung ghi thang vao day, nen hoc trong bai cung la on tap
     - bai da hoc   <- ngDone / nmDone / skDone — danh dau xong bai chinh thi ghi
                       luon vao day, tab Ngu phap va Khoa hoc khong lech nhau
     - kiem tra     <- cp_res (them khoa "s0", "s13" cho hai chang khong gan nhom) */
var LT = { open: "" };
var LT_BOX = 3;              // the vao hop 3 tro len thi coi nhu da thuoc
var COURSE = null;           // data/course.json
var CO_TIMERS = [];          // dong ho cua cac buoc Noi bam gio dang mo
var coDone = load("co_done", []);

function loadCourse(){
  if(bundle) return Promise.resolve(bundle.course || null);
  if(IS_FILE) return loadBundle().then(function(d){ bundle = d; return d.course || null; });
  return getJSON(DATA_DIR + "course.json").catch(function(){
    return loadBundle().then(function(d){ bundle = d; return d.course || null; })
                       .catch(function(){ return null; });
  });
}

function ltStages(){ return (COURSE && COURSE.stages) || []; }
function ltPass(){
  var p = (ROADMAP && ROADMAP.pass) || {};
  return { vocab: p.vocab || 0.8, check: p.check || 70 };
}
function ltTopicName(id){
  var nm = id;
  if(CINDEX) (CINDEX.topics || []).forEach(function(t){
    if(t.id === id) nm = t.vi || t.name || id;
  });
  return nm;
}
function ltStageName(x){
  if(!x) return "";
  if(x.n === 0) return "Nhập môn A0";
  if(!x.g) return "Củng cố từ vựng";
  return ((GINDEX && GINDEX.groups[x.g - 1]) || {}).name || "";
}
function coLessons(){
  var out = [];
  ltStages().forEach(function(x){
    (x.lessons || []).forEach(function(l){ out.push({ st: x, l: l }); });
  });
  return out;
}
function coFind(id){
  var all = coLessons();
  for(var i = 0; i < all.length; i++) if(all[i].l.id === id) return { at: i, st: all[i].st, l: all[i].l, all: all };
  return null;
}
function coIsDone(id){ return coDone.indexOf(id) > -1; }
function coCheckKey(x){ return x.n === 0 ? "s0" : (x.n === 13 ? "s13" : x.g); }

/* Tu da thuoc = the tu vung tuong ung da len hop >= LT_BOX.
   Id the dung y het collectCards(): "v:" + hash36(tu + "|" + chu de). */
function ltVocab(topics){
  var all = (CINDEX && CINDEX.words) || [];
  var n = 0, ok = 0;
  all.forEach(function(w){
    if(topics.indexOf(w[3]) < 0) return;
    n++;
    var st = otSrs["v:" + hash36(w[0] + "|" + w[3])];
    if(st && st[0] >= LT_BOX) ok++;
  });
  return { n: n, ok: ok };
}

/* Bai chinh BAT BUOC cua chang (bai "Nang cao, tuy chon" khong tinh). Chang 0
   tinh bai Nhap mon, cac chang khac tinh bai ngu phap. */
function ltGrammar(x){
  if(typeof x === "number") x = ltStages().filter(function(s){ return s.g === x && s.n; })[0];
  if(!x) return { n: 0, ok: 0, items: [] };
  var ids = [];
  (x.lessons || []).forEach(function(l){
    if(l.kind !== "main" || l.opt) return;
    l.steps.forEach(function(s){
      if(s.t === "grammar" || s.t === "basic") ids.push({ t: s.t, id: s.id });
    });
  });
  var ok = ids.filter(function(it){
    return (it.t === "basic" ? nmDone : ngDone).indexOf(it.id) > -1;
  }).length;
  return { n: ids.length, ok: ok, items: ids };
}

/* Mot chang DAT khi: xong het bai chinh bat buoc, kiem tra chang qua nguong, va
   du ty le tu da thuoc. Chang 0 khong co tu vung rieng nen chi xet hai dieu dau. */
function ltStat(x){
  var pass = ltPass();
  var v = ltVocab(x.topics || []);
  var gr = ltGrammar(x);
  var cp = cpAllRes()[coCheckKey(x)];
  var ls = x.lessons || [];
  var ld = ls.filter(function(l){ return coIsDone(l.id); }).length;
  var vOk = v.n ? (v.ok / v.n) >= pass.vocab : true;
  var gOk = gr.n ? gr.ok === gr.n : true;
  var cOk = !!(cp && cp.pc >= pass.check);
  return { v: v, gr: gr, cp: cp, done: vOk && gOk && cOk, ln: ls.length, ld: ld,
           vPc: v.n ? Math.round(v.ok * 100 / v.n) : 100,
           gPc: gr.n ? Math.round(gr.ok * 100 / gr.n) : 100,
           lPc: ls.length ? Math.round(ld * 100 / ls.length) : 100 };
}

/* Chang hien tai = chang CHUA DAT dau tien. */
function ltCurrent(){
  var st = ltStages();
  for(var i = 0; i < st.length; i++) if(!ltStat(st[i]).done) return st[i].n;
  return st.length ? st[st.length - 1].n : 0;
}
/* Bai nen hoc tiep: bai chua xong dau tien cua chang hien tai (bo qua bai tuy chon). */
function coNextLesson(n){
  var x = ltStages().filter(function(s){ return s.n === n; })[0];
  if(!x) return "";
  var l = (x.lessons || []).filter(function(l){ return !coIsDone(l.id) && !l.opt; })[0];
  return (l || x.lessons[0] || {}).id || "";
}

function coStopTimers(){
  CO_TIMERS.forEach(function(t){ clearInterval(t); });
  CO_TIMERS = [];
}

/* ---------------- thanh ben: menu cay ----------------
   Ba tang CAP -> CHANG -> BAI. Moi Cap va moi Chang co nut tam giac rieng de an /
   hien tang con; cac nhanh doc lap voi nhau (mo bao nhieu nhanh cung duoc). Bam vao
   TEN cap / chang thi mo trang tong quan cua no o ben phai, khong dong mo gi.
   Trang thai mo nho trong co_tree — chi la tien nghi cho nguoi xem. */
LT.tree = load("co_tree", null);

function coTreeInit(){
  if(LT.tree) return;
  // lan dau: mo san cap va chang dang hoc
  var cur = coFind(LT.open), n = cur ? cur.st.n : ltCurrent();
  LT.tree = {};
  LT.tree["S:" + n] = true;
  (COURSE.levels || []).forEach(function(lv){ if(lv.stages.indexOf(n) > -1) LT.tree["L:" + lv.id] = true; });
  save("co_tree", LT.tree);
}
function coTreeOpen(key){ return !!(LT.tree && LT.tree[key]); }
function coTreeToggle(key){
  coTreeInit();
  if(LT.tree[key]) delete LT.tree[key]; else LT.tree[key] = true;
  save("co_tree", LT.tree);
  buildRoadmapSide();
}
/* Bai dang mo phai nhin thay duoc: mo cap va chang chua no (khong dong nhanh nao khac). */
function coTreeShow(id){
  var f = coFind(id);
  if(!f) return;
  coTreeInit();
  LT.tree["S:" + f.st.n] = true;
  (COURSE.levels || []).forEach(function(lv){ if(lv.stages.indexOf(f.st.n) > -1) LT.tree["L:" + lv.id] = true; });
  save("co_tree", LT.tree);
}

/* Mot dong co nut an / hien tang con + ten bam duoc. */
function coTreeRow(cls, key, label, meta, onName){
  var open = coTreeOpen(key);
  var row = document.createElement("div");
  row.className = "co-node " + cls + (open ? " open" : "") + (LT.open === key ? " on" : "");
  var t = document.createElement("button");
  t.type = "button"; t.className = "tg";
  t.setAttribute("aria-expanded", open ? "true" : "false");
  t.title = open ? "Ẩn tầng con" : "Hiện tầng con";
  t.textContent = open ? "▾" : "▸";
  t.onclick = function(){ coTreeToggle(key); };
  var nm = document.createElement("button");
  nm.type = "button"; nm.className = "nm";
  nm.innerHTML = label + (meta ? '<span class="pc">' + meta + "</span>" : "");
  nm.onclick = onName;
  row.appendChild(t); row.appendChild(nm);
  return row;
}

function buildRoadmapSide(){
  var keepL = listEl.scrollTop;
  listEl.innerHTML = "";
  if(!ltStages().length){
    document.getElementById("prog").textContent = "";
    return;
  }
  coTreeInit();
  var box = document.createElement("div");
  box.className = "lt-side";

  var home = document.createElement("button");
  home.type = "button";
  home.className = "row home" + (!LT.open ? " on" : "");
  home.innerHTML = '<span class="no">&#9776;</span><span>Tổng quan khóa học</span>';
  home.onclick = function(){ coOpen(""); };
  box.appendChild(home);

  (COURSE.levels || []).forEach(function(lv){
    var xs = lv.stages.map(function(n){ return ltStages().filter(function(s){ return s.n === n; })[0]; })
                      .filter(Boolean);
    var lk = "L:" + lv.id;
    var lvDone = xs.filter(function(x){ return ltStat(x).done; }).length;
    box.appendChild(coTreeRow("lvl", lk,
      '<span class="tx">' + esc(lv.id) + " · " + esc(lv.name) + "</span>",
      lvDone + "/" + xs.length, function(){ coOpen(lk); document.body.classList.remove("open"); }));
    if(!coTreeOpen(lk)) return;

    var kids = document.createElement("div");
    kids.className = "co-kids";
    xs.forEach(function(x){
      var st = ltStat(x), sk = "S:" + x.n;
      kids.appendChild(coTreeRow("stg" + (st.done ? " done" : ""), sk,
        '<span class="no">' + (st.done ? "✓" : x.n) + '</span><span class="tx">' + esc(ltStageName(x)) + "</span>",
        st.ld + "/" + st.ln, function(){ coOpen(sk); document.body.classList.remove("open"); }));
      if(!coTreeOpen(sk)) return;
      var ls = document.createElement("div");
      ls.className = "co-kids";
      (x.lessons || []).forEach(function(l, i){
        var r = document.createElement("button");
        r.type = "button";
        r.className = "row les" + (l.id === LT.open ? " on" : "") +
                      (coIsDone(l.id) ? " done" : "") + (l.opt ? " opt" : "");
        r.innerHTML = '<span class="no">' + (coIsDone(l.id) ? "✓" : i + 1) + "</span>" +
                      "<span>" + esc(l.title) + "</span>";
        r.onclick = function(){ coOpen(l.id); document.body.classList.remove("open"); };
        ls.appendChild(r);
      });
      kids.appendChild(ls);
    });
    box.appendChild(kids);
  });
  listEl.appendChild(box);
  listEl.scrollTop = keepL;
  var all = coLessons(), dn = all.filter(function(o){ return coIsDone(o.l.id); }).length;
  document.getElementById("prog").textContent =
    "Chặng " + ltCurrent() + "/" + (ltStages().length - 1) + " · " + dn + "/" + all.length + " bài";
}

/* ---------------- trang tong quan cua Cap / Chang ---------------- */
function coLevelOf(n){
  return (COURSE.levels || []).filter(function(lv){ return lv.stages.indexOf(n) > -1; })[0] || null;
}
function coStageCard(x, cur){
  var d = ltStat(x);
  return '<div class="lt-stage' + (x.n === cur ? " on" : "") + (d.done ? " done" : "") + '">' +
           '<button type="button" class="lt-hd" data-l="S:' + x.n + '">' +
             '<span class="no">' + (d.done ? "✓" : x.n) + "</span>" +
             '<span class="tx"><b>' + esc(ltStageName(x)) + "</b><i>" + esc(x.goal || "") + "</i>" +
               (x.topics.length ? '<i class="tp">' + x.topics.map(ltTopicName).map(esc).join(" · ") + "</i>" : "") +
             "</span>" +
             '<span class="pc">' + d.ld + "/" + d.ln + " bài</span>" +
           "</button>" +
           '<div class="lt-bar co-bar"><i class="' + (d.lPc === 100 ? "full" : "") +
             '" style="width:' + d.lPc + '%"></i></div>' +
         "</div>";
}
function coWire(){
  mainEl.querySelectorAll("[data-l]").forEach(function(b){
    b.onclick = function(){ coOpen(b.getAttribute("data-l")); };
  });
}
function coDrawLevel(id){

          '<p class="sub">' + xs.length + " chặng · " + nl + " bài · đã xong " + nd + "</p>";

}
function coDrawStage(n){

             (l.sub && l.sub !== CO_KIND[l.kind] ? " · " + esc(l.sub) : "") +

/* ---------------- dieu huong ---------------- */
/* Nap moi du lieu ma cac buoc can — goi truoc MOI lan ve, de vao bai bang duong
   nao (tab, nut Hoc tiep, phim mui ten) cung khong gap buoc "khong tim thay". */
function coEnsure(){
  var need = [];
  if(!COURSE) need.push(loadCourse().then(function(c){ COURSE = c && (c.stages || []).length ? c : null; }).catch(function(){}));
  if(!READING) need.push(loadReading().then(function(d){ READING = d; }).catch(function(){}));
  if(!PRODUCE) need.push(loadProduce().then(function(d){ PRODUCE = d; }).catch(function(){}));
  if(!TOEIC)   need.push(loadToeic().then(function(d){ TOEIC = d; }).catch(function(){}));
  return Promise.all(need);
}
function viewRoadmap(){
  coStopTimers();
  if(!COURSE || !READING || !PRODUCE || !TOEIC)
    mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải khóa học…</p>';
  coEnsure().then(function(){
    if(current !== "lt") return;
    if(!LT.open) LT.open = load("co_last", "");
    if(LT.open && !coFind(LT.open) && !/^[LS]:/.test(LT.open)) LT.open = "";
    buildRoadmapSide();
    coDraw();
  });
}
function coOpen(id){
  LT.open = id || "";
  save("co_last", LT.open);
  if(current !== "lt") return show("lt");
  if(coFind(LT.open)) coTreeShow(LT.open);
  coEnsure().then(function(){
    buildRoadmapSide();
    coDraw();
  });
}
function coDraw(){
  coStopTimers();
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  window.scrollTo(0, 0);
  if(!COURSE){
    mainEl.innerHTML = '<div class="eyebrow">Khóa học</div><h1>Khóa học</h1>' +
      '<div class="soon"><div class="big">&#128506;</div>' +
      "<p><b>Chưa có dữ liệu khóa học.</b></p>" +
      "<p>Chạy <code>python make-course.py --write</code> rồi <code>build.bat</code>.</p></div>";
    return;
  }
  if(LT.open && coFind(LT.open)) return coDrawLesson(LT.open);
  if(/^L:/.test(LT.open)) return coDrawLevel(LT.open.slice(2));
  if(/^S:\d+$/.test(LT.open)) return coDrawStage(+LT.open.slice(2));
  coDrawHome();
}
/* giu ten cu: smoke va cac cho goi khac van dung duoc */
function drawRoadmap(){ coDraw(); }

/* ---------------- trang tong quan ---------------- */

              "toàn khóa " + dn + "/" + all.length + " bài</p>" +
            '<div class="ot-bar" style="margin:14px 0 0"><button type="button" class="btn go" data-l="' +
              escAttr(coNextLesson(cur)) + '">Học tiếp &rarr;</button></div></div>';
  if(skipTo > 1){
    h += '<p class="lt-skip">Bài kiểm tra đầu vào gợi ý bắt đầu từ nhóm ' + skipTo +
         " — các chặng trước đó bạn có thể lướt nhanh, làm bài Kiểm tra chặng để xác nhận.</p>";

    h += '<h2 class="co-lvh"><span class="lv">' + esc(lv.id) + "</span>" + esc(lv.name) + "</h2>";

                 (x.topics.length ? '<i class="tp">' + x.topics.map(ltTopicName).map(esc).join(" · ") + "</i>" : "") +
               "</span>" +
               '<span class="pc">' + d.ld + "/" + d.ln + " bài</span>" +
             "</button>" +
             '<div class="lt-bar co-bar"><i class="' + (d.lPc === 100 ? "full" : "") +
               '" style="width:' + d.lPc + '%"></i></div>' +

/* ---------------- trang bai hoc ---------------- */
var CO_LABEL = { basic: "Bài nhập môn", grammar: "Ngữ pháp", vocab: "Từ vựng",
                 frame: "Khung câu & đóng vai", skill: "Kỹ năng", read: "Đọc hiểu",
                 timed: "Nói bấm giờ", prompt: "Nói / viết có bài mẫu", verbs: "Động từ bất quy tắc",
                 toeic: "Luyện TOEIC", check: "Kiểm tra chặng", cando: "Tự xác nhận: làm được gì" };
var CO_KIND = { main: "Bài chính", skill: "Kỹ năng", read: "Đọc", produce: "Nói & viết",
                toeic: "TOEIC", check: "Kiểm tra", vocab: "Từ vựng" };

function coDrawLesson(id){
  var f = coFind(id), x = f.st, l = f.l;

           '<div class="co-sb"><p style="color:var(--muted)">Đang tải…</p></div>' +

  l.steps.forEach(function(s, i){
    var body = secs[i].querySelector(".co-sb");

      .catch(function(err){
        body.innerHTML = '<p style="color:var(--bad)">Không vẽ được bước này: ' + esc(err && err.message || err) + "</p>";

function coStepTitle(s){
  var it;
  switch(s.t){
    case "basic":   it = (BFLAT || []).filter(function(z){ return z.id === s.id; })[0];
                    return "Nhập môn " + pad3(s.id).slice(1) + (it ? " · " + (it.vi || it.pat) : "");
    case "grammar": it = (GFLAT || []).filter(function(z){ return z.id === s.id; })[0];
                    return "Bài " + pad3(s.id).slice(1) + (it ? " · " + (it.vi || it.pat) : "");
    case "skill":   it = (SFLAT || []).filter(function(z){ return z.id === s.id; })[0];
                    return "Kỹ năng " + pad3(s.id).slice(1) + (it ? " · " + (it.vi || it.pat) : "");
    case "frame":   it = (FLAT || []).filter(function(z){ return z.id === s.id; })[0];
                    return "Khung " + pad3(s.id).slice(1) + (it ? " · " + it.pat : "");
    case "vocab":   return ltTopicName(s.topic) + " · " + (s.to - s.from) + " từ";
    case "read":    it = ((READING && READING.items) || []).filter(function(z){ return z.id === s.id; })[0];
                    return it ? it.title : "Bài đọc " + s.id;
    case "timed":   it = ((PRODUCE && PRODUCE.timed) || [])[s.i];
                    return it ? it.seconds + " giây" : "";
    case "prompt":  it = ((PRODUCE && PRODUCE.prompt) || [])[s.i];
                    return it ? (it.mode === "write" ? "Đề viết" : "Đề nói") : "";
    case "verbs":   it = ((VINDEX && VINDEX.patterns) || []).filter(function(z){ return z.id === s.pat; })[0];
                    return it ? it.name : s.pat;
    case "toeic":   it = tcPart(s.part);
                    return "Part " + s.part + (it ? " · " + it.name : "") + (s.tag ? " · " + tcTagName(s.tag) : "");
    case "check":   return "15 câu, đảo thứ tự";
    case "cando":   return (s.items || []).length + " việc";
  }
  return "";
}

/* Ve mot buoc vao `body`. Tra ve Promise (hoac gi cung duoc). */
function coStep(s, body, pfx, x, l){
  var docKind = { basic: "nm", grammar: "ng", skill: "sk" };
  if(docKind[s.t]){
    var ld = s.t === "basic" ? loadBasic : s.t === "grammar" ? loadLesson : loadSkill;
    return ld(s.id).then(function(f){
      body.innerHTML = f ? coDemote(renderDoc(f, docKind[s.t])) : '<p class="dt-hint">Bài này chưa soạn chi tiết.</p>';
      decorate(body);
    });
  }
  if(s.t === "frame") return loadFrame(s.id).then(function(f){
    body.innerHTML = f ? coDemote(renderDoc(f, "kc")) : '<p class="dt-hint">Khung này chưa soạn chi tiết.</p>';
    decorate(body);
    var rp = rpList().filter(function(r){ return r.f === s.id; })[0];
    if(f && rp && s.rp){
      var box = document.createElement("div");
      box.className = "co-rp";
      body.appendChild(box);
      coRoleplay(box, rp, f);
    }
  });
  if(s.t === "vocab")  return coVocab(body, s, pfx);
  if(s.t === "verbs")  return coVerbs(body, s, pfx);
  if(s.t === "read")   return coReading(body, s, pfx);
  if(s.t === "timed")  return coTimed(body, ((PRODUCE && PRODUCE.timed) || [])[s.i], pfx);
  if(s.t === "prompt") return coPrompt(body, ((PRODUCE && PRODUCE.prompt) || [])[s.i], pfx);
  if(s.t === "toeic")  return coToeic(body, s, pfx);
  if(s.t === "check")  return coCheck(body, s.g, x, pfx);
  if(s.t === "cando")  return coCando(body, s, pfx);
  body.innerHTML = '<p style="color:var(--bad)">[Bước không rõ kiểu: ' + esc(s.t) + "]</p>";
}

/* Bai goc co eyebrow + h1 + h2 danh so. Nhung vao mot buoc thi ha mot bac: h1 -> h3,
   h2 -> h4, de muc luc cua bai khoa hoc van la tieu de lon nhat trang. */
function coDemote(html){
  return html.replace(/<h1>/g, '<h3 class="co-h1">').replace(/<\/h1>/g, "</h3>")
             .replace(/<h2>/g, '<h4 class="co-h2">').replace(/<\/h2>/g, "</h4>");
}

/* Chon mot dap an trong nhom nut .pt-opts — dung chung cho doc, TOEIC, kiem tra. */
function coOptsHTML(qi, opts, pick, done, a, pfx){
  var h = '<div class="pt-opts">';
  opts.forEach(function(o, j){
    var on = done ? (j === a || j === pick) : j === pick;
    h += '<button type="button" class="' + (on ? "pick" : "") + '" data-q="' + qi + '" data-o="' + j +
         '"' + (done ? " disabled" : "") + ">" + o + "</button>";
  });
  return h + "</div>";
}

/* ---- buoc: tu vung (the tu + tu kiem tra, ghi thang vao SRS) ---- */
function coVocab(body, s, pfx){
  var ws = ((CINDEX && CINDEX.words) || []).filter(function(w){ return w[3] === s.topic; }).slice(s.from, s.to);
  var hide = false;
  function draw(){
    var known = ws.filter(function(w){ return srsBox("v:" + hash36(w[0] + "|" + w[3])) >= LT_BOX; }).length;
    var h = '<p class="dt-hint">Đọc từng từ, bấm 🔊 nghe rồi nói theo. Sau đó bật <b>Che nghĩa</b>, tự nhớ lại nghĩa ' +
            "rồi bấm <b>Nhớ</b> / <b>Chưa nhớ</b> — kết quả ghi thẳng vào tab Ôn tập, từ lên hộp " + LT_BOX +
            " là tính đã thuộc. Đã thuộc: <b>" + known + "/" + ws.length + "</b>.</p>" +
            '<div class="ot-bar" style="margin:0 0 12px"><button type="button" class="btn" data-hide>' +
              (hide ? "Hiện nghĩa" : "Che nghĩa") + "</button></div>" +
            '<div class="co-words' + (hide ? " hide" : "") + '">';
    ws.forEach(function(w, i){
      var id = "v:" + hash36(w[0] + "|" + w[3]), bx = srsBox(id);
      var det = vcDetail(w) || {};
      var syn = (det.syn || []).map(function(p){ return p[0]; }).slice(0, 3);
      var ant = (det.ant || []).map(function(p){ return p[0]; }).slice(0, 2);
      h += '<div class="co-w' + (bx >= LT_BOX ? " known" : "") + '" data-i="' + i + '">' +
             '<div class="hd"><b class="w">' + esc(w[0]) + "</b>" +
               '<button class="say" type="button" title="Nghe" data-say="' + escAttr(w[0]) + '">🔊</button>' +
               (w[7] ? '<span class="ipa">' + esc(w[7]) + "</span>" : "") +
               '<span class="pos">' + esc(w[1]) + "</span>" +
               (bx ? '<span class="bx">hộp ' + bx + "</span>" : "") + "</div>" +
             '<div class="mean">' + esc(w[2]) + "</div>" +
             (w[4] ? '<div class="ex"><span class="en">' + esc(w[4]) + "</span>" +
               ' <button class="say" type="button" title="Nghe câu" data-say="' + escAttr(w[4]) + '">🔊</button>' +
               '<span class="vi">' + esc(w[5] || "") + "</span></div>" : "") +
             (syn.length || ant.length ? '<div class="rel">' +
               (syn.length ? "≈ " + syn.map(esc).join(", ") : "") +
               (syn.length && ant.length ? " · " : "") +
               (ant.length ? "≠ " + ant.map(esc).join(", ") : "") + "</div>" : "") +
             '<div class="gr"><button type="button" class="btn" data-ok="1" data-i="' + i + '">Nhớ</button>' +
               '<button type="button" class="btn" data-ok="0" data-i="' + i + '">Chưa nhớ</button></div>' +
           "</div>";
    });
    body.innerHTML = h + "</div>";
    body.querySelector("[data-hide]").onclick = function(){ hide = !hide; draw(); };
    body.querySelectorAll("[data-say]").forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); speak(b.getAttribute("data-say")); };
    });
    body.querySelectorAll(".co-w").forEach(function(c){
      c.onclick = function(e){ if(!e.target.closest("button")) c.classList.toggle("peek"); };
    });
    body.querySelectorAll("[data-ok]").forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var w = ws[parseInt(b.getAttribute("data-i"), 10)];
        srsGrade({ id: "v:" + hash36(w[0] + "|" + w[3]), deck: "vc" }, b.getAttribute("data-ok") === "1");
        draw();
        buildRoadmapSide();
      };
    });
  }
  draw();
}

/* ---- buoc: dong tu bat quy tac theo nhom ---- */
function coVerbs(body, s, pfx){
  var pat = ((VINDEX && VINDEX.patterns) || []).filter(function(p){ return p.id === s.pat; })[0] || {};
  var vs = ((VINDEX && VINDEX.verbs) || []).filter(function(v){ return v[4] === s.pat; })
             .sort(function(a, b){ return b[5] - a[5] || (a[0] < b[0] ? -1 : 1); });
  var hide = false;
  function draw(){
    var h = '<p class="dt-hint">Nhóm <b>' + esc(pat.name || s.pat) + "</b>" +
            (pat.hint ? " — ví dụ <i>" + esc(pat.hint) + "</i>" : "") +
            ". Từ in đậm là từ hay gặp, học trước. Bật <b>Che V2 · V3</b> để tự kiểm tra; " +
            "bấm vào ô bị che để xem.</p>" +
            '<div class="ot-bar" style="margin:0 0 10px"><button type="button" class="btn" data-hide>' +
              (hide ? "Hiện V2 · V3" : "Che V2 · V3") + "</button></div>" +
            '<div class="tbl"><table class="co-vb' + (hide ? " hide" : "") + '"><thead><tr><th>V1</th><th>V2</th><th>V3</th><th>Nghĩa</th></tr></thead><tbody>';
    vs.forEach(function(v){
      h += "<tr" + (v[5] ? ' class="hot"' : "") + "><td>" + esc(v[0]) +
           ' <button class="say" type="button" data-say="' + escAttr(v[0] + ", " + v[1] + ", " + v[2]) + '">🔊</button></td>' +
           '<td class="h">' + esc(v[1]) + '</td><td class="h">' + esc(v[2]) + "</td><td>" + esc(v[3]) + "</td></tr>";
    });
    body.innerHTML = h + "</tbody></table></div>";
    body.querySelector("[data-hide]").onclick = function(){ hide = !hide; draw(); };
    body.querySelectorAll("td.h").forEach(function(td){ td.onclick = function(){ td.classList.toggle("peek"); }; });
    body.querySelectorAll("[data-say]").forEach(function(b){
      b.onclick = function(){ speak(b.getAttribute("data-say"), 0.8); };
    });
  }
  draw();
}

/* ---- buoc: bai doc (doc -> tra loi -> roi moi hien danh sach tu) ---- */
function coReading(body, s, pfx){
  var x = ((READING && READING.items) || []).filter(function(r){ return r.id === s.id; })[0];
  if(!x){ body.innerHTML = '<p class="dt-hint">Không tìm thấy bài đọc.</p>'; return; }
  // dap an trong file thuong nam o cot dau — tron lai moi lan mo de khong doan theo vi tri
  var qs = (x.q || []).map(function(q){
    var order = cpShuffle(q.opts.map(function(o, i){ return i; }));
    return { q: q.q, kind: q.kind, opts: order.map(function(i){ return q.opts[i]; }), a: order.indexOf(q.a) };
  });
  var ans = qs.map(function(){ return null; }), done = false, big = false;
  function draw(){
    var left = ans.filter(function(a){ return a === null; }).length;
    var n = (x.text || []).join(" ").split(/\s+/).length;
    var h = '<div class="rd-meta"><span class="pill lv">' + esc(x.lv) + "</span>" +
            '<span class="pill">' + n + " từ</span>" +
            '<button type="button" class="btn" data-big>' + (big ? "Cỡ chữ thường" : "Cỡ chữ to hơn") + "</button>" +
            '<button type="button" class="btn" data-read>🔊 Nghe cả bài</button></div>' +
            '<p class="sub" style="margin:6px 0 10px">' + esc(x.vi) + "</p>" +
            '<div class="rd-text' + (big ? " big" : "") + '">';
    (x.text || []).forEach(function(p){ h += "<p>" + esc(p) + "</p>"; });
    h += '</div><div class="rd-qs"><h4 class="co-h2">Câu hỏi</h4>';
    qs.forEach(function(q, i){
      var ok = ans[i] === q.a;
      h += '<div class="rd-q"><div class="hd"><span class="tag">' + esc(RD_KIND[q.kind] || q.kind || "") + "</span>" +
           '<span class="tx">' + (i + 1) + ". " + esc(q.q) + "</span></div>" +
           coOptsHTML(i, q.opts.map(esc), ans[i], done, q.a, pfx);
      if(done) h += '<p class="pt-why' + (ok ? "" : " bad") + '">' +
                    (ok ? "✓ Đúng." : "✗ Đáp án đúng: <b>" + esc(q.opts[q.a]) + "</b>.") + "</p>";
      h += "</div>";
    });
    h += "</div>";
    if(done){
      var right = qs.filter(function(q, i){ return ans[i] === q.a; }).length;
      h += '<div class="pt-res"><div class="lv">' + right + "/" + qs.length + "</div><p class=\"say\">" +
           (right >= 4 ? "Đọc hiểu tốt. Giờ mới xem danh sách từ bên dưới."
                       : "Dưới ngưỡng. Đọc lại một lượt nữa rồi mới xem danh sách từ.") + "</p></div>" +
           '<div class="rd-gloss"><div class="hd">Từ chủ đề xuất hiện trong bài</div><div class="rd-gw">';
      (x.gloss || []).forEach(function(g){
        h += '<button type="button" data-say="' + escAttr(g[0]) + '"><b>' + esc(g[0]) + "</b><i>" + esc(g[1]) +
             "</i><span>" + esc(g[2]) + "</span></button>";
      });
      h += "</div></div>";
    }else{
      h += '<div class="ot-bar"><button type="button" class="btn go" data-check' + (left ? " disabled" : "") + ">" +
           (left ? "Còn " + left + " câu chưa trả lời" : "Chấm bài") + "</button></div>";
    }
    body.innerHTML = h;
    body.querySelectorAll(".pt-opts button").forEach(function(b){
      b.onclick = function(){ ans[+b.getAttribute("data-q")] = +b.getAttribute("data-o"); draw(); };
    });
    body.querySelector("[data-big]").onclick = function(){ big = !big; draw(); };
    body.querySelector("[data-read]").onclick = function(){ speakSeq(x.text || [], 0.9); };
    var ck = body.querySelector("[data-check]");
    if(ck) ck.onclick = function(){ done = true; draw(); };
    body.querySelectorAll(".rd-gw [data-say]").forEach(function(b){
      b.onclick = function(){ speak(b.getAttribute("data-say")); };
    });
  }
  draw();
}

/* ---- buoc: noi bam gio (thang tu soat hien SAU khi het gio) ---- */
function coTimed(body, it, pfx){
  if(!it){ body.innerHTML = '<p class="dt-hint">Không tìm thấy đề.</p>'; return; }
  var left = it.seconds, on = false, done = false, tick = null, ticked = [];
  function stop(){ if(tick){ clearInterval(tick); tick = null; } on = false; }
  function draw(){
    var h = '<div class="dt-card"><div class="tm-clock' + (on ? " run" : (done ? " end" : "")) + '" data-clock>' +
              tmFmt(Math.max(0, left)) + "</div>" +
            '<div class="tm-ring"><i class="' + (done ? "end" : "") + '" data-ring style="width:' +
              Math.round(left * 100 / it.seconds) + '%"></i></div>' +
            '<p class="tm-task">' + esc(it.task) + "</p>" +
            (it.start ? '<p class="tm-start">Mở lời bằng: <code>' + esc(it.start) + "</code></p>" : "");
    if(done){
      h += '<div class="tm-must"><div class="hd">Hết giờ — tự soát lại</div><ul>';
      (it.must || []).forEach(function(m, i){
        h += '<li><button type="button" class="bx" data-t="' + i + '">' + (ticked.indexOf(i) > -1 ? "☑" : "☐") +
             "</button>" + esc(m) + "</li>";
      });
      h += "</ul></div>";
    }else{
      h += '<p class="dt-hint">Thang tự soát hiện <b>sau khi hết giờ</b>. <b>Nói thành tiếng</b>, đừng nghĩ thầm.</p>';
    }
    h += '</div><div class="ot-bar">';
    if(!on && !done) h += '<button type="button" class="btn go" data-go1>Bắt đầu nói</button>';
    if(on) h += '<button type="button" class="btn" data-stop>Dừng</button>';
    if(done) h += '<button type="button" class="btn go" data-again>Nói lại</button>';
    body.innerHTML = h + "</div>";
    var b;
    if((b = body.querySelector("[data-go1]"))) b.onclick = run;
    if((b = body.querySelector("[data-stop]"))) b.onclick = function(){ stop(); done = true; draw(); };
    if((b = body.querySelector("[data-again]"))) b.onclick = function(){ stop(); left = it.seconds; done = false; ticked = []; draw(); };
    body.querySelectorAll(".tm-must .bx").forEach(function(x){
      x.onclick = function(){
        var i = +x.getAttribute("data-t"), at = ticked.indexOf(i);
        if(at > -1) ticked.splice(at, 1); else ticked.push(i);
        draw();
      };
    });
  }
  /* Chi ve lai DONG HO va THANH moi giay — ve ca buoc thi nut Dung bi thay lien tuc. */
  function run(){
    coStopTimers();            // moi luc chi mot dong ho chay
    stop(); left = it.seconds; on = true; done = false; draw();
    tick = setInterval(function(){
      left--;
      var c = body.querySelector("[data-clock]"), r = body.querySelector("[data-ring]");
      if(!c || !document.body.contains(c)){ stop(); return; }
      c.textContent = tmFmt(Math.max(0, left));
      r.style.width = Math.max(0, Math.round(left * 100 / it.seconds)) + "%";
      if(left <= 0){ stop(); done = true; speak("Time is up.", 0.9); draw(); }
    }, 1000);
    CO_TIMERS.push(tick);
  }
  draw();
}

/* ---- buoc: de noi / viet (bai mau va thang tu cham hien SAU) ---- */
function coPrompt(body, it, pfx){
  if(!it){ body.innerHTML = '<p class="dt-hint">Không tìm thấy đề.</p>'; return; }
  var said = "", reveal = false, ticked = [];
  function draw(){
    var h = '<p class="tm-task">' + esc(it.task) + "</p>" +
            '<div class="pr-must"><div class="hd">Bắt buộc có</div><ul>';
    (it.must || []).forEach(function(m){ h += "<li>" + esc(m) + "</li>"; });
    h += "</ul></div>";
    if(it.mode === "write"){
      h += '<textarea class="pr-work" data-work placeholder="Viết bài của bạn ở đây…">' + esc(said) + "</textarea>" +
           '<p class="pr-count" data-count>0 từ</p>';
    }else{
      h += '<div class="dt-card"><p class="dt-hint" style="margin:0"><b>Nói thành tiếng</b> rồi mới bấm xem bài mẫu. ' +
           "Thu lại bằng điện thoại để nghe lại càng tốt.</p></div>";
    }
    if(reveal){
      h += '<div class="pr-model"><div class="hd">Bài mẫu — một cách làm, không phải cách duy nhất</div>' +
             '<div class="bd">' + esc(it.model || "") + "</div></div>" +
           '<div class="pr-check"><div class="hd">Tự chấm</div>';
      (it.check || []).forEach(function(q, i){
        var on = ticked.indexOf(i) > -1;
        h += '<div class="q"><button type="button" class="bx' + (on ? " on" : "") + '" data-c="' + i + '">' +
             (on ? "✓" : "") + "</button>" + esc(q) + "</div>";
      });
      h += "</div>";
    }else{
      h += '<div class="ot-bar"><button type="button" class="btn go" data-show>Tôi làm xong rồi — xem bài mẫu</button></div>';
    }
    body.innerHTML = h;
    var work = body.querySelector("[data-work]");
    if(work){
      var count = function(){
        var n = work.value.trim() ? work.value.trim().split(/\s+/).length : 0;
        body.querySelector("[data-count]").textContent = n + " từ";
      };
      work.addEventListener("input", function(){ said = work.value; count(); });
      count();
    }
    var sh = body.querySelector("[data-show]");
    if(sh) sh.onclick = function(){ reveal = true; draw(); };
    body.querySelectorAll(".pr-check .bx").forEach(function(b){
      b.onclick = function(){
        var i = +b.getAttribute("data-c"), at = ticked.indexOf(i);
        if(at > -1) ticked.splice(at, 1); else ticked.push(i);
        draw();
      };
    });
  }
  draw();
}

/* ---- buoc: TOEIC — de bai hoan toan tieng Anh, cham ngay tung cau ----
   Part 2: chi co tieng (cau hoi va lua chon KHONG in ra cho den khi tra loi).
   Part 3: hoi thoai la tieng, cau hoi co in. Part 5 / 7: doc. */
function coToeic(body, s, pfx){
  var bank = tcBank(s.part), meta = tcPart(s.part) || {};
  var list = s.tag ? bank.filter(function(q){ return q.tag === s.tag; })
                   : bank.slice(s.from || 0, s.to == null ? bank.length : s.to);
  var groups = list.map(function(it){ return { it: it, qs: tcQs(it) }; });
  var ans = {}, L = "ABCD";
  function key(i, j){ return i + ":" + j; }
  function draw(){
    var total = 0, ok = 0, seen = 0;
    var h = (meta.desc ? '<p class="dt-hint">' + esc(meta.desc) + "</p>" : "") +
            (meta.tip ? '<div class="callout">' + meta.tip + "</div>" : "");
    groups.forEach(function(g, i){
      var it = g.it;
      h += '<div class="pt-q co-tc">';
      if(it.qs && it.lines){                     // Part 3 — hoi thoai nghe
        h += '<div class="no">' + esc(it.who || "Conversation") + "</div>" +
             '<div class="ot-bar" style="margin:4px 0 10px"><button type="button" class="btn" data-play="' + i + '">🔊 Nghe hội thoại</button></div>';
      }else if(it.qs){                           // Part 7 — van ban
        h += '<div class="no">' + esc(it.label || it.kind || "") + (it.title ? " · " + esc(it.title) : "") + "</div>" +
             '<div class="co-doc">' + (it.head || []).map(function(r){ return "<div><b>" + esc(r[0]) + ":</b> " + esc(r[1]) + "</div>"; }).join("") +
             (it.text || []).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("") + "</div>";
      }
      g.qs.forEach(function(q, j){
        var k = key(i, j), pick = ans[k], done = pick != null, audio2 = !it.qs && meta.audio;
        total++; if(done){ seen++; if(pick === q.a) ok++; }
        h += '<div class="co-tq">';
        if(audio2){
          h += '<div class="ot-bar" style="margin:0 0 8px"><button type="button" class="btn" data-say2="' + i + '">🔊 Nghe câu hỏi và 3 câu đáp</button></div>';
          if(done) h += '<div class="en">' + esc(q.q) + "</div>";
        }else{
          h += '<div class="en">' + (g.qs.length > 1 ? (j + 1) + ". " : "") + esc(q.q) + "</div>";
        }
        var labels = q.opts.map(function(o, z){ return "(" + L[z] + ") " + (audio2 && !done ? "" : esc(o)); });
        h += coOptsHTML(k, labels, pick == null ? null : pick, done, q.a, pfx);
        if(done){
          h += '<p class="pt-why' + (pick === q.a ? "" : " bad") + '">' + (pick === q.a ? "✓ " : "✗ Đáp án: <b>(" + L[q.a] + ")</b>. ") +
               (q.why || "") + (q.trap ? "<br>" + q.trap : "") + "</p>";
        }
        h += "</div>";
      });
      if(it.qs && it.lines && g.qs.every(function(q, j){ return ans[key(i, j)] != null; })){
        h += '<div class="co-doc">' + it.lines.map(function(ln){ return "<div><b>" + esc(ln[0]) + ":</b> " + esc(ln[1]) + "</div>"; }).join("") + "</div>";
      }
      h += "</div>";
    });
    h += '<p class="dt-hint co-score">Đã làm ' + seen + "/" + total + " câu · đúng " + ok + "</p>";
    body.innerHTML = h;
    body.querySelectorAll(".pt-opts button").forEach(function(b){
      b.onclick = function(){ ans[b.getAttribute("data-q")] = +b.getAttribute("data-o"); draw(); };
    });
    body.querySelectorAll("[data-play]").forEach(function(b){
      b.onclick = function(){ speakSeq(groups[+b.getAttribute("data-play")].it.lines.map(function(l){ return l[1]; }), 0.95); };
    });
    body.querySelectorAll("[data-say2]").forEach(function(b){
      b.onclick = function(){
        var q = groups[+b.getAttribute("data-say2")].it;
        speakSeq([q.q].concat(q.opts.map(function(o, z){ return L[z] + ". " + o; })), 0.95);
      };
    });
  }
  draw();
}

/* ---- buoc: kiem tra chang ----
   Chang 1-12: rut tu pairs/quiz cua cac bai trong nhom (cpHarvest, muc 21b).
   Chang 0: rut tu 26 bai Nhap mon theo dung cach do.
   Chang 13: rut tu cau vi du cua tu vung — duc lo dung tu do, 4 lua chon CUNG CHU DE.
   Chi lay cau ma tu xuat hien NGUYEN DANG trong cau, de dap an dung la duy nhat. */
function coCheckPool(key){
  if(key === "s0"){
    var ids = (BFLAT || []).map(function(b){ return b.id; });
    return Promise.all(ids.map(loadBasic)).then(function(d){ return cpHarvest(d.filter(Boolean)); });
  }
  if(key === "s13"){
    var x = ltStages().filter(function(s){ return s.n === 13; })[0];
    var out = [];
    (x ? x.topics : []).forEach(function(t){
      var ws = ((CINDEX && CINDEX.words) || []).filter(function(w){ return w[3] === t; });
      ws.forEach(function(w){
        var re = new RegExp("\\b" + w[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
        if(!w[4] || !re.test(w[4])) return;
        var others = cpShuffle(ws.filter(function(o){ return o[0] !== w[0] && !re.test(o[0]) &&
                       !new RegExp("\\b" + o[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(w[4]); }))
                       .slice(0, 3).map(function(o){ return o[0]; });
        if(others.length < 3) return;
        var opts = cpShuffle([w[0]].concat(others));
        out.push({ kind: "gap", vi: w[5] || "", q: w[4].replace(re, "_____"),
                   opts: opts.map(esc), a: opts.indexOf(w[0]),
                   why: "<b>" + esc(w[0]) + "</b> — " + esc(w[2]), lesson: 0, title: ltTopicName(t) });
      });
    });
    return Promise.resolve(out);
  }
  return cpLoadGroup(key).then(cpHarvest);
}
function coCheck(body, key, x, pfx){
  var qs = null, ans = null, done = false, res = null;
  function start(){
    body.innerHTML = '<p style="color:var(--muted)">Đang chuẩn bị đề…</p>';
    return coCheckPool(key).then(function(all){
      if(all.length < 5){ body.innerHTML = '<p class="dt-hint">Chưa đủ câu để ra đề.</p>'; return; }
      qs = cpPick(all); ans = qs.map(function(){ return null; }); done = false; res = null;
      draw();
    });
  }
  function draw(){
    var left = ans.filter(function(a){ return a === null; }).length;
    var prev = cpAllRes()[key];
    var h = '<p class="dt-hint">' + qs.length + " câu, đảo thứ tự mỗi lần làm. Đạt từ " + ltPass().check +
            "% là qua phần kiểm tra của chặng" + (prev && !done ? " · lần trước: <b>" + prev.pc + "%</b>" : "") + ".</p>";
    if(done){
      var pass = res.pc >= ltPass().check;
      h += '<div class="pt-res"><div class="lv">' + res.pc + '%</div><div class="lvn">Đúng ' + res.ok + " / " + res.n +
           ' câu</div><p class="say">' + (pass ? "Đạt. Phần kiểm tra của chặng này đã xong."
           : "Chưa đạt. Xem lại các câu sai bên dưới, ôn lại bài liên quan rồi làm đề khác.") + "</p></div>";
    }
    qs.forEach(function(q, i){
      var ok = ans[i] === q.a;
      h += '<div class="pt-q' + (ans[i] !== null ? " done" : "") + '"><div class="no">Câu ' + (i + 1) + " / " + qs.length + "</div>" +
           (q.vi ? '<div class="vi">' + esc(q.vi) + "</div>" : "") + (q.q ? '<div class="en">' + esc(q.q) + "</div>" : "") +
           coOptsHTML(i, q.opts, ans[i], done, q.a, pfx);
      if(done) h += '<p class="pt-why' + (ok ? "" : " bad") + '">' + (ok ? "✓ Đúng. " : "✗ Đáp án đúng: <b>" + q.opts[q.a] + "</b>. ") +
                    q.why + (q.lesson && !ok ? " <i>(" + esc(q.title) + ")</i>" : "") + "</p>";
      h += "</div>";
    });
    h += '<div class="ot-bar">' + (done ? '<button type="button" class="btn go" data-again>Làm lại đề khác</button>'
         : '<button type="button" class="btn go" data-done' + (left ? " disabled" : "") + ">" +
           (left ? "Còn " + left + " câu chưa chọn" : "Chấm bài") + "</button>") + "</div>";
    body.innerHTML = h;
    body.querySelectorAll(".pt-opts button").forEach(function(b){
      b.onclick = function(){ ans[+b.getAttribute("data-q")] = +b.getAttribute("data-o"); draw(); };
    });
    var d = body.querySelector("[data-done]");
    if(d) d.onclick = function(){
      var ok = qs.filter(function(q, i){ return ans[i] === q.a; }).length;
      res = { ok: ok, n: qs.length, pc: Math.round(ok * 100 / qs.length), at: Date.now() };
      cpSaveRes(key, res);
      done = true; draw(); buildRoadmapSide();
      if(body.scrollIntoView) body.scrollIntoView({ block: "start" });
    };
    var ag = body.querySelector("[data-again]");
    if(ag) ag.onclick = start;
  }
  return start();
}

/* ---- buoc: can-do (tu xac nhan, khong cho diem) ---- */
function coCando(body, s, pfx){
  function find(k){
    var p = k.split("|"), lv = ((CANDO && CANDO.levels) || []).filter(function(l){ return l.lv === p[0]; })[0];
    return lv ? lv.items[+p[1]] : null;
  }
  function draw(){
    var done = cdDone();
    var h = '<p class="dt-hint">Không chấm điểm. Làm thử đề tự kiểm chứng, đạt đúng mốc thì mới tích.</p>';
    (s.items || []).forEach(function(k){
      var it = find(k);
      if(!it) return;
      var on = done.indexOf(k) > -1;
      h += '<div class="co-cd' + (on ? " on" : "") + '"><button type="button" class="bx" data-k="' + escAttr(k) + '">' +
           (on ? "☑" : "☐") + "</button><div><b>" + it.do + '</b><div class="tk"><i>Thử:</i> ' + it.task +
           '</div><div class="tk"><i>Đạt khi:</i> ' + it.ok + "</div></div></div>";
    });
    body.innerHTML = h;
    body.querySelectorAll("[data-k]").forEach(function(b){
      b.onclick = function(){
        var k = b.getAttribute("data-k"), list = cdDone().slice(), at = list.indexOf(k);
        if(at > -1) list.splice(at, 1); else list.push(k);
        cdSave(list); draw();
      };
    });
  }
  draw();
}

/* ---- chan trang: Hoan thanh bai + Truoc / Sau ---- */
function coMark(l, on){
  var i = coDone.indexOf(l.id);
  if(on && i < 0) coDone.push(l.id);
  if(!on && i > -1) coDone.splice(i, 1);
  save("co_done", coDone);
  // Bai chinh xong thi bai goc cung xong — tab Ngu phap / Nhap mon / Ky nang khong lech
  if(on && (l.kind === "main" || l.kind === "skill")){
    l.steps.forEach(function(s){
      var arr = s.t === "grammar" ? ngDone : s.t === "basic" ? nmDone : s.t === "skill" ? skDone : null;
      var key = s.t === "grammar" ? "ng_done" : s.t === "basic" ? "nm_done" : "sk_done";
      if(arr && arr.indexOf(s.id) < 0){ arr.push(s.id); save(key, arr); }
    });
  }
}
function coFooter(f){
  var l = f.l, all = f.all;
  var pv = f.at > 0 ? all[f.at - 1].l : null, nx = f.at < all.length - 1 ? all[f.at + 1].l : null;
  var bar = document.createElement("div");
  bar.className = "done-bar";
  var mark = document.createElement("button");
  mark.className = "btn" + (coIsDone(l.id) ? "" : " go");
  mark.textContent = coIsDone(l.id) ? "✓ Đã hoàn thành bài" : "Hoàn thành bài này";
  mark.onclick = function(){
    var on = !coIsDone(l.id);
    coMark(l, on);
    if(on && nx) coOpen(nx.id); else { buildRoadmapSide(); coDraw(); }
  };
  bar.appendChild(mark);
  var nav = document.createElement("div");
  nav.className = "nav";
  if(pv){
    var pb = document.createElement("button");
    pb.className = "btn"; pb.textContent = "← Bài trước";
    pb.title = pv.title; pb.onclick = function(){ coOpen(pv.id); };
    nav.appendChild(pb);
  }
  if(nx){
    var nb = document.createElement("button");
    nb.className = "btn"; nb.textContent = "Bài sau →";
    nb.title = nx.title; nb.onclick = function(){ coOpen(nx.id); };
    nav.appendChild(nb);
  }
  bar.appendChild(nav);
  mainEl.appendChild(bar);
}
function coStepLesson(d){
  var f = coFind(LT.open);
  if(!f) return;
  var to = f.all[f.at + d];
  if(to) coOpen(to.l.id);
}

/* Mo mot chu de trong tab Tu vung — giu cho cac noi khac con goi. */
function vcOpenTopic(id){
  VC.q = ""; VC.hot = false; VC.lv = ""; VC.sel = "";
  VC.topic = id; VC.page = 1;
  show("vc");
}

/* ===================== LUYEN TOEIC (muc 25) =====================
   Bai tap o day KHAC HAN bai tap cac tab khac, co chu dich:
     - de bai HOAN TOAN bang tieng Anh, khong co cau tieng Viet dan duong
     - bon lua chon (cac tab khac thuong hai hoac tu luan)
     - boi canh cong so, khong phai doi thuong
   Vi vay cau hoi duoc VIET MOI, khong rut tu khoi "quiz"/"pairs" san co:
   format cu khong dung duoc, va rut lai thi nguoi hoc gap lai dung cau da lam.

   Moi cau cham NGAY khi chon, va gan mot NHAN LOAI (tu loai, gioi tu, thi...)
   de cuoi buoi noi duoc "ban yeu phan nao" chu khong chi mot con so. */
var TC = { part: 0, i: 0, ans: null, order: null, show: false };

function tcParts(){ return (TOEIC && TOEIC.parts) || []; }
function tcBank(p){ return (TOEIC && TOEIC["p" + p]) || []; }
function tcPart(p){ return tcParts().filter(function(x){ return x.p === p; })[0] || null; }
function tcTagName(t){ return ((TOEIC && TOEIC.tags) || {})[t] || t; }

/* Tron thu tu cau moi lan vao part — khong thi lam lan hai la thuoc vi tri. */
function tcStart(p){
  var n = tcBank(p).length;
  var idx = [];
  for(var i = 0; i < n; i++) idx.push(i);
  TC = { part: p, i: 0, ans: {}, order: cpShuffle(idx), show: false };
}

function tcCur(){
  if(!TC.part || !TC.order) return null;
  if(TC.i >= TC.order.length) return null;
  return tcBank(TC.part)[TC.order[TC.i]];
}

/* Mot muc trong ngan hang co the la MOT cau (Part 5) hoac MOT van ban kem
   nhieu cau (Part 7). Hai ham duoi cho phan con lai cua trang khong phai
   biet minh dang o part nao. */
function tcQs(it){ return it && it.qs ? it.qs : (it ? [it] : []); }
function tcCountQ(p){
  return tcBank(p).reduce(function(n, it){ return n + tcQs(it).length; }, 0);
}
/* Dap an luu theo "chi so muc : chi so cau con" de khong lan khi tron lai. */
function tcKey(i, j){ return i + ":" + j; }

function viewToeic(){
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  loadToeic().then(function(d){
    if(current !== "tc") return;
    TOEIC = d;
    drawToeic();
    window.scrollTo(0, 0);
  });
}

function buildToeicSide(){
  listEl.innerHTML = "";
  if(!tcParts().length){ document.getElementById("prog").textContent = ""; return; }
  var box = document.createElement("div");
  box.className = "tc-side";
  tcParts().forEach(function(x){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "row" + (TC.part === x.p ? " on" : "");
    b.innerHTML = '<span class="p">Part ' + x.p + "</span><span>" + esc(x.name) + "</span>";
    b.onclick = function(){
      tcStart(x.p); drawToeic(); document.body.classList.remove("open");
      window.scrollTo(0, 0);
    };
    box.appendChild(b);
  });
  listEl.appendChild(box);
  var tot = tcParts().reduce(function(a, x){ return a + tcCountQ(x.p); }, 0);
  document.getElementById("prog").textContent = tot + " câu trong ngân hàng";
}

function drawToeic(){
  if(!tcParts().length){
    mainEl.innerHTML = '<div class="eyebrow">Luyện thi</div><h1>Luyện TOEIC</h1>' +
      '<div class="soon"><div class="big">&#128221;</div>' +
      "<p><b>Chưa có dữ liệu bài tập.</b></p>" +
      "<p>Tạo <code>data/toeic.json</code> rồi chạy <code>build.bat</code>.</p></div>";
    return;
  }
  if(!TC.part) return drawToeicMenu();
  if(TC.i >= TC.order.length) return drawToeicResult();
  return drawToeicQ();
}

function drawToeicMenu(){
  var h = '<div class="eyebrow">Luyện thi</div><h1>' + esc(TOEIC.title || "Luyện TOEIC") + "</h1>" +
          '<p class="sub">' + esc(TOEIC.tagline || "") + "</p>" +
          (TOEIC.intro ? '<div class="callout">' + TOEIC.intro + "</div>" : "") +
          '<div class="tc-pick">';
  tcParts().forEach(function(x){
    h += '<button type="button" class="tc-card" data-p="' + x.p + '">' +
           '<span class="pn"><b>' + x.p + "</b><i>Part</i></span>" +
           '<span class="bd"><b>' + esc(x.name) + "</b>" +
             '<span class="en">' + esc(x.en || "") + "</span>" +
             '<span class="ds">' + esc(x.desc || "") + "</span>" +
             '<span class="nn">' + tcCountQ(x.p) + " câu trong ngân hàng · đề thật " +
               (x.real || "?") + " câu</span></span></button>";
  });
  h += "</div>";

  mainEl.querySelectorAll(".tc-card").forEach(function(b){
    b.onclick = function(){
      tcStart(parseInt(b.getAttribute("data-p"), 10));

    };
  });

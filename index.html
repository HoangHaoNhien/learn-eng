}

/* Mot khoi lua chon dung chung cho ca hai dang. */
function tcOptsHTML(q, pick, key, hideText){
  var done = pick !== undefined && pick !== null;
  var h = '<div class="tc-opts">';
  q.opts.forEach(function(o, j){
    var cls = "";
    if(done){
      if(j === q.a) cls = " ok";
      else if(j === pick) cls = " no";
    }
    // Dang nghe: truoc khi tra loi chi hien (A) (B) (C), khong hien chu.
    var body = (hideText && !done)
      ? '<span class="tc-hidden">nghe rồi chọn</span>'
      : "<span>" + esc(o) + "</span>";
    h += '<button type="button" class="' + cls.trim() + '" data-k="' + escAttr(key) +
         '" data-o="' + j + '"' + (done ? " disabled" : "") + ">" +
         '<span class="ab">(' + "ABCD".charAt(j) + ")</span>" + body + "</button>";
  });
  h += "</div>";
  if(done){
    h += '<div class="tc-why"><span class="tag">' + esc(tcTagName(q.tag)) + "</span>" +
         (pick === q.a ? "" : "Đáp án đúng là <b>(" + "ABCD".charAt(q.a) + ") " +
                              esc(q.opts[q.a]) + "</b>. ") +
         q.why + "</div>";
  }
  return h;
}

function drawToeicQ(){
  var meta = tcPart(TC.part), it = tcCur(), qs = tcQs(it);
  var nQ = tcCountQ(TC.part);
  var ansd = 0, ok = 0;
  TC.order.forEach(function(oi, i){
    tcQs(tcBank(TC.part)[oi]).forEach(function(q, j){
      var a = TC.ans[tcKey(i, j)];
      if(a === undefined || a === null) return;
      ansd++;
      if(a === q.a) ok++;
    });
  });
  var allDone = qs.every(function(q, j){
    var a = TC.ans[tcKey(TC.i, j)];
    return a !== undefined && a !== null;
  });

  var h = '<div class="eyebrow">TOEIC · Part ' + TC.part + "</div><h1>" +
            esc(meta.name) + "</h1>" +
          '<div class="tc-bar"><span>' +
            (it.qs ? "Bài <b>" + (TC.i + 1) + "</b>/" + TC.order.length
                   : "Câu <b>" + (TC.i + 1) + "</b>/" + nQ) + "</span>" +
            "<span>Đã làm <b>" + ansd + "</b></span>" +
            "<span>Đúng <b>" + ok + "</b></span>" +
            "<span>Tỷ lệ <b>" + (ansd ? Math.round(ok * 100 / ansd) : 0) + "%</b></span></div>";
  if(TC.i === 0 && !ansd && meta.tip)
    h += '<div class="tc-tip"><b>Mẹo làm Part ' + TC.part + ":</b> " + meta.tip + "</div>";

  if(it.qs && meta.audio){
    // ---- dang NGHE + nhieu cau (Part 3) ----
    // Cau hoi va lua chon IN RA ngay (dung nhu de thi); chi LOI THOAI bi giau.
    var anyDone = qs.some(function(q, j){
      var a = TC.ans[tcKey(TC.i, j)];
      return a !== undefined && a !== null;
    });
    h += '<div class="tc-audio"><div class="ic">&#127911;</div>' +
           '<p class="tc-who">' + esc(it.who || "") + "</p>" +
           '<p class="lb">' + (anyDone ? "Nghe lại nếu cần."
              : "Đọc ba câu hỏi bên dưới <b>trước</b>, rồi mới bấm nghe.") + "</p>" +
           '<div class="bs">' +
             '<button type="button" class="btn go" id="tcPlay">&#9654; Nghe hội thoại</button>' +
             '<button type="button" class="btn" id="tcSlow">&#128034; Nghe chậm</button>' +
           "</div></div>";
    qs.forEach(function(q, j){
      h += '<div class="tc-sub"><div class="qt"><span class="nq">' + (j + 1) + ".</span>" +
             '<span class="tx">' + esc(q.q) + "</span></div>" +
             tcOptsHTML(q, TC.ans[tcKey(TC.i, j)], tcKey(TC.i, j)) + "</div>";
    });
    if(allDone){
      h += '<div class="tc-script"><p class="sl">Lời thoại</p><div class="tc-conv">';
      (it.lines || []).forEach(function(l){
        h += '<div class="cl"><span class="sp">' + esc(l[0]) + "</span>" +
             '<span class="tt">' + esc(l[1]) + "</span></div>";
      });
      h += "</div></div>";
    }
  }else if(it.qs){
    // ---- dang van ban + nhieu cau (Part 7) ----
    h += '<div class="tc-doc"><span class="kd">' + esc(it.label || it.kind) + "</span>" +
           "<h3>" + esc(it.title) + "</h3>";
    if((it.head || []).length){
      h += '<div class="tc-head">';
      it.head.forEach(function(r){
        h += '<div class="hr"><b>' + esc(r[0]) + "</b><span>" + esc(r[1]) + "</span></div>";
      });
      h += "</div>";
    }
    h += '<div class="tc-body">';
    (it.text || []).forEach(function(para){ h += "<p>" + esc(para) + "</p>"; });
    h += "</div></div>";
    qs.forEach(function(q, j){
      h += '<div class="tc-sub"><div class="qt"><span class="nq">' + (j + 1) + ".</span>" +
             '<span class="tx">' + esc(q.q) + "</span></div>" +
             tcOptsHTML(q, TC.ans[tcKey(TC.i, j)], tcKey(TC.i, j)) + "</div>";
    });
  }else if(meta.audio){
    // ---- dang NGHE (Part 2): khong in chu cho den khi tra loi ----
    var pick2 = TC.ans[tcKey(TC.i, 0)];
    var ansd2 = pick2 !== undefined && pick2 !== null;
    h += '<div class="tc-q"><div class="no">Question ' + (TC.i + 1) + "</div>" +
           '<div class="tc-audio"><div class="ic">&#128266;</div>' +
             '<p class="lb">' + (ansd2 ? "Nghe lại nếu cần."
                : "Bấm nghe, rồi chọn câu đáp phù hợp.<br>Đề bài <b>không in ra chữ</b> — " +
                  "giống hệt lúc thi.") + "</p>" +
             '<div class="bs">' +
               '<button type="button" class="btn go" id="tcPlay">&#9654; Nghe cả bài</button>' +
               '<button type="button" class="btn" id="tcPlayQ">Nghe lại câu hỏi</button>' +
               '<button type="button" class="btn" id="tcSlow">&#128034; Nghe chậm</button>' +
             "</div></div>" +
           tcOptsHTML(it, pick2, tcKey(TC.i, 0), true);
    if(ansd2){
      h += '<div class="tc-script"><p class="sl">Lời thoại</p>' +
             '<p class="ln">' + esc(it.q) + "</p>";
      it.opts.forEach(function(o, j){
        h += '<p class="ln">(' + "ABC".charAt(j) + ") " + esc(o) + "</p>";
      });
      h += "</div>";
      if(it.trap) h += '<p class="tc-trap"><b>Bẫy:</b> ' + it.trap + "</p>";
    }
    h += "</div>";
  }else{
    // ---- dang mot cau (Part 5) ----
    h += '<div class="tc-q"><div class="no">Question ' + (TC.i + 1) + "</div>" +
           '<div class="sent">' + esc(it.q) + "</div>" +
           tcOptsHTML(it, TC.ans[tcKey(TC.i, 0)], tcKey(TC.i, 0)) + "</div>";
  }

  h += '<div class="ot-bar">';
  if(allDone) h += '<button type="button" class="btn go" id="tcNext">' +
                (TC.i === TC.order.length - 1 ? "Xem kết quả"
                   : (it.qs ? "Bài tiếp theo &rarr;" : "Câu tiếp theo &rarr;")) +
                "</button>";
  h += '<button type="button" class="btn" id="tcStop">Dừng &amp; xem kết quả</button>' +
       '<button type="button" class="btn" id="tcBack">&larr; Chọn part khác</button></div>';

  mainEl.innerHTML = h;
  mainEl.querySelectorAll(".tc-opts button").forEach(function(b){
    b.onclick = function(){
      TC.ans[b.getAttribute("data-k")] = parseInt(b.getAttribute("data-o"), 10);
      drawToeic();
    };
  });
  // Dang nghe: doc ca cau hoi lan ba cau dap, giong thu tu luc thi
  var full = function(rate){
    // Part 3 doc ca hoi thoai; Part 2 doc cau hoi roi ba cau dap
    var list = it.lines
      ? it.lines.map(function(l){ return l[1]; })
      : [it.q].concat(it.opts.map(function(o, j){
          return "(" + "ABC".charAt(j) + ") " + o;
        }));
    speakSeq(list, rate);
  };
  var pl = document.getElementById("tcPlay");
  if(pl) pl.onclick = function(){ full(0.9); };
  var plq = document.getElementById("tcPlayQ");
  if(plq) plq.onclick = function(){ speak(it.q, 0.9); };
  var slw = document.getElementById("tcSlow");
  if(slw) slw.onclick = function(){ full(0.65); };
  var byId = function(x){ return document.getElementById(x); };
  var nx = byId("tcNext");
  if(nx) nx.onclick = function(){ TC.i++; drawToeic(); window.scrollTo(0, 0); };
  var sp = byId("tcStop");
  if(sp) sp.onclick = function(){ TC.i = TC.order.length; drawToeic(); window.scrollTo(0, 0); };
  var bk = byId("tcBack");
  if(bk) bk.onclick = function(){ TC.part = 0; drawToeic(); buildList(""); window.scrollTo(0, 0); };
}

/* Ket qua: khong chi mot con so. Tach theo NHAN LOAI de noi duoc ban yeu cho nao. */
function drawToeicResult(){
  var bank = tcBank(TC.part);
  var n = 0, ok = 0, by = {};
  TC.order.forEach(function(oi, i){
    tcQs(bank[oi]).forEach(function(q, j){
      var a = TC.ans[tcKey(i, j)];
      if(a === undefined || a === null) return;
      n++;
      var t = q.tag || "?";
      if(!by[t]) by[t] = { n: 0, ok: 0 };
      by[t].n++;
      if(a === q.a){ ok++; by[t].ok++; }
    });
  });
  var pc = n ? Math.round(ok * 100 / n) : 0;
  var h = '<div class="eyebrow">TOEIC · Part ' + TC.part + "</div><h1>Kết quả</h1>" +
          '<div class="pt-res tc-res"><div class="lv' + (pc < 70 ? " low" : "") + '">' +
            pc + "%</div>" +
          '<div class="lvn">Đúng ' + ok + " / " + n + " câu đã làm</div>";
  var keys = Object.keys(by).sort(function(a, b){
    return (by[a].ok / by[a].n) - (by[b].ok / by[b].n);
  });
  if(keys.length){
    h += '<p class="say">Xếp theo chỗ yếu nhất trước:</p><div class="rows">';
    keys.forEach(function(t){
      var r = by[t], p2 = Math.round(r.ok * 100 / r.n);
      h += '<div class="r"><span class="nm">' + esc(tcTagName(t)) + "</span>" +
           '<span class="bar"><i class="' + (p2 < 70 ? "low" : "") +
             '" style="width:' + p2 + '%"></i></span>' +
           '<span class="sc">' + r.ok + "/" + r.n + "</span></div>";
    });
    h += "</div>";
  }
  h += "</div>";
  h += '<div class="ot-bar">' +
       '<button type="button" class="btn go" id="tcAgain">Làm lại đề khác</button>' +
       '<button type="button" class="btn" id="tcBack2">&larr; Chọn part khác</button></div>';
  mainEl.innerHTML = h;
  var byId = function(x){ return document.getElementById(x); };
  byId("tcAgain").onclick = function(){
    tcStart(TC.part); drawToeic(); window.scrollTo(0, 0);
  };
  byId("tcBack2").onclick = function(){
    TC.part = 0; drawToeic(); buildList(""); window.scrollTo(0, 0);
  };
}

/* ===================== SIDEBAR ===================== */
var listEl = document.getElementById("list");
/* "Ôn tập trộn" từng ở đây — tab Ôn tập (MODE "ot") đã thay thế hoàn toàn:
   nó rút thẻ từ cả bốn nguồn chứ không riêng quiz của khung câu, và có lặp
   ngắt quãng thay vì trộn ngẫu nhiên. */
/* Phan tu thu tu la CHE DO duoc hien, hoac "both" = moi che do.
   Truoc day chi co "kc" va "both" nen code loc viet tat la !ng; nay da co trang
   chi thuoc tab Ngu phap nen phai so sanh thang voi MODE. */
var SPECIAL = [
  ["sit",    "🔎", "Tra theo tình huống",  "kc"],
  ["pt",     "🎯", "Kiểm tra đầu vào",     "ng"],
  ["cp",     "🏁", "Kiểm tra chặng",       "ng"],
  ["cd",     "📍", "Bạn đang ở đâu",       "ng"],
  ["dt",     "🎧", "Nghe chép chính tả",   "sk"],
  ["lq",     "🔈", "Nghe chọn đáp án",     "sk"],
  ["tm",     "⏱", "Nói bấm giờ",          "sk"],
  ["pr",     "✍", "Đề nói & viết",        "sk"],
  ["rp",     "🎭", "Đóng vai",             "kc"],
  ["rd",     "📖", "Đọc đoạn dài",         "vc"],
  ["err",    "⚠",  "Từ điển lỗi",          "both"]
];
function isSpecial(id){
  return SPECIAL.some(function(sp){ return sp[0] === id; });
}
/* Thanh bên ở tab Động từ: ô tìm (dùng chung) + danh sách nhóm để lọc.
   Bấm một nhóm không nhảy trang — nó lọc ngay bảng đang mở. */
function buildVerbFilters(filter){
  filter = filter || "";
  if(filter !== VB.q){
    VB.page = 1;                      // đổi từ khóa thì về trang đầu
    if(filter.trim()) VB.letter = "";  // gõ tìm là tra CẢ bảng, bỏ chữ cái đang chọn
  }

  [document.getElementById("search"), document.getElementById("vbFind")].forEach(function(b){
    if(b && b !== document.activeElement && b.value !== filter) b.value = filter;
  });
  var fw = document.getElementById("vbFindWrap");
  if(fw) fw.classList.toggle("has", !!filter.trim());
  listEl.innerHTML = "";
  if(!VINDEX){
    listEl.innerHTML = '<p style="padding:14px 4px;color:var(--muted);font-size:13px;line-height:1.6">' +
      "Chưa có dữ liệu động từ.<br>Tạo <code>data/verbs.json</code> rồi chạy <code>build.bat</code>.</p>";
    document.getElementById("prog").textContent = "";
    return;
  }

  var box = document.createElement("div");

  SPECIAL.filter(function(sp){ return sp[3] === "both"; }).forEach(function(sp){
    var b = document.createElement("button");
    b.className = "item" + (current === sp[0] ? " on" : "");
    b.innerHTML = '<span class="n">' + sp[1] + '</span><span class="t"><b></b></span>';
    b.querySelector("b").textContent = sp[2];
    b.onclick = function(){ show(sp[0]); document.body.classList.remove("open"); };
    box.appendChild(b);
  });
  listEl.appendChild(box);

  var all = verbAll();
  var byLetter = {};
  all.forEach(function(v){
    var L = v[0].charAt(0).toUpperCase();
    byLetter[L] = (byLetter[L] || 0) + 1;
  });

  var d = document.createElement("details");
  d.className = "grp"; d.open = true;
  var s = document.createElement("summary");
  s.textContent = "Nhảy tới chữ cái";
  d.appendChild(s);

  var az = document.createElement("div");
  az.className = "az"; az.id = "az";
  var pick = function(L){
    VB.letter = L; VB.page = 1;
    if(current !== "vb") show("vb"); else buildVerbFilters(VB.q);
    document.body.classList.remove("open");
  };
  var chip = function(L, label, n){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("data-l", L);
    if(VB.letter === L) b.className = "on";
    if(n === 0){ b.disabled = true; b.title = "không có động từ nào"; }
    else b.title = n + " động từ";
    b.onclick = function(){ pick(L); };
    az.appendChild(b);
  };
  chip("", "Tất cả", all.length);
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function(L){ chip(L, L, byLetter[L] || 0); });
  d.appendChild(az);
  listEl.appendChild(d);

  var shown = verbRows().length;
  document.getElementById("prog").textContent =
    all.length + " động từ bất quy tắc" + (shown !== all.length ? " · đang hiện " + shown : "");
  drawVerbs();   // bảng vẽ lại ngay theo bộ lọc mới (không làm gì nếu trang chưa mở)
}

/* Thanh bên ở tab Từ vựng: ô tìm (dùng chung) + danh sách chủ đề để lọc. */
function buildVocabFilters(filter){
  filter = filter || "";
  if(filter !== VC.q){
    VC.page = 1;
    if(filter.trim()) VC.topic = "";   // gõ tìm là tra CẢ bảng
  }
  VC.q = filter;
  // Giu hai o tim khop nhau, nhung KHONG dung vao o dang go (se nhay con tro).
  [document.getElementById("search"), document.getElementById("vcFind")].forEach(function(b){
    if(b && b !== document.activeElement && b.value !== filter) b.value = filter;
  });
  var fw = document.getElementById("vcFindWrap");
  if(fw) fw.classList.toggle("has", !!filter.trim());
  listEl.innerHTML = "";
  if(!CINDEX){
    listEl.innerHTML = '<p style="padding:14px 4px;color:var(--muted);font-size:13px;line-height:1.6">' +
      "Chưa có dữ liệu từ vựng.<br>Tạo <code>data/vocab.json</code> rồi chạy <code>build.bat</code>.</p>";
    document.getElementById("prog").textContent = "";
    return;
  }

  var box = document.createElement("div");
  box.style.cssText = "margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)";
  SPECIAL.filter(function(sp){ return sp[3] === "both"; }).forEach(function(sp){
    var b = document.createElement("button");
    b.className = "item" + (current === sp[0] ? " on" : "");
    b.innerHTML = '<span class="n">' + sp[1] + '</span><span class="t"><b></b></span>';
    b.querySelector("b").textContent = sp[2];
    b.onclick = function(){ show(sp[0]); document.body.classList.remove("open"); };
    box.appendChild(b);
  });
  listEl.appendChild(box);

  var all = vocabAll();
  var count = {};
  all.forEach(function(w){ count[w[3]] = (count[w[3]] || 0) + 1; });

  var pick = function(t){
    VC.topic = t; VC.page = 1;
    if(current !== "vc") show("vc"); else buildVocabFilters(VC.q);
    document.body.classList.remove("open");
  };
  var add = function(parent, id, label, n){
    var b = document.createElement("button");
    b.className = "item" + (VC.topic === id ? " on" : "") + (n ? "" : " soon-topic");
    b.innerHTML = '<span class="n"></span><span class="t"><b></b><i></i></span>';
    b.querySelector(".n").textContent = n || "—";
    b.querySelector("b").textContent = label;
    b.querySelector("i").textContent = n ? n + " từ" : "chưa soạn";
    if(n) b.onclick = function(){ pick(id); }; else b.disabled = true;
    parent.appendChild(b);
  };

  var d = document.createElement("details");
  d.className = "grp"; d.open = true;
  var s = document.createElement("summary");
  s.textContent = "Lọc theo chủ đề";
  d.appendChild(s);
  // Đang lọc theo trình độ thì thanh bên chỉ liệt kê chủ đề của trình độ đó —
  // bày ra chủ đề bấm vào cho 0 kết quả thì chỉ tổ gây bực.
  var tops = (CINDEX.topics || []).filter(function(t){
    return !VC.lv || (t.lv || "b2") === VC.lv;
  });
  var nAllLv = tops.reduce(function(a, t){ return a + (count[t.id] || 0); }, 0);
  add(d, "", "Tất cả chủ đề", nAllLv);
  tops.forEach(function(t){ add(d, t.id, t.name, count[t.id] || 0); });
  listEl.appendChild(d);

  var nTopic = Object.keys(count).length;
  var shown = vocabRows().length;
  document.getElementById("prog").textContent =
    all.length + " từ · " + nTopic + "/" + (CINDEX.topics || []).length + " chủ đề" +
    (shown !== all.length ? " · đang hiện " + shown : "");
  drawVocab();
}

function buildList(filter){
  filter = (filter||"").trim().toLowerCase();
  listEl.innerHTML = "";
  var c    = ctx();
  var ng   = MODE !== "kc";
  var idx  = c.idx, flat = c.flat, done = c.done;
  var key  = function(id){ return keyOf(MODE, id); };

  // Hai chế độ tra cứu chỉ có một trang nên thanh bên là BẢNG LỌC, không phải mục lục.
  if(MODE === "vb"){ buildVerbFilters(filter); return; }
  if(MODE === "vc"){ buildVocabFilters(filter); return; }
  if(MODE === "ot"){ buildOtFilters(); return; }
  if(MODE === "lt"){ buildRoadmapSide(); return; }
  if(MODE === "tc"){ buildToeicSide(); return; }

  if(!idx || !flat.length){
    listEl.innerHTML = '<p style="padding:14px 4px;color:var(--muted);font-size:13px;line-height:1.6">' +
      "Chưa có dữ liệu cho mục này.<br>Tạo <code>data/grammar.json</code> rồi chạy <code>build.bat</code>.</p>";
    document.getElementById("prog").textContent = "";
    return;
  }

  // Dải gợi ý của bài kiểm tra đầu vào — đứng trên cùng tab Ngữ pháp vì nó trả
  // lời đúng câu hỏi đầu tiên của người mới: "tôi nên bắt đầu từ đâu?"
  if(MODE === "ng" && !filter && PLACE) listEl.appendChild(ptHintEl());

  // "Tra theo tình huống" và "Ôn tập trộn" chỉ đọc dữ liệu khung câu nên chỉ
  // hiện ở chế độ khung câu; "Từ điển lỗi" gom cả hai nên hiện ở mọi chế độ.
  var avail = SPECIAL.filter(function(sp){ return sp[3] === "both" || sp[3] === MODE; });
  if(!filter && avail.length){
    var box = document.createElement("div");
    box.style.cssText = "margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)";
    avail.forEach(function(sp){
      var b = document.createElement("button");
      b.className = "item" + (current === sp[0] ? " on" : "");
      b.innerHTML = '<span class="n">' + sp[1] + '</span><span class="t"><b></b></span>';
      b.querySelector("b").textContent = sp[2];
      b.onclick = function(){ show(sp[0]); document.body.classList.remove("open"); };
      box.appendChild(b);
    });
    listEl.appendChild(box);
  }

  idx.groups.forEach(function(g, gi){
    var matched = g.items.filter(function(it){
      if(!filter) return true;
      var hay = it.id + " " + it.pat + " " + it.vi + " " + g.name;
      // ở tab động từ, gõ "went" phải tìm ra nhóm chứa nó
      if(it.verbs) hay += " " + it.verbs.map(function(v){ return v.join(" "); }).join(" ");
      return hay.toLowerCase().indexOf(filter) > -1;
    });
    if(!matched.length) return;
    var d = document.createElement("details");
    d.className = "grp";
    d.open = filter ? true : (matched.some(function(it){ return key(it.id)===current; }) || gi===0);
    var s = document.createElement("summary");
    s.textContent = g.name;
    d.appendChild(s);
    matched.forEach(function(it){
      var b = document.createElement("button");
      b.className = "item" + (key(it.id)===current ? " on":"") +
                    (done.indexOf(it.id)>-1 ? " done":"") + (it.detail ? " full":"");
      b.innerHTML = '<span class="n">' + pad3(it.id).slice(1) + '</span><span class="t"><b></b><i></i></span>';
      b.querySelector("b").textContent = it.pat;
      b.querySelector("i").textContent = it.vi;
      b.onclick = function(){ show(key(it.id)); document.body.classList.remove("open"); };
      d.appendChild(b);
    });
    listEl.appendChild(d);
  });

  var pct = Math.round(done.length / flat.length * 100);
  var tail;
  if(MODE === "vb"){
    var nv = flat.reduce(function(a, x){ return a + ((x.verbs||[]).length); }, 0);
    tail = nv + " động từ";
  }else{
    tail = flat.filter(function(x){ return x.detail; }).length + " bài chi tiết ★";
  }
  document.getElementById("prog").textContent =
    "Đã học " + done.length + "/" + flat.length + " (" + pct + "%) · " + tail;
}

var mainEl = document.getElementById("main");

/* Đổi chế độ. quiet=true khi show() tự đổi theo loại id (không nhảy bài). */
function setMode(m, quiet){
  if(!ctx(m).idx) m = "kc";
  MODE = m; save("kc_mode", m);
  var tabs = document.getElementById("tabs");
  if(tabs) tabs.querySelectorAll("button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-m") === m);
  });
  var c = ctx(m);
  if(c.idx){
    document.getElementById("appTitle").textContent = c.idx.title || "";
    document.getElementById("appTag").textContent = c.idx.tagline || "";
  }
  var box = document.getElementById("search");
  if(box) box.placeholder =
      m === "vb" ? "Tìm động từ… (vd: went, broke, ăn)"
    : m === "tc" ? "Ô tìm không dùng ở tab TOEIC"
    : m === "lt" ? "Ô tìm không dùng ở tab Lộ trình"
    : m === "ot" ? "Ô tìm không dùng ở tab Ôn tập"
    : m === "vc" ? "Tìm từ vựng… (vd: deadline, lương, kinh nghiệm)"
    : m === "ng" ? "Tìm bài ngữ pháp… (vd: thì, giới từ, bị động)"
    : m === "sk" ? "Tìm bài kỹ năng… (vd: phát âm, email, nối âm)"
    : m === "nm" ? "Tìm bài nhập môn… (vd: to be, số đếm, đại từ)"
    :              "Tìm khung câu… (vd: muốn, could, xin phép)";
  if(!quiet){
    if(box) box.value = "";
    if(m === "vb"){ VB.q = ""; VB.letter = ""; VB.page = 1; }
    if(m === "vc"){ VC.q = ""; VC.topic = ""; VC.page = 1; VC.sel = ""; }
    show(load(c.last, c.first));
  }
}

function show(id){
  var m = modeOf(id);
  // Dong ho dem nguoc cua trang Noi bam gio phai dung khi roi trang, khong thi
  // no chay ngam va vai phut sau bat ngo doc "Time is up" giua mot bai khac.
  if(id !== "tm" && typeof tmStop === "function") tmStop();
  if(id !== "lt" && typeof coStopTimers === "function") coStopTimers();
  if(id !== "rd") mainEl.classList.remove("rd-big");
  // Roi tab TOEIC thi tat tieng dang doc, khong thi no doc tiep sang trang khac
  if(id !== "tc"){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
  // Bo cuc hai panel kin man hinh CHI dung o tab Tu vung; sang trang khac phai go ra,
  // khong thi trang do bi khoa chieu cao va mat thanh cuon.
  if(id !== "vc") mainEl.classList.remove("vcmode");
  if(m && m !== MODE) setMode(m, true);

  current = id;
  // trang phụ không thuộc chế độ nào nên lưu theo chế độ đang mở
  save(ctx(isSpecial(id) ? MODE : m).last, id);

  if(id === "vb" || id === "vc" || id === "ot" || id === "lt" || id === "tc" ||
     isSpecial(id)){
    buildList(document.getElementById("search").value);
    if(id === "lt")     return viewRoadmap();
    if(id === "tc")     return viewToeic();
    if(id === "vb")     return viewVerbs();
    if(id === "vc")     return viewVocab();
    if(id === "ot")     return viewOt();
    if(id === "sit")    return viewSituations();
    if(id === "pt")     return viewPlacement();
    if(id === "cp")     return viewCheckpoint();
    if(id === "cd")     return viewCando();
    if(id === "dt")     return viewDictation();
    if(id === "lq")     return viewListenQuiz();
    if(id === "tm")     return viewTimed();
    if(id === "pr")     return viewPrompt();
    if(id === "rp")     return viewRoleplay();
    if(id === "rd")     return viewReading();
    return viewErrors();
  }

  var c    = ctx(m);
  var num  = m === "kc" ? id : gNum(id);
  var meta = c.flat.filter(function(x){ return x.id===num; })[0];
  if(!meta) return;
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  buildList(document.getElementById("search").value);
  window.scrollTo(0,0);

  var loader = m === "ng" ? loadLesson
             : m === "sk" ? loadSkill
             : m === "nm" ? loadBasic
             :              loadFrame;
  var p = meta.detail === false ? Promise.resolve(null) : loader(num);
  p.then(function(f){
    if(current !== id) return;
    mainEl.innerHTML = f ? renderDoc(f, m) : renderStub(meta, m);
    decorate();
    addFooter(id);
    var go = document.getElementById("go1");
    if(go) go.onclick = function(e){ e.preventDefault(); show(1); };
  });
}

function indexOfId(flat, id){
  for(var i = 0; i < flat.length; i++) if(flat[i].id === id) return i;
  return -1;
}
function addFooter(id){
  var m     = modeOf(id);
  var c     = ctx(m);
  var num   = m === "kc" ? id : gNum(id);
  var flat  = c.flat, done = c.done, skey = c.skey, label = c.label;
  var key   = function(n){ return keyOf(m, n); };

  var bar = document.createElement("div");
  bar.className = "done-bar";
  var isDone = done.indexOf(num) > -1;
  var mark = document.createElement("button");
  mark.className = "btn";
  mark.textContent = isDone ? "\u2713 Đã học xong" : "Đánh dấu đã học";
  mark.onclick = function(){
    var i = done.indexOf(num);
    if(i>-1) done.splice(i,1); else done.push(num);
    save(skey, done);
    show(id);
  };
  bar.appendChild(mark);
  var nav = document.createElement("div");
  nav.className = "nav";
  // \u0111i theo TH\u1ee8 T\u1ef0 TRONG MENU, kh\u00f4ng theo s\u1ed1 id \u2014 menu ng\u1eef ph\u00e1p x\u1ebfp theo th\u1ee9 t\u1ef1 h\u1ecdc
  var i = indexOfId(flat, num);
  var pv = i > 0 ? flat[i-1] : null;
  var nx = i > -1 && i < flat.length-1 ? flat[i+1] : null;
  if(pv){
    var pb = document.createElement("button");
    pb.className="btn"; pb.textContent="\u2190 " + label + pad3(pv.id).slice(1);
    pb.onclick=function(){ show(key(pv.id)); }; nav.appendChild(pb);
  }
  if(nx){
    var nb = document.createElement("button");
    nb.className="btn"; nb.textContent=label + pad3(nx.id).slice(1) + " \u2192";
    nb.onclick=function(){ show(key(nx.id)); }; nav.appendChild(nb);
  }
  bar.appendChild(nav);
  mainEl.appendChild(bar);
}

/* ===================== TƯƠNG TÁC ===================== */
/* Doc lien tiep nhieu cau, co nghi giua cac cau. speak() thuong goi cancel()
   truoc nen khong xep hang duoc — ham nay chi cancel MOT LAN o dau. */
function speakSeq(list, rate, gap){
  try{
    if(!("speechSynthesis" in window)) return false;
    speechSynthesis.cancel();
    (list || []).forEach(function(t, i){
      var u = new SpeechSynthesisUtterance(String(t));
      u.lang = "en-US"; u.rate = rate || 0.9;
      speechSynthesis.speak(u);
      if(i < list.length - 1 && gap !== 0){
        var pause = new SpeechSynthesisUtterance(" ");
        pause.lang = "en-US"; pause.rate = 0.1; pause.volume = 0;
        speechSynthesis.speak(pause);
      }
    });
    return true;
  }catch(e){ return false; }
}

function speak(text, rate){
  try{
    if(!("speechSynthesis" in window)) return false;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate || 0.9;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
/* Gắn sự kiện cho mọi liên kết [data-go] trong một vùng — dùng lại được khi
   chỉ vẽ lại một phần trang (ví dụ danh sách của Từ điển lỗi). */
function wireGo(root){
  (root || mainEl).querySelectorAll("[data-go]").forEach(function(a){
    a.onclick = function(e){
      e.preventDefault();
      var v = a.getAttribute("data-go");
      show(/^[gsn]\d+$/.test(v) || v === "vb" || v === "vc" || v === "ot"
             ? v : parseInt(v, 10));
    };
  });
}
/* root: vung can gan su kien (mac dinh mainEl). Khoa hoc nhung nhieu bai vao mot
   trang va co the goi lai sau moi buoc tai xong — phan tu nao da gan thi danh dau
   data-dec, chay lai khong nhan doi nut loa hay nut "Xem dap an". */
function decorate(root){
  root = root || mainEl;
  root.querySelectorAll(".ex .en, .dlg .line .en, .bk-d .en").forEach(function(p){
    if(p.hasAttribute("data-dec")) return;
    p.setAttribute("data-dec", "1");
    var b = document.createElement("button");
    b.className = "say"; b.type = "button"; b.title = "Nghe"; b.textContent = "\uD83D\uDD0A";
    b.onclick = function(){
      var sp = p.querySelector(".sp");
      var t = p.textContent;
      if(sp) t = t.replace(sp.textContent, "");
      speak(t.replace("\uD83D\uDD0A", "").trim());
    };
    p.appendChild(b);
  });
  root.querySelectorAll(".bk-sit").forEach(function(s){
    s.onclick = function(){
      var g = s.parentNode;
      var open = g.classList.toggle("open");
      s.setAttribute("aria-expanded", open ? "true" : "false");
      if(open) s.scrollIntoView({block:"nearest"});
    };
  });
  root.querySelectorAll(".bk-row").forEach(function(r){
    r.onclick = function(){
      var bank = r.closest(".bank");
      bank.querySelectorAll(".bk-row").forEach(function(x){ x.classList.remove("on"); });
      bank.querySelectorAll(".bk-d").forEach(function(x){ x.classList.remove("on"); });
      r.classList.add("on");
      var p = document.getElementById(r.getAttribute("data-p"));
      if(p){
        p.classList.add("on");
        p.parentNode.classList.add("picked");
      }
    };
  });
  wireGo(root);
  root.querySelectorAll(".q").forEach(function(q){
    if(q.hasAttribute("data-dec")) return;
    q.setAttribute("data-dec", "1");
    var ans = document.createElement("div");
    ans.className = "ans";
    ans.innerHTML = "&rarr; " + q.getAttribute("data-a");
    var btn = document.createElement("button");
    btn.className = "rev"; btn.type = "button"; btn.textContent = "Xem đáp án";
    btn.onclick = function(){
      q.classList.toggle("open");
      btn.textContent = q.classList.contains("open") ? "Ẩn đáp án" : "Xem đáp án";
    };
    q.appendChild(btn); q.appendChild(ans);
  });
}

});
document.addEventListener("keydown", function(e){
  if(!INDEX || e.target.tagName === "INPUT") return;
  var m = modeOf(current);
  if(!m) return;
  // Khoa hoc: phim mui ten di theo thu tu bai cua khoa hoc
  if(m === "lt"){
    if(!LT.open || e.target.tagName === "TEXTAREA") return;
    if(e.key === "ArrowRight") coStepLesson(1);
    if(e.key === "ArrowLeft")  coStepLesson(-1);
    return;
  }
  var flat = ctx(m).flat;
  if(!flat.length) return;
  var num = m === "kc" ? current : gNum(current);
  var key = function(n){ return keyOf(m, n); };
  var i = indexOfId(flat, num);
  if(i < 0) return;
  if(e.key === "ArrowRight" && i < flat.length-1) show(key(flat[i+1].id));
  if(e.key === "ArrowLeft"  && i > 0)             show(key(flat[i-1].id));
});

/* ===================== KHỞI ĐỘNG ===================== */
function flatten(idx){
  var out = [];
  (idx.groups || []).forEach(function(g){
    (g.items || []).forEach(function(it){ it.grp = g.name; out.push(it); });
  });
  return out;
}

loadIndex().then(function(idx){
  INDEX = idx;
  FLAT = flatten(idx);
  return loadGrammarIndex().catch(function(){ return null; });
}).then(function(gidx){
  GINDEX = gidx && gidx.groups && gidx.groups.length ? gidx : null;
  GFLAT  = GINDEX ? flatten(GINDEX) : [];
  return loadVerbIndex().catch(function(){ return null; });
}).then(function(vidx){
  VINDEX = vidx && vidx.verbs && vidx.verbs.length ? vidx : null;
  return loadSkillIndex().catch(function(){ return null; });
}).then(function(sidx){
  SINDEX = sidx && sidx.groups && sidx.groups.length ? sidx : null;
  SFLAT  = SINDEX ? flatten(SINDEX) : [];
  return loadBasicIndex().catch(function(){ return null; });
}).then(function(bidx){
  BINDEX = bidx && bidx.groups && bidx.groups.length ? bidx : null;
  BFLAT  = BINDEX ? flatten(BINDEX) : [];
  return loadVocabIndex().catch(function(){ return null; });
}).then(function(cidx){
  CINDEX = cidx && cidx.words && cidx.words.length ? cidx : null;
  return loadVocabDetail().catch(function(){ return null; });
}).then(function(vdet){
  // Thieu file nay thi panel phai van chay, chi la khong co dong nghia/trai nghia
  VDETAIL = (vdet && vdet.items) || vdet || null;
  return loadPlacement().catch(function(){ return null; });
}).then(function(pl){
  // Thieu bai kiem tra dau vao thi tab Ngu phap chi mat dai goi y, khong vo gi
  PLACE = (pl && (pl.items || []).length) ? pl : null;
  return loadRoadmap().catch(function(){ return null; });
}).then(function(rm){
  // Lộ trình nạp NGAY lúc khởi động vì nó là tab mặc định — không để người học
  // mở app ra nhìn một trang "đang tải".
  ROADMAP = (rm && (rm.stages || []).length) ? rm : null;
  return loadCourse().catch(function(){ return null; });
}).then(function(co){
  // Khoa hoc cung nap ngay luc khoi dong — tab mac dinh
  COURSE = (co && (co.stages || []).length) ? co : null;
  return loadCando().catch(function(){ return null; });
}).then(function(cd){
  // Thieu file nay thi tab Ngu phap chi mat trang "Ban dang o dau"
  CANDO = (cd && (cd.levels || []).length) ? cd : null;

  // ẩn nút tab nào không có dữ liệu; không còn tab phụ nào thì ẩn luôn cả dải
  var tabs = document.getElementById("tabs");
  var extra = 0;
  tabs.querySelectorAll("button[data-m]").forEach(function(b){
    var m = b.getAttribute("data-m");
    if(m === "kc") return;
    if(ctx(m).idx) extra++; else b.style.display = "none";
  });
  if(!extra) tabs.style.display = "none";

  var idx = INDEX;
  document.getElementById("appTitle").textContent = idx.title || "100 Khung Câu Giao Tiếp";
  document.getElementById("appTag").textContent = idx.tagline || "";
  document.getElementById("mode").textContent = bundle ? "nguồn: bundle.js" : "nguồn: JSON trực tiếp";
  document.getElementById("mode").title = bundle
    ? "Đang mở bằng file:// nên trang đọc data/bundle.js. Sửa JSON xong hãy chạy build.bat."
    : "Đang chạy qua web server nên trang đọc thẳng các file .json — sửa xong chỉ cần F5.";
  (idx.situations || []).forEach(function(s){ SITS[s.id] = s; });

  if(!ctx(MODE).idx) MODE = "kc";
  current = load(ctx(MODE).last, ctx(MODE).first);
  // id đã lưu có thể trỏ tới bài không còn tồn tại -> quay về bài đầu của chế độ đó
  var cm = modeOf(current);
  if(cm && ctx(cm).flat.length){
    var cf = ctx(cm).flat;
    var cn = cm === "kc" ? current : gNum(current);
    if(!cf.some(function(x){ return x.id === cn; })) current = keyOf(cm, cf[0].id);
  }

  setMode(MODE, true);
  buildList("");
  show(current);
}).catch(function(err){
  document.querySelector(".side").style.display = "none";
  mainEl.innerHTML =
    '<div class="err"><h2>Không đọc được dữ liệu</h2>' +
    "<p>" + esc(err.message) + "</p>" +
    "<p>Cần có <code>data/index.json</code> (khi chạy qua server) hoặc <code>data/bundle.js</code> (khi mở trực tiếp bằng file://).</p>" +
    "<p><b>Cách 1 — mở trực tiếp:</b> chạy <code>build.bat</code> một lần để sinh <code>data/bundle.js</code>, rồi mở lại file này.</p>" +
    "<p><b>Cách 2 — chạy server:</b></p><pre>cd C:\\Eng\npython -m http.server 8000</pre>" +
    '<p>rồi mở <code>http://localhost:8000/khung-cau-giao-tiep.html</code> (hoặc chỉ cần chạy <code>start.bat</code>).</p></div>';
});
</script>

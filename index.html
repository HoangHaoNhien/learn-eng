        " thẻ. Bấm Ctrl+C để chép, rồi dán vào một file hay ghi chú nào đó.";
    };
    document.getElementById("otImp").onclick = function(){
      var raw = (io.value || "").trim();
      if(!raw){ msg.textContent = "Ô trên đang trống — dán bản sao lưu vào trước đã."; return; }
      var data;
      try{ data = JSON.parse(raw); }
      catch(e){ msg.textContent = "Không đọc được: đoạn vừa dán không phải JSON hợp lệ."; return; }
      if(!data || typeof data.srs !== "object" || !data.srs){
        msg.textContent = "Không đọc được: thiếu phần \"srs\". Đây có đúng là bản sao lưu không?";
        return;
      }
      var keys = Object.keys(data.srs);
      if(!confirm("Nhập " + keys.length + " thẻ vào tiến độ hiện có?\n\n" +
                  "Tiến độ cũ KHÔNG bị xoá — thẻ nào trùng thì giữ bản đã học xa hơn.")) return;

      // GỘP chứ không ghi đè: thẻ trùng giữ bản có hộp cao hơn, hộp bằng nhau thì
      // giữ hạn xa hơn. Như vậy nhập nhầm bản cũ cũng không làm mất công đã học.
      var added = 0, kept = 0;
      keys.forEach(function(k){
        var inc = data.srs[k], cur = otSrs[k];
        if(!Array.isArray(inc) || inc.length < 2) return;
        if(!cur){ otSrs[k] = inc; added++; return; }
        if(inc[0] > cur[0] || (inc[0] === cur[0] && inc[1] > cur[1])){ otSrs[k] = inc; }
        else kept++;
      });
      if(data.log && typeof data.log === "object"){
        Object.keys(data.log).forEach(function(day){
          var inc = data.log[day], cur = otLog[day];
          if(!inc) return;
          if(!cur || (inc.n || 0) > (cur.n || 0)) otLog[day] = inc;
        });
      }
      save("ot_srs", otSrs);
      save("ot_log", otLog);
      // viewOt() vẽ lại cả trang nên gán thẳng vào msg sẽ mất — gửi qua OT.ioMsg
      OT.ioMsg = "Đã gộp xong: thêm mới " + added + " thẻ, giữ nguyên " + kept +
        " thẻ vì bản đang có đã học xa hơn.";
      OT.sess = null;
      viewOt();
    };
    mainEl.querySelectorAll(".ot-card").forEach(function(el){
      el.onclick = function(){
        var d = el.getAttribute("data-deck");
        OT.deck = (OT.deck === d) ? "" : d;   // bấm lại chính nó là bỏ lọc
        OT.sub  = "";                          // nhóm con thuộc về bộ cũ, phải bỏ theo
        OT.sess = null;
        viewOt();                              // vẽ lại cả số đến hạn ở trên
      };
    });

    // Thanh bên đã vẽ TRƯỚC khi thẻ gom xong nên lúc đó chưa có số — vẽ lại ngay.
    buildOtFilters();
    decorate();
    window.scrollTo(0, 0);
  });
}

/* ---- Phiên ôn: rút thẻ đến hạn, lật, tự chấm, áp Leitner ---- */
var OT_SESSION = 30;        // mỗi phiên bấy nhiêu thẻ cho còn thấy đích

function pad2(n){ return (n < 10 ? "0" : "") + n; }
function todayKey(t){
  var d = t ? new Date(t) : new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

/* Leitner: nhớ thì lên một hộp (tối đa 5), quên thì rơi thẳng về hộp 1.
   Trả về số hộp mới để màn hình báo lại cho người học. */
function srsGrade(c, ok){
  var id = c.id;
  var nb = ok ? Math.min(5, srsBox(id) + 1) : 1;
  otSrs[id] = [nb, Date.now() + OT_DAYS[nb] * DAY_MS];
  save("ot_srs", otSrs);
  var k = todayKey();
  var e = otLog[k] || { n: 0, ok: 0 };
  e.n++; if(ok) e.ok++;
  // Đếm riêng từng bộ để tính tỉ lệ nhớ. Thêm trường mới chứ không đổi trường cũ —
  // nhật ký ghi trước đây không có "d" vẫn đọc được bình thường.
  e.d = e.d || {};
  var p = e.d[c.deck] || [0, 0];
  p[1]++; if(ok) p[0]++;
  e.d[c.deck] = p;
  otLog[k] = e;
  save("ot_log", otLog);
  return nb;
}

/* Chuỗi ngày ôn liên tiếp: đếm ngược từ hôm nay. Nếu hôm nay chưa ôn thì vẫn tính
   chuỗi đang giữ (bắt đầu đếm từ hôm qua) — chưa hết ngày thì chưa đứt. */
function streakDays(){
  var n = 0, t = Date.now();
  if(!otLog[todayKey(t)]) t -= DAY_MS;
  while(otLog[todayKey(t)]){ n++; t -= DAY_MS; }
  return n;
}

/* Bao nhiêu thẻ đến hạn mỗi ngày trong 7 ngày tới. Ô đầu gộp cả thẻ quá hạn. */
function forecast7(){
  var out = [], now = Date.now();
  var startToday = new Date(); startToday.setHours(0, 0, 0, 0);
  var base = startToday.getTime();
  for(var i = 0; i < 7; i++){
    var lo = base + i * DAY_MS, hi = lo + DAY_MS;
    var n = scopeCards().filter(function(c){
      var dd = srsDue(c.id);
      return i === 0 ? dd < hi : (dd >= lo && dd < hi);
    }).length;
    out.push({ d: new Date(lo), n: n, today: i === 0 });
  }
  return out;
}

/* Tỉ lệ nhớ gộp cả nhật ký, theo từng bộ. */
function recallByDeck(){
  var acc = {};
  Object.keys(otLog).forEach(function(k){
    var d = otLog[k].d;
    if(!d) return;
    Object.keys(d).forEach(function(deck){
      var a = acc[deck] || [0, 0];
      a[0] += d[deck][0]; a[1] += d[deck][1];
      acc[deck] = a;
    });
  });
  return acc;
}

/* Nhóm con của một thẻ: từ vựng theo chủ đề, động từ theo nhóm biến đổi,
   bài tập và sửa lỗi theo nguồn (khung câu / ngữ pháp / kỹ năng). */
function cardSub(c){
  if(c.deck === "vc") return c.topic || "";
  if(c.deck === "vb") return c.pat || "";
  return c.src || "";
}
var OT_SRC = [["nm", "Nhập môn"], ["kc", "Khung câu"],
              ["ng", "Ngữ pháp"], ["sk", "Kỹ năng"]];
function subOptions(){
  if(OT.deck === "vc") return ((CINDEX && CINDEX.topics) || [])
                                .map(function(t){ return [t.id, t.name]; });
  if(OT.deck === "vb") return ((VINDEX && VINDEX.patterns) || [])
                                .map(function(p){ return [p.id, p.name || p.id]; });
  if(OT.deck === "qz" || OT.deck === "er") return OT_SRC.slice();
  return [];
}
function subLabel(id){
  var o = subOptions().filter(function(x){ return x[0] === id; })[0];
  return o ? o[1] : id;
}

/* "Chỉ bài đã học xong": thẻ phải thuộc một bài bạn đã bấm Đánh dấu đã học.
   Thẻ từ vựng và động từ KHÔNG gắn với bài nào nên bị loại khi bật tuỳ chọn này —
   màn hình nói rõ điều đó chứ không im lặng trả về rỗng. */
function isLearned(c){
  if(!c.src || c.fid == null) return false;
  var done = c.src === "ng" ? ngDone
           : c.src === "sk" ? skDone
           : c.src === "nm" ? nmDone : doneSet;
  return done.indexOf(c.fid) > -1;
}

function inScope(c){
  if(OT.deck && c.deck !== OT.deck) return false;
  if(OT.sub && cardSub(c) !== OT.sub) return false;
  if(OT.onlyDone && !isLearned(c)) return false;
  return true;
}
function scopeCards(){ return (OT.cards || []).filter(inScope); }
function dueCards(){
  var now = Date.now();
  return scopeCards().filter(function(c){ return isDue(c.id, now); });
}

function otStart(){
  var pool = shuffle(dueCards().slice());
  if(!pool.length) return;
  OT.sess = { cards: pool.slice(0, OT_SESSION), i: 0, ok: 0, again: 0,
              open: false, total: pool.length };
  drawSession();
}

/* Hai mặt của thẻ dựng theo từng bộ — mỗi bộ hỏi một kiểu khác nhau. */
function cardFace(c, back){
  if(c.deck === "vc"){
    // Hai chiều hỏi khác hẳn nhau về độ khó: Việt→Anh bắt phải nhớ ra từ (chủ động),
    // Anh→Việt chỉ cần nhận ra (bị động). Mặc định lấy chiều khó.
    if(OT.dir === "en"){
      if(!back) return '<p class="q">' + esc(c.back) + "</p>" +
                       (c.ipa ? '<p class="ipa">' + esc(c.ipa) + "</p>" : "") +
                       '<p class="hint">nghĩa tiếng Việt là gì?</p>';
      return '<p class="a">' + esc(c.front) + "</p>" +
             '<p class="ex">' + esc(c.ex) + "</p>" +
             '<p class="exvi">' + esc(c.exvi) + "</p>";
    }
    if(!back) return '<p class="q">' + esc(c.front) + "</p>" +
                     '<p class="hint">' + esc(c.pos || "") + " · nói thành tiếng từ tiếng Anh</p>";
    return '<p class="a">' + esc(c.back) + "</p>" +
           (c.ipa ? '<p class="ipa">' + esc(c.ipa) + "</p>" : "") +
           '<p class="ex">' + esc(c.ex) + "</p>" +
           '<p class="exvi">' + esc(c.exvi) + "</p>";
  }
  if(c.deck === "qz"){
    if(!back) return '<p class="q">' + esc(c.front) + "</p>" +
                     (c.blank ? '<p class="blank">' + esc(c.blank) + "</p>" : "") +
                     '<p class="hint">nói cả câu trước khi lật</p>';
    return '<p class="a">' + esc(c.back) + "</p>";
  }
  if(c.deck === "er"){
    if(!back) return '<p class="wrong">' + esc(c.front) + "</p>" +
                     '<p class="hint">câu này sai ở đâu? sửa lại rồi lật</p>';
    return '<p class="a">' + esc(c.back) + "</p>" +
           (c.why ? '<p class="why">' + c.why + "</p>" : "");
  }
  // vb
  if(!back) return '<p class="q">' + esc(c.front) + "</p>" +
                   '<p class="hint">V2 và V3 là gì?</p>';
  return '<p class="a">' + esc(c.back) + "</p>" +
         '<p class="exvi">' + esc(c.vi || "") + "</p>";
}

/* Thẻ đến từ đâu. Bài tập và sửa lỗi có bài gốc nên làm thành liên kết bấm được;
   từ vựng và động từ không gắn bài nào nên chỉ ghi chủ đề / nhóm biến đổi. */
function cardFrom(c){
  if(c.src && c.fid != null){
    var label = c.src === "ng" ? "Ngữ pháp "
              : c.src === "sk" ? "Kỹ năng "
              : c.src === "nm" ? "Nhập môn " : "Khung ";
    return '<a class="pill from" href="#" data-go="' + keyOf(c.src === "kc" ? "kc" : c.src, c.fid) +
           '" title="' + escAttr(c.title || "") + '">&#8627; ' +
           label + pad3(c.fid).slice(1) + "</a>";
  }
  var sub = cardSub(c);
  return sub ? '<span class="pill">' + esc(subLabelOf(c.deck, sub)) + "</span>" : "";
}
/* subLabel() đọc theo bộ ĐANG CHỌN; trong phiên ôn "tất cả bộ" thì thẻ có thể
   thuộc bộ khác, nên cần tra theo đúng bộ của chính thẻ đó. */
function subLabelOf(deck, id){
  if(deck === "vc"){
    var t = ((CINDEX && CINDEX.topics) || []).filter(function(x){ return x.id === id; })[0];
    return t ? t.name : id;
  }
  if(deck === "vb"){
    var p = ((VINDEX && VINDEX.patterns) || []).filter(function(x){ return x.id === id; })[0];
    return p ? (p.name || p.id) : id;
  }
  var s = OT_SRC.filter(function(x){ return x[0] === id; })[0];
  return s ? s[1] : id;
}

function drawSession(){
  var s = OT.sess;
  if(!s) return viewOt();
  if(s.i >= s.cards.length) return drawSessionDone();

  var c   = s.cards[s.i];
  var pct = Math.round(s.i / s.cards.length * 100);
  var box = srsBox(c.id);

  mainEl.innerHTML =
    '<div class="ot-top">' +
      '<button class="btn" id="otQuit">&larr; Thoát phiên</button>' +
      '<span class="pill">' + esc(deckName(c.deck)) + "</span>" +
      '<span class="pill">' + (box ? "hộp " + box : "thẻ mới") + "</span>" +
      cardFrom(c) +
      '<span class="cnt">' + (s.i + 1) + " / " + s.cards.length + "</span>" +
    "</div>" +
    '<div class="ot-prog"><i style="width:' + pct + '%"></i></div>' +
    '<div class="ot-flip' + (s.open ? " open" : "") + '" id="otCard">' +
      '<div class="face front">' + cardFace(c, false) + "</div>" +
      '<div class="face back">' + cardFace(c, true) + "</div>" +
    "</div>" +
    '<div class="ot-bar">' +
      (s.open
        ? '<button class="btn no" id="otNo">Chưa nhớ</button>' +
          '<button class="btn yes" id="otYes">Nhớ rồi &rarr;</button>' +
          (c.say ? '<button class="btn" id="otSay">🔊 Nghe</button>' : "")
        : '<button class="btn go" id="otShow">Xem đáp án</button>') +
    "</div>" +
    '<p class="vbnote">Tự nói thành tiếng trước khi lật — nghĩ thầm thì không tính. ' +
    "Chấm thật thà: nhớ lơ mơ cũng là chưa nhớ.</p>";

  var quit = document.getElementById("otQuit");
  quit.onclick = function(){ OT.sess = null; viewOt(); };

  if(!s.open){
    document.getElementById("otShow").onclick = function(){
      s.open = true;
      drawSession();
      if(c.say) speak(c.say.replace(/\s*\(.*?\)\s*/g, " "));
    };
  }else{
    var grade = function(ok){
      srsGrade(c, ok);
      if(ok) s.ok++; else s.again++;
      s.i++; s.open = false;
      drawSession();
    };
    document.getElementById("otNo").onclick  = function(){ grade(false); };
    document.getElementById("otYes").onclick = function(){ grade(true); };
    var sy = document.getElementById("otSay");
    if(sy) sy.onclick = function(){ speak(c.say.replace(/\s*\(.*?\)\s*/g, " ")); };
  }
  // Bấm link nguồn là rời phiên sang bài gốc — nhớ dọn phiên để không kẹt lại
  mainEl.querySelectorAll(".ot-top [data-go]").forEach(function(a){
    a.addEventListener("click", function(){ OT.sess = null; });
  });
  wireGo(mainEl);
  window.scrollTo(0, 0);
}

function drawSessionDone(){
  var s = OT.sess;
  var left = dueCards().length;
  mainEl.innerHTML =
    '<div class="eyebrow">Luyện tập</div><h1>Xong phiên</h1>' +
    '<div class="ot-hero">' +
      '<div class="big">' + s.ok + " / " + s.cards.length + "</div>" +
      '<div class="lb">thẻ bạn nhớ được</div>' +
      (s.again
        ? '<p class="ok">' + s.again + " thẻ rơi về hộp 1 — chúng sẽ quay lại vào ngày mai.</p>"
        : '<p class="ok">Không trượt thẻ nào.</p>') +
      (left ? '<button class="btn go" id="otMore">Ôn tiếp ' +
              Math.min(OT_SESSION, left) + " thẻ nữa &rarr;</button>" : "") +
    "</div>" +
    '<p class="vbnote">' +
      (left ? "Còn " + left + " thẻ đến hạn trong phạm vi đang chọn. "
            : "Hết thẻ đến hạn trong phạm vi đang chọn. ") +
      "Thẻ nhớ được đã giãn ra xa hơn; quay lại đúng ngày là cách giữ chúng lâu nhất.</p>" +
    '<div class="ot-bar"><button class="btn" id="otBack">&larr; Về trang tổng quan</button></div>';

  var more = document.getElementById("otMore");
  if(more) more.onclick = function(){ otStart(); };
  document.getElementById("otBack").onclick = function(){ OT.sess = null; viewOt(); };
  buildOtFilters();
  window.scrollTo(0, 0);
}

/* Thanh bên ở tab Ôn tập: danh sách bộ thẻ kèm số đến hạn. */
function buildOtFilters(){
  listEl.innerHTML = "";
  var box = document.createElement("div");
  box.style.cssText = "margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)";
  SPECIAL.filter(function(sp){ return sp[3] === "both"; }).forEach(function(sp){
    var b = document.createElement("button");
    b.className = "item" + (current === sp[0] ? " on" : "");
    b.innerHTML = '<span class="n">' + sp[1] + '</span><span class="t"><b></b></span>';
    b.querySelector("b").textContent = sp[2];
    b.onclick = function(){ show(sp[0]); document.body.classList.remove("open"); };
    box.appendChild(b);
  });
  listEl.appendChild(box);

  var prog = document.getElementById("prog");
  if(!OT.cards){
    // dùng appendChild chứ không innerHTML += — cộng chuỗi sẽ dựng lại cả khối trên
    // và làm mất onclick của mấy nút vừa gắn
    var w = document.createElement("p");
    w.style.cssText = "padding:14px 4px;color:var(--muted);font-size:13px";
    w.textContent = "Đang gom thẻ…";
    listEl.appendChild(w);
    if(prog) prog.textContent = "";
    return;
  }

  var now = Date.now();
  var by  = deckStats(OT.cards, now);
  var due = OT.cards.filter(function(c){ return isDue(c.id, now); }).length;

  var d = document.createElement("details");
  d.className = "grp"; d.open = true;
  var s = document.createElement("summary");
  s.textContent = "Chọn bộ thẻ";
  d.appendChild(s);

  var add = function(id, label, nDue, nAll){
    var b = document.createElement("button");
    b.className = "item" + (OT.deck === id ? " on" : "");
    b.innerHTML = '<span class="n"></span><span class="t"><b></b><i></i></span>';
    b.querySelector(".n").textContent = nDue;
    b.querySelector("b").textContent = label;
    b.querySelector("i").textContent = nDue + " đến hạn / " + nAll + " thẻ";
    b.onclick = function(){
      OT.deck = id; OT.sub = "";
      OT.sess = null;                 // đổi phạm vi là bắt đầu lại, không ôn lẫn bộ
      if(current !== "ot") show("ot"); else viewOt();
      document.body.classList.remove("open");
    };
    d.appendChild(b);
  };
  add("", "Tất cả bộ", due, OT.cards.length);
  OT_DECKS.forEach(function(k){ add(k[0], k[1], by[k[0]].due, by[k[0]].n); });
  listEl.appendChild(d);

  // Nhóm con chỉ có nghĩa khi đã chọn một bộ — mỗi bộ chia theo một kiểu khác nhau.
  var subs = subOptions();
  if(OT.deck && subs.length){
    var cntDue = {}, cntAll = {};
    OT.cards.forEach(function(c){
      if(c.deck !== OT.deck) return;
      if(OT.onlyDone && !isLearned(c)) return;
      var k = cardSub(c);
      cntAll[k] = (cntAll[k] || 0) + 1;
      if(isDue(c.id, now)) cntDue[k] = (cntDue[k] || 0) + 1;
    });

    var d2 = document.createElement("details");
    d2.className = "grp"; d2.open = true;
    var s2 = document.createElement("summary");
    s2.textContent = OT.deck === "vc" ? "Lọc theo chủ đề"
                   : OT.deck === "vb" ? "Lọc theo nhóm biến đổi"
                   :                    "Lọc theo nguồn";
    d2.appendChild(s2);

    var addSub = function(id, label, nDue, nAll){
      var b = document.createElement("button");
      b.className = "item" + (OT.sub === id ? " on" : "") + (nAll ? "" : " soon-topic");
      b.innerHTML = '<span class="n"></span><span class="t"><b></b><i></i></span>';
      b.querySelector(".n").textContent = nDue || "—";
      b.querySelector("b").textContent = label;
      b.querySelector("i").textContent = nAll ? nDue + " đến hạn / " + nAll + " thẻ" : "không có thẻ";
      if(nAll){
        b.onclick = function(){
          OT.sub = (OT.sub === id) ? "" : id;
          OT.sess = null;
          viewOt();
          document.body.classList.remove("open");
        };
      }else b.disabled = true;
      d2.appendChild(b);
    };
    var nDeckDue = 0, nDeckAll = 0;
    Object.keys(cntAll).forEach(function(k){ nDeckAll += cntAll[k]; });
    Object.keys(cntDue).forEach(function(k){ nDeckDue += cntDue[k]; });
    addSub("", "Tất cả", nDeckDue, nDeckAll);
    subs.forEach(function(o){ addSub(o[0], o[1], cntDue[o[0]] || 0, cntAll[o[0]] || 0); });
    listEl.appendChild(d2);
  }

  var inSc = scopeCards();
  var seen = inSc.filter(function(c){ return srsBox(c.id); }).length;
  if(prog) prog.textContent =
    due + " thẻ đến hạn · đã gặp " + seen + "/" + inSc.length;
}

/* --- Từ điển lỗi: gom mọi khối "pairs" của TOÀN BỘ tài liệu, kể cả tab Nhập môn --- */
var ERR = { all:null, q:"", scope:"all", shown:0 };
var ERR_PAGE = 60;

function stripTags(s){ return String(s == null ? "" : s).replace(/<[^>]*>/g, ""); }

function collectErrors(){
  if(ERR.all) return Promise.resolve(ERR.all);
  return Promise.all([loadAllFrames(), loadAllLessons(),
                      loadAllSkills(), loadAllBasics()]).then(function(r){
    var out = [];
    var take = function(docs, src){
      eachBlock(docs, "pairs", function(b, f){
        (b.items || []).forEach(function(p){
          out.push({
            wrong: p.wrong, right: p.right, why: p.why,
            src: src, id: f.id, title: f.title,
            q: (stripTags(p.wrong) + " " + stripTags(p.right) + " " +
                stripTags(p.why) + " " + f.title).toLowerCase()
          });
        });
      });
    };
    take(r[0], "kc");
    take(r[1], "ng");
    take(r[2], "sk");
    take(r[3], "nm");
    ERR.all = out;
    return out;
  });
}

function viewErrors(){
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang tải…</p>';
  collectErrors().then(function(all){
    if(current !== "err") return;
    var n = function(s){ return all.filter(function(e){ return e.src === s; }).length; };
    mainEl.innerHTML =
      '<div class="eyebrow">Tra cứu</div><h1>Từ điển lỗi</h1>' +
      '<p class="sub">' + all.length + " cặp Sai/Đúng gom từ toàn bộ tài liệu — " +
      n("nm") + " từ bài nhập môn, " + n("kc") + " từ khung câu, " +
      n("ng") + " từ bài ngữ pháp và " + n("sk") + " từ bài kỹ năng. " +
      "Gõ một chữ bạn hay viết sai để xem nó sai ở đâu và vì sao.</p>" +
      '<div class="errbar">' +
        '<input id="errQ" placeholder="Tìm lỗi… (vd: although, said me, enough)" autocomplete="off">' +
        '<div class="seg" id="errScope" style="margin:0">' +
          '<button data-s="all">Tất cả</button>' +
          '<button data-s="nm">Nhập môn</button>' +
          '<button data-s="kc">Khung câu</button>' +
          '<button data-s="ng">Ngữ pháp</button>' +
          '<button data-s="sk">Kỹ năng</button>' +
        "</div></div><div id=\"errBody\"></div>";
    var box = document.getElementById("errQ");
    box.value = ERR.q;
    box.addEventListener("input", function(){
      ERR.q = box.value; ERR.shown = ERR_PAGE; drawErrors();
    });
    document.querySelectorAll("#errScope button").forEach(function(b){
      if(b.getAttribute("data-s") === ERR.scope) b.classList.add("on");
      b.onclick = function(){
        ERR.scope = b.getAttribute("data-s");
        document.querySelectorAll("#errScope button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        ERR.shown = ERR_PAGE; drawErrors();
      };
    });
    ERR.shown = ERR_PAGE;
    drawErrors();
    window.scrollTo(0,0);
  });
}
function errMatch(){
  var q = ERR.q.trim().toLowerCase();
  return (ERR.all || []).filter(function(e){
    if(ERR.scope !== "all" && e.src !== ERR.scope) return false;
    return !q || e.q.indexOf(q) > -1;
  });
}
function drawErrors(){
  var el = document.getElementById("errBody");
  if(!el) return;
  var hits = errMatch();
  if(!hits.length){
    el.innerHTML = '<div class="soon"><div class="big">&#9888;</div><p><b>Không có lỗi nào khớp.</b></p>' +
      "<p>Thử một chữ khác, hoặc đổi phạm vi sang “Tất cả”.</p></div>";
    return;
  }
  var n = Math.min(ERR.shown, hits.length);
  var h = '<p class="errcount">' + hits.length + " lỗi" +
          (ERR.q.trim() ? " khớp với “" + esc(ERR.q.trim()) + "”" : "") +
          (n < hits.length ? " · đang hiện " + n : "") + '</p><div class="errbox">';
  hits.slice(0, n).forEach(function(e){
    h += pairHTML(e,
      '<p class="src">&#8627; <a href="#" data-go="' +
        keyOf(e.src === "kc" ? "kc" : e.src, e.id) + '">' +
        (e.src === "ng" ? "Ngữ pháp "
         : e.src === "sk" ? "Kỹ năng "
         : e.src === "nm" ? "Nhập môn " : "Khung ") +
        pad3(e.id).slice(1) + " · " + esc(e.title) + "</a></p>");
  });
  h += "</div>";
  if(n < hits.length){
    h += '<button class="errmore" id="errMore">Hiện thêm ' + Math.min(ERR_PAGE, hits.length - n) +
         " lỗi nữa — còn " + (hits.length - n) + "</button>";
  }
  el.innerHTML = h;
  wireGo(el);
  var more = document.getElementById("errMore");
  if(more) more.onclick = function(){ ERR.shown += ERR_PAGE; drawErrors(); };
}

/* ===================== BẢNG ĐỘNG TỪ BẤT QUY TẮC ===================== */
/* Một trang, một bảng xếp theo ALPHABET, lọc theo từ và phân trang.
   q: ô tìm bên trái · letter: chữ cái đầu · hot: chỉ từ hay gặp
   hide: "" xem đủ · "v23" che V2+V3 (tự kiểm tra) · "v1" che V1 (dịch ngược) */
var VB = { q: "", letter: "", hot: false, hide: "", page: 1 };
var VB_PER = 50;

function patName(id){
  var p = ((VINDEX && VINDEX.patterns) || []).filter(function(x){ return x.id === id; })[0];
  return p ? p.name : id;
}
/* Sắp xếp một lần rồi nhớ lại — bảng luôn theo đúng thứ tự A→Z. */
function verbAll(){
  if(!VINDEX) return [];
  if(!VINDEX._sorted){
    VINDEX._sorted = (VINDEX.verbs || []).slice().sort(function(a, b){
      return a[0].localeCompare(b[0], "en") || a[1].localeCompare(b[1], "en");
    });
  }
  return VINDEX._sorted;
}
function verbRows(){
  var q = VB.q.trim().toLowerCase();
  return verbAll().filter(function(v){
    if(VB.letter && v[0].charAt(0).toUpperCase() !== VB.letter) return false;
    if(VB.hot && !v[5]) return false;
    if(!q) return true;
    return (v[0] + " " + v[1] + " " + v[2] + " " + v[3]).toLowerCase().indexOf(q) > -1;
  });
}

function viewVerbs(){
  var d = VINDEX || {};
  var all = (d.verbs || []).length;
  mainEl.innerHTML =
    '<div class="eyebrow">Tra cứu</div><h1>' + esc(d.title || "Động từ bất quy tắc") + "</h1>" +
    '<p class="sub">' + esc(d.tagline || "") + "</p>" +
    (d.intro ? '<div class="callout">' + d.intro + "</div>" : "") +
    '<div class="vbbar">' +
      '<div class="vbfind' + (VB.q.trim() ? " has" : "") + '" id="vbFindWrap">' +
        '<span class="ic">🔎</span>' +
        '<input id="vbFind" type="search" autocomplete="off" spellcheck="false"' +
          ' placeholder="Tìm động từ… (went, broke, ăn)" value="' + escAttr(VB.q) + '">' +
        '<button class="clr" type="button" id="vbFindClr" title="Xoá ô tìm">&times;</button>' +
      "</div>" +
      '<div class="seg" id="vbHide" style="margin:0">' +
        '<button data-h="">Xem đủ</button>' +
        '<button data-h="v23">Che V2 · V3</button>' +
        '<button data-h="v1">Che V1</button>' +
      "</div>" +
      '<label class="vbonly"><input type="checkbox" id="vbOnly"> Chỉ ' +
        (d.verbs || []).filter(function(v){ return v[5]; }).length + " từ hay gặp</label>" +
      '<button class="btn" id="vbReset">Bỏ lọc</button>' +
    "</div><div id=\"vbBody\"></div>" +
    (d.traps && d.traps.length
      ? '<h2><span class="num">1</span>BẪY người Việt hay mắc</h2>' + BLOCK.pairs({ items: d.traps })
      : "");

  mainEl.querySelectorAll("#vbHide button").forEach(function(b){
    if(b.getAttribute("data-h") === VB.hide) b.classList.add("on");
    b.onclick = function(){
      VB.hide = b.getAttribute("data-h");
      mainEl.querySelectorAll("#vbHide button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      drawVerbs();
    };
  });
  var find = document.getElementById("vbFind");
  find.addEventListener("input", function(){ buildList(find.value); });
  document.getElementById("vbFindClr").onclick = function(){
    find.value = ""; buildList(""); find.focus();
  };

  var only = document.getElementById("vbOnly");
  only.checked = VB.hot;
  only.onchange = function(){ VB.hot = only.checked; VB.page = 1; buildList(VB.q); };
  document.getElementById("vbReset").onclick = function(){
    VB.q = ""; VB.letter = ""; VB.hot = false; VB.page = 1;
    var box = document.getElementById("search");
    if(box) box.value = "";
    find.value = "";
    only.checked = false;
    buildList("");
  };

  drawVerbs();
  decorate();
  window.scrollTo(0,0);
  return all;
}

function drawVerbs(){
  var el = document.getElementById("vbBody");
  if(!el) return;
  var rows = verbRows();

  if(!rows.length){
    el.innerHTML = '<div class="soon"><div class="big">&#128269;</div><p><b>Không có động từ nào khớp.</b></p>' +
      "<p>Thử một chữ khác, hoặc bấm <b>Bỏ lọc</b> để xem lại toàn bộ bảng.</p></div>";
    return;
  }

  var pages = Math.ceil(rows.length / VB_PER);
  if(VB.page > pages) VB.page = pages;
  if(VB.page < 1) VB.page = 1;
  var from = (VB.page - 1) * VB_PER;
  var slice = rows.slice(from, from + VB_PER);

  var bits = [rows.length + " động từ"];
  if(VB.letter) bits.push("chữ " + VB.letter);
  if(VB.hot) bits.push("chỉ từ hay gặp");
  if(VB.q.trim()) bits.push("khớp “" + esc(VB.q.trim()) + "”");
  if(pages > 1) bits.push("dòng " + (from + 1) + "–" + (from + slice.length));

  var h = '<p class="errcount">' + bits.join(" · ") + "</p>";
  h += '<div class="vbwrap"><table class="vb' + (VB.hide ? " hide-" + VB.hide : "") + '"><thead><tr>' +
       "<th>V1 — nguyên thể</th><th>V2 — quá khứ</th><th>V3 — phân từ</th><th>Nghĩa</th>" +
       "</tr></thead><tbody>";
  slice.forEach(function(v){
    h += '<tr class="' + (v[5] ? "hot" : "") + '">' +
         '<td class="c1"><span class="w">' + esc(v[0]) + "</span></td>" +
         '<td class="c2"><span class="w">' + esc(v[1]) + "</span></td>" +
         '<td class="c3"><span class="w">' + esc(v[2]) + "</span></td>" +
         '<td class="vi">' + esc(v[3]) +
           '<span class="ptag" title="' + esc(patName(v[4])) + '">' + esc(v[4]) + "</span>" +
           '<button class="say" type="button" title="Nghe" data-say="' +
           esc(v[0] + ", " + v[1] + ", " + v[2]) + '">🔊</button></td></tr>';
  });
  h += "</tbody></table></div>";

  h += pagerHTML(VB.page, pages, "pager");

  h += '<p class="vbnote">Bảng xếp theo thứ tự A→Z của cột V1. Bấm <b>Che V2 · V3</b> rồi tự đọc to hai cột đó ' +
       "trước khi rê chuột lên xem — nhớ bằng miệng chắc hơn nhớ bằng mắt. Dòng nền cam là động từ hay gặp nhất.</p>";
  el.innerHTML = h;

  el.querySelectorAll("[data-say]").forEach(function(b){
    b.onclick = function(){ speak(b.getAttribute("data-say")); };
  });
  el.querySelectorAll("#pager button[data-p]").forEach(function(b){
    b.onclick = function(){
      if(b.disabled) return;
      VB.page = parseInt(b.getAttribute("data-p"), 10);
      drawVerbs();
      var top = mainEl.querySelector(".vbwrap");
      if(top && top.scrollIntoView) top.scrollIntoView({ block: "start" });
    };
  });
}

/* ===================== TỪ VỰNG B2 ===================== */
/* Một trang, một bảng. Lọc bằng: q · topic · hot. hide: "" xem đủ · "vi" che nghĩa · "en" che từ */
var VC = { q: "", topic: "", hot: false, hide: "", lv: "", page: 1, sel: "" };
var VDETAIL = null;                  // data/vocab-detail.json — dong nghia / trai nghia / cau them
var VC_PER = 40;

function topicName(id){
  var t = ((CINDEX && CINDEX.topics) || []).filter(function(x){ return x.id === id; })[0];
  return t ? t.name : id;
}
function vocabAll(){ return (CINDEX && CINDEX.words) || []; }
/* Trình độ của một chủ đề: "a1" hay "b2". Chủ đề cũ chưa gắn lv thì coi là b2. */
function topicLv(id){
  var t = ((CINDEX && CINDEX.topics) || []).filter(function(x){ return x.id === id; })[0];
  return (t && t.lv) || "b2";
}
/* Khoa mot muc tu vung: TU + LOAI TU — dung chinh luat trung tu cua vocab.json.
   book (n, "quyen sach") va book (v, "dat ve") la hai muc khac nhau. */
function vcKey(w){ return w[0] + "|" + w[1]; }
function vcDetail(w){ return (VDETAIL && VDETAIL[vcKey(w)]) || null; }
function vcFind(key){
  var a = vocabAll();
  for(var i = 0; i < a.length; i++) if(vcKey(a[i]) === key) return a[i];
  return null;
}
/* Tim theo CHINH TU, khong ro loai tu — dung khi bam vao mot tu dong nghia. */
function vcFindWord(word){
  var a = vocabAll(), lw = String(word).toLowerCase();
  for(var i = 0; i < a.length; i++) if(a[i][0].toLowerCase() === lw) return a[i];
  return null;
}
function vocabRows(){
  var q = VC.q.trim().toLowerCase();
  return vocabAll().filter(function(w){
    if(VC.lv && topicLv(w[3]) !== VC.lv) return false;
    if(VC.topic && w[3] !== VC.topic) return false;
    if(VC.hot && !w[6]) return false;
    if(!q) return true;
    return (w[0] + " " + w[2] + " " + w[4] + " " + w[5]).toLowerCase().indexOf(q) > -1;
  });
}

function viewVocab(){
  var d = CINDEX || {};
  mainEl.classList.add("vcmode");
  mainEl.innerHTML =
    '<div class="eyebrow">Tra cứu</div><h1>' + esc(d.title || "Từ vựng") + "</h1>" +
    '<p class="sub">' + esc(d.tagline || "") + "</p>" +
    '<div class="vbbar">' +
      '<div class="vbfind' + (VC.q.trim() ? " has" : "") + '" id="vcFindWrap">' +
        '<span class="ic">🔎</span>' +
        '<input id="vcFind" type="search" autocomplete="off" spellcheck="false"' +
          ' placeholder="Tìm trong bảng… (deadline, lương, hạn chót)" value="' + escAttr(VC.q) + '">' +
        '<button class="clr" type="button" id="vcFindClr" title="Xoá ô tìm">&times;</button>' +
      "</div>" +
      '<div class="seg" id="vcLv" style="margin:0">' +
        '<button data-l="">Tất cả</button>' +
        '<button data-l="a1">A1 — người mới</button>' +
        '<button data-l="b2">B2</button>' +
      "</div>" +
      '<div class="seg" id="vcHide" style="margin:0">' +
        '<button data-h="">Xem đủ</button>' +
        '<button data-h="vi">Che nghĩa</button>' +
        '<button data-h="en">Che từ</button>' +
      "</div>" +
      '<label class="vbonly"><input type="checkbox" id="vcOnly"> Chỉ ' +
        vocabAll().filter(function(w){ return w[6]; }).length + " từ hay gặp</label>" +
      '<button class="btn" id="vcReset">Bỏ lọc</button>' +
    "</div>" +
    '<div class="vc2">' +
      '<div class="vc-pane" id="vcList">' +
        '<div class="vc-cap" id="vcCap"></div>' +
        '<div class="vc-rows" id="vcRows"></div>' +
        '<div class="vc-foot" id="vcFoot"></div>' +
      "</div>" +
      '<div class="vc-pane"><div class="vc-det" id="vcDet"></div></div>' +
    "</div>";

  mainEl.querySelectorAll("#vcLv button").forEach(function(b){
    if(b.getAttribute("data-l") === VC.lv) b.classList.add("on");
    b.onclick = function(){
      VC.lv = b.getAttribute("data-l");
      VC.topic = "";          // chủ đề cũ có thể không thuộc trình độ mới chọn
      VC.page = 1;
      buildList(VC.q);
    };
  });
  mainEl.querySelectorAll("#vcHide button").forEach(function(b){
    if(b.getAttribute("data-h") === VC.hide) b.classList.add("on");
    b.onclick = function(){
      VC.hide = b.getAttribute("data-h");
      mainEl.querySelectorAll("#vcHide button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      drawVocab();
    };
  });
  // O tim tren bang va o tim o thanh ben la MOT: ca hai cung di qua buildList()
  var find = document.getElementById("vcFind");
  find.addEventListener("input", function(){ buildList(find.value); });
  document.getElementById("vcFindClr").onclick = function(){
    find.value = ""; buildList(""); find.focus();
  };

  var only = document.getElementById("vcOnly");
  only.checked = VC.hot;
  only.onchange = function(){ VC.hot = only.checked; VC.page = 1; buildList(VC.q); };
  document.getElementById("vcReset").onclick = function(){
    VC.q = ""; VC.topic = ""; VC.hot = false; VC.lv = ""; VC.page = 1;
    var box = document.getElementById("search");
    if(box) box.value = "";
    find.value = "";
    only.checked = false;
    buildList("");
  };

  drawVocab();
  decorate();
  window.scrollTo(0,0);
}

/* ---- panel trai: danh sach + phan trang ---- */
function drawVocab(){
  var rowsEl = document.getElementById("vcRows");
  if(!rowsEl) return;
  var capEl = document.getElementById("vcCap"), footEl = document.getElementById("vcFoot");
  var rows = vocabRows();

  rowsEl.className = "vc-rows" + (VC.hide ? " hide-" + VC.hide : "");

  if(!rows.length){
    capEl.textContent = "không có từ nào khớp";
    footEl.innerHTML = "";
    rowsEl.innerHTML = '<div class="soon"><div class="big">&#128269;</div>' +
      "<p><b>Không có từ nào khớp.</b></p>" +
      "<p>Thử một chữ khác, hoặc bấm <b>Bỏ lọc</b> để xem lại toàn bộ bảng.</p></div>";
    drawVcDetail();
    return;
  }

  var pages = Math.ceil(rows.length / VC_PER);
  if(VC.page > pages) VC.page = pages;
  if(VC.page < 1) VC.page = 1;
  var from = (VC.page - 1) * VC_PER;
  var slice = rows.slice(from, from + VC_PER);

  var bits = [rows.length + " từ"];
  if(VC.lv) bits.push(VC.lv === "a1" ? "trình độ A1" : "trình độ B2");
  if(VC.topic) bits.push(esc(topicName(VC.topic)));
  if(VC.hot) bits.push("chỉ từ hay gặp");
  if(VC.q.trim()) bits.push("khớp “" + esc(VC.q.trim()) + "”");
  if(pages > 1) bits.push("dòng " + (from + 1) + "–" + (from + slice.length));
  capEl.innerHTML = bits.join(" · ");

  // Chua chon gi, hoac tu dang chon khong con trong trang nay -> chon dong dau
  if(!VC.sel || !slice.filter(function(w){ return vcKey(w) === VC.sel; }).length){
    VC.sel = vcKey(slice[0]);
  }

  var h = "";
  slice.forEach(function(w){
    var k = vcKey(w);
    h += '<button type="button" class="vcrow' + (w[6] ? " hot" : "") +
           (k === VC.sel ? " on" : "") + '" data-k="' + escAttr(k) + '">' +
         '<span class="w">' + esc(w[0]) + "</span>" +
         '<span class="pos">' + esc(w[1]) + "</span>" +
         (w[7] ? '<span class="ipa">' + esc(w[7]) + "</span>" : "") +
         '<span class="m">' + esc(w[2]) + "</span></button>";
  });
  rowsEl.innerHTML = h;
  rowsEl.querySelectorAll(".vcrow").forEach(function(b){
    b.onclick = function(){ vcSelect(b.getAttribute("data-k")); };
  });

  footEl.innerHTML = pages > 1
    ? pagerHTML(VC.page, pages, "vcPager")
    : '<div class="pager"><span class="pginfo">hết ' + rows.length + " từ</span></div>";
  footEl.querySelectorAll("#vcPager button[data-p]").forEach(function(b){
    b.onclick = function(){
      if(b.disabled) return;
      VC.page = parseInt(b.getAttribute("data-p"), 10);
      VC.sel = "";                 // sang trang moi thi chon lai dong dau trang do
      drawVocab();
      rowsEl.scrollTop = 0;        // cuon TRONG panel, khong dong den trang
    };
  });

  drawVcDetail();
}

/* Chon mot tu: chi ve lai vien dong va panel phai, khong dung den danh sach */
function vcSelect(key){
  VC.sel = key;
  var rowsEl = document.getElementById("vcRows");
  if(rowsEl) rowsEl.querySelectorAll(".vcrow").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-k") === key);
  });
  drawVcDetail();
}

/* Mot danh sach tu (dong nghia / thay the / trai nghia) trong panel phai.
   Moi muc co the la "tu" hoac ["tu", "ghi chu"]. Tu nao co trong bang thi bam sang duoc. */
function vcWordList(arr, empty){
  if(!arr || !arr.length) return '<p class="nope">' + empty + "</p>";
  var h = '<ul class="wl">';
  arr.forEach(function(it){
    var word = typeof it === "string" ? it : it[0];
    var note = typeof it === "string" ? "" : (it[1] || "");
    var hit  = vcFindWord(word);
    h += "<li>" + (hit
           ? '<button type="button" class="jump" data-jump="' + escAttr(vcKey(hit)) + '">' +
             esc(word) + "</button>"
           : "<b>" + esc(word) + "</b>") +
         ' <button class="say" type="button" title="Nghe từ này" data-say="' + escAttr(word) + '">🔊</button>' +
         (note ? ' <i>— ' + esc(note) + "</i>" : "") + "</li>";
  });
  return h + "</ul>";
}

/* ---- panel phai: chi tiet mot tu ---- */
function drawVcDetail(){
  var el = document.getElementById("vcDet");
  if(!el) return;
  var w = VC.sel ? vcFind(VC.sel) : null;
  if(!w){
    el.innerHTML = '<div class="vc-empty">Chọn một từ ở danh sách bên trái để xem chi tiết.</div>';
    return;
  }

  var det = vcDetail(w) || {};
  // "Chua soan" va "khong co tu nao" la HAI chuyen khac nhau — noi gop lai thi nguoi hoc
  // tuong tieng Anh khong co tu trai nghia cho 'interview', trong khi that ra la chua viet.
  var curated = !!vcDetail(w);
  function none(what){
    return curated ? "Mục này không có " + what + " rõ rệt."
                   : "Chưa soạn " + what + " cho mục này.";
  }
  // Cau ngu canh: cau goc trong bang luon co, cong them cau soan rieng neu da co
  var exs = [[w[4], w[5]]].concat(det.ex || []);

  // Cung chu de: lay vai tu ke ben de hoc theo cum, khong phai tu le
  var near = vocabAll().filter(function(x){
    return x[3] === w[3] && vcKey(x) !== VC.sel;
  }).slice(0, 12);

  var h = '<div class="hd"><span class="w">' + esc(w[0]) + "</span>" +
          '<button class="say" type="button" title="Nghe từ này" data-say="' + escAttr(w[0]) + '">🔊</button>' +
          (w[7] ? '<span class="ipa">' + esc(w[7]) + "</span>" : "") +
          '<span class="pos">' + esc(w[1]) + "</span>" +
          (w[6] ? '<span class="pill">hay gặp</span>' : "") +
          '<span class="pill" style="margin-left:auto">' + esc(topicName(w[3])) + "</span></div>" +
          '<p class="mean">' + esc(w[2]) + "</p>";

  h += "<h4>Câu ngữ cảnh</h4>";
  exs.forEach(function(p){
    h += '<div class="ex"><p class="en">' + esc(p[0]) +
         ' <button class="say" type="button" title="Nghe cả câu" data-say="' + escAttr(p[0]) + '">🔊</button></p>' +
         '<p class="vi">' + esc(p[1]) + "</p></div>";
  });

  h += "<h4>Từ đồng nghĩa</h4>"  + vcWordList(det.syn, none("từ đồng nghĩa"));
  h += "<h4>Thay thế</h4>"       + vcWordList(det.alt, none("cách nói thay thế"));
  h += "<h4>Từ trái nghĩa</h4>"  + vcWordList(det.ant, none("từ trái nghĩa"));

  if(near.length){
    h += '<h4>Cùng chủ đề</h4><div class="near">';
    near.forEach(function(x){
      h += '<button type="button" data-jump="' + escAttr(vcKey(x)) + '" title="' + escAttr(x[2]) + '">' +
           esc(x[0]) + "</button>";
    });
    h += "</div>";
  }

  el.innerHTML = h;
  el.scrollTop = 0;
  el.querySelectorAll("[data-say]").forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); speak(b.getAttribute("data-say")); };
  });
  el.querySelectorAll("[data-jump]").forEach(function(b){
    b.onclick = function(){ vcJump(b.getAttribute("data-jump")); };
  });
}

/* Bam sang mot tu khac: tu do co the dang nam ngoai bo loc hoac o trang khac,
   nen phai tim xem no o trang nao roi lat tro den, khong chi doi panel phai. */
function vcJump(key){
  var rows = vocabRows(), at = -1, i;
  for(i = 0; i < rows.length; i++) if(vcKey(rows[i]) === key){ at = i; break; }
  if(at < 0){                       // bi bo loc che mat -> go loc de hien ra
    VC.topic = ""; VC.hot = false; VC.lv = ""; VC.q = "";
    var box = document.getElementById("search"), find = document.getElementById("vcFind");
    if(box) box.value = "";
    if(find) find.value = "";
    rows = vocabRows();
    for(i = 0; i < rows.length; i++) if(vcKey(rows[i]) === key){ at = i; break; }
    if(at < 0) return;
  }
  VC.page = Math.floor(at / VC_PER) + 1;
  VC.sel  = key;
  drawVocab();
  var rowsEl = document.getElementById("vcRows");
  var hit = rowsEl && rowsEl.querySelector('.vcrow[data-k="' + key.replace(/"/g, "&quot;") + '"]');
  if(hit && hit.scrollIntoView) hit.scrollIntoView({ block: "nearest" });
}

/* Thanh phân trang dùng chung cho tab Động từ và tab Từ vựng. */
function pagerHTML(page, pages, id){
  if(pages <= 1) return "";
  var h = '<div class="pager" id="' + id + '">' +
          '<button class="btn" data-p="' + (page - 1) + '"' + (page === 1 ? " disabled" : "") +
          ">&larr; Trước</button>";
  var lo = Math.max(1, Math.min(page - 3, pages - 6));
  var hi = Math.min(pages, lo + 6);
  if(lo > 1) h += '<button class="btn pg" data-p="1">1</button><span class="gap">…</span>';
  for(var i = lo; i <= hi; i++){
    h += '<button class="btn pg' + (i === page ? " on" : "") + '" data-p="' + i + '">' + i + "</button>";
  }
  if(hi < pages) h += '<span class="gap">…</span><button class="btn pg" data-p="' + pages + '">' + pages + "</button>";
  return h + '<button class="btn" data-p="' + (page + 1) + '"' + (page === pages ? " disabled" : "") +
         ">Sau &rarr;</button>" +
         '<span class="pginfo">Trang ' + page + " / " + pages + "</span></div>";
}

/* ===================== KIEM TRA DAU VAO (muc 21a) =====================
   Bai nay KHONG cham diem de xep hang — no tra loi dung mot cau: nen bat dau
   tu nhom nao. Vi the ket qua tra ve "nhom nen bat dau" chu khong phai con so. */
var PT_BANDS = ["A1", "A2", "B1", "B2"];
var PT_PASS  = 0.7;        // dat moc nay coi nhu da nam duoc bac do
var PT_NEXT  = 0.5;        // qua nua bac ke tiep thi them dau "+"

function ptLoad(){ return PT.res || load("pt_res", null); }

/* Cham bai. Tra ve ca diem theo BAC trinh do lan theo NHOM ngu phap:
   bac de uoc luong trinh do, nhom de chi cho bat dau. */
function ptScore(ans){
  var items = (PLACE && PLACE.items) || [];
  var byG = {}, byL = {}, right = 0;
  items.forEach(function(it, i){
    var ok = ans[i] === it.a;
    if(ok) right++;
    if(!byG[it.g]) byG[it.g] = { ok: 0, n: 0 };
    byG[it.g].n++; if(ok) byG[it.g].ok++;
    if(!byL[it.lv]) byL[it.lv] = { ok: 0, n: 0 };
    byL[it.lv].n++; if(ok) byL[it.lv].ok++;
  });
  // Trinh do = bac cao nhat ma MOI bac tu A1 den do deu dat nguong.
  // Dung vong lap dut khi gap bac truot: gioi khuc tren ma hong khuc duoi thi
  // van la hong khuc duoi — do moi la cho can hoc lai.
  var lv = PT_BANDS[0], i, b;
  for(i = 0; i < PT_BANDS.length; i++){
    b = byL[PT_BANDS[i]];
    if(b && b.ok / b.n >= PT_PASS) lv = PT_BANDS[i]; else break;
  }
  var ni = PT_BANDS.indexOf(lv) + 1, plus = false;
  if(ni < PT_BANDS.length){
    b = byL[PT_BANDS[ni]];
    if(b && b.ok / b.n >= PT_NEXT) plus = true;
  }
  // Nhom nen bat dau = nhom THAP NHAT chua dat nguong. 0 = khong nhom nao hong.
  var start = 0, g;
  for(g = 1; g <= ((PLACE && PLACE.groups) || []).length; g++){
    if(byG[g] && byG[g].ok / byG[g].n < PT_PASS){ start = g; break; }
  }
  return { right: right, n: items.length, lv: lv, plus: plus,
           byG: byG, byL: byL, start: start, at: Date.now() };
}

/* Bai dau tien cua mot nhom — dung cho nut "Bat dau tu Nhom N". */
function ptFirstLesson(g){
  var gr = GINDEX && GINDEX.groups && GINDEX.groups[g - 1];
  return gr && gr.items && gr.items.length ? gr.items[0].id : null;
}

  // Moi lan mo trang la mot lan lam moi; ket qua cu van con trong localStorage

function drawPlacement(){
  var items = PLACE.items || [];

  if(!PT.done && PLACE.intro) h += '<div class="callout">' + PLACE.intro + "</div>";

  items.forEach(function(it, i){

    it.opts.forEach(function(o, j){
      var cls = "";

      }else if(j === pick) cls = " pick";
      h += '<button type="button" class="' + cls.trim() + '" data-q="' + i + '" data-o="' + j + '"' +
           (PT.done ? " disabled" : "") + ">" + esc(o) + "</button>";
    });
    h += "</div>";
    if(PT.done){
      h += '<p class="pt-why' + (ok ? "" : " bad") + '">' +
           (ok ? "\u2713 Đúng. " : "\u2717 Đáp án đúng: <b>" + esc(it.opts[it.a]) + "</b>. ") +
           it.why + "</p>" +
           '<p class="pt-why"><button type="button" class="btn" data-go="' + it.lesson +
           '">Mở bài ' + pad3(it.lesson).slice(1) + "</button></p>";
    }
    h += "</div>";
  });

  if(!PT.done){
    h += '<div class="ot-bar"><button type="button" class="btn go" id="ptDone"' +
         (left ? " disabled" : "") + ">" +
         (left ? "Còn " + left + " câu chưa chọn" : "Xem kết quả") + "</button></div>";
  }else{
    h += '<div class="ot-bar"><button type="button" class="btn go" id="ptAgain">Làm lại từ đầu</button></div>';
  }
  mainEl.innerHTML = h;

  mainEl.querySelectorAll(".pt-opts button").forEach(function(b){
    b.onclick = function(){
      PT.ans[parseInt(b.getAttribute("data-q"), 10)] = parseInt(b.getAttribute("data-o"), 10);
      drawPlacement();
    };
  });
  var d = document.getElementById("ptDone");
  if(d) d.onclick = function(){
    PT.res = ptScore(PT.ans);
    save("pt_res", PT.res);
    PT.done = true;
    drawPlacement();
    buildList(document.getElementById("search").value);
    window.scrollTo(0, 0);
  };
  var ag = document.getElementById("ptAgain");
  if(ag) ag.onclick = function(){ viewPlacement(); };
  mainEl.querySelectorAll("button[data-go]").forEach(function(b){
    b.onclick = function(){ show("g" + b.getAttribute("data-go")); };
  });
  var st = document.getElementById("ptStart");
  if(st) st.onclick = function(){ show("g" + st.getAttribute("data-l")); };
}

function ptResultHTML(){
  var r = ptLoad();
  if(!r) return "";
  var bands = (PLACE.bands || []).filter(function(b){ return b.lv === r.lv; })[0] || {};
  var h = '<div class="pt-res">' +
            '<div class="lv">' + esc(r.lv + (r.plus ? "+" : "")) + "</div>" +

  if(r.start && first){
    h += '<p class="say">Nên bắt đầu từ <b>Nhóm ' + r.start + " · " + esc(gs[r.start - 1]) + "</b>." +
         (r.start > 1 ? " Nhóm 1\u2013" + (r.start - 1) + " chỉ cần lướt cho chắc." : "") + "</p>" +
         '<button type="button" class="btn go" id="ptStart" data-l="' + first +
         '">Mở bài đầu của Nhóm ' + r.start + "</button>";
  }else{
    h += '<p class="say">Không nhóm nào dưới ngưỡng \u2014 nền của bạn đã vững. ' +

  }
  h += "</div>";

  gs.forEach(function(nm, i){

    var pc = g.n ? Math.round(g.ok * 100 / g.n) : 0;
    h += '<div class="g' + (r.start === i + 1 ? " start" : "") + '">' +
           '<span class="nm">Nhóm ' + (i + 1) + " · " + esc(nm) + "</span>" +
           '<span class="bar"><i class="' + (pc < 70 ? "low" : "") +
             '" style="width:' + pc + '%"></i></span>' +
           '<span class="sc">' + g.ok + "/" + g.n + "</span></div>";

/* ===================== KIEM TRA CHANG (muc 21b) =====================
   Khong co file du lieu rieng: cau hoi rut thang tu khoi "pairs" va "quiz"
   cua chinh cac bai trong nhom. Hai dieu kien cua muc 21b:
     - DAO THU TU  -> tron ngau nhien moi lan lam
     - GIAU BAI GOC -> trong luc lam khong noi cau nay tu bai nao; chi lo ra
                       o trang ket qua, dung cho nguoi hoc biet phai quay lai dau.
   Chi lay nhung cau CHAM DUOC CHAC: cap Sai/Dung (dap an dung da duoc ghi ro),
   va cau dien cho da co san lua chon trong ngoac. Khong tu bia dap an nhieu —
   dap an bia co the vo tinh cung dung, cham sai thi con hai hon khong cham. */
var CP_N = 15, CP_PASS = 0.7;
var CP = { g: 0, qs: null, ans: null, done: false, res: null };
/* Lua chon da co san trong de: "(cut my hair / had my hair cut)" */
var CP_INLINE = /\(([^()]*?\/[^()]*?)\)/;

function cpAllRes(){ return CP.all || load("cp_res", {}) || {}; }
function cpSaveRes(g, r){
  var all = cpAllRes();
  all[g] = r;
  CP.all = all;              // giu trong bo nho truoc, giong muc 21a
  save("cp_res", all);
}

/* Bo bai cua mot nhom. */
function cpGroupItems(g){
  var gr = GINDEX && GINDEX.groups && GINDEX.groups[g - 1];
  return (gr && gr.items) || [];
}
function cpLoadGroup(g){
  var ids = cpGroupItems(g).filter(function(x){ return x.detail; })
                           .map(function(x){ return x.id; });
  return Promise.all(ids.map(loadLesson)).then(function(l){ return l.filter(Boolean); });
}

function cpShuffle(a){
  var i, j, t;
  for(i = a.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function cpHead(a){ return String(a || "").split("\u2014")[0].trim(); }

/* Rut het cau cham duoc tu cac bai cua nhom. */
function cpHarvest(docs){
  var out = [];
  eachBlock(docs, "pairs", function(b, f){
    (b.items || []).forEach(function(it){
      if(!it.wrong || !it.right) return;
      var opts = cpShuffle([{ h: it.right, ok: true }, { h: it.wrong, ok: false }]);
      out.push({ kind: "pair", vi: "Câu nào đúng?", q: "",
                 opts: opts.map(function(o){ return o.h; }),
                 a: opts[0].ok ? 0 : 1,
                 why: it.why || "", lesson: f.id, title: f.title || "" });
    });
  });
  eachBlock(docs, "quiz", function(b, f){
    (b.items || []).forEach(function(it){
      var bl = it.blank || "", m = CP_INLINE.exec(bl);
      if(!m) return;
      var opts = m[1].split("/").map(function(x){ return x.trim(); })
                     .filter(function(x){ return x.length; });
      var head = cpHead(it.a), at = opts.indexOf(head);
      if(opts.length < 2 || at < 0) return;   // khong chac dap an nao dung -> bo
      var order = cpShuffle(opts.map(function(o, i){ return i; }));
      out.push({ kind: "gap", vi: it.vi || "",
                 q: bl.replace(CP_INLINE, "").replace(/\s+/g, " ").trim(),
                 opts: order.map(function(i){ return opts[i]; }),
                 a: order.indexOf(at),
                 why: it.a || "", lesson: f.id, title: f.title || "" });
    });
  });
  return out;
}

/* Tron roi lay 15 cau, co y pha deu giua hai kieu va giua cac bai. */
function cpPick(all){
  var pairs = cpShuffle(all.filter(function(q){ return q.kind === "pair"; }));
  var gaps  = cpShuffle(all.filter(function(q){ return q.kind === "gap"; }));
  var want  = Math.min(CP_N, all.length);
  var nGap  = Math.min(gaps.length, Math.floor(want / 3));
  return cpShuffle(gaps.slice(0, nGap).concat(pairs.slice(0, want - nGap)));
}

function viewCheckpoint(){
  if(!GINDEX){ mainEl.innerHTML = '<p style="color:var(--muted)">Chưa có dữ liệu ngữ pháp.</p>'; return; }
  CP = { g: 0, qs: null, ans: null, done: false, res: null, all: cpAllRes() };
  drawCpMenu();
  window.scrollTo(0, 0);
}

function drawCpMenu(){
  var res = cpAllRes();
  var h = '<div class="eyebrow">Đánh giá</div><h1>Kiểm tra chặng</h1>' +
          '<p class="sub">Học xong một nhóm thì kiểm lại ngay: ' + CP_N +
          " câu rút thẳng từ chính các bài trong nhóm đó, <b>đảo thứ tự</b> và " +
          "<b>không nói câu nào thuộc bài nào</b> — có thuộc thật hay chỉ nhớ mặt chữ sẽ lộ ra ở đây. " +
          "Dưới " + Math.round(CP_PASS * 100) + "% thì trang kết quả chỉ thẳng những bài cần học lại.</p>" +
          '<div class="ot-grid">';
  GINDEX.groups.forEach(function(g, i){
    var gn = i + 1;
    var items = g.items || [];
    var done = items.filter(function(it){ return ngDone.indexOf(it.id) > -1; }).length;
    var r = res[gn];
    var pc = done ? Math.round(done * 100 / items.length) : 0;
    h += '<button type="button" class="ot-card' + (r ? " has" : "") + '" data-g="' + gn + '">' +
           '<div class="nm">' + esc(g.name) + "</div>" +
           '<div class="sub">' + done + "/" + items.length + " bài đã học</div>" +
           '<div class="bar"><i style="width:' + pc + '%"></i></div>' +
           '<div class="foot">' +
             (r ? (r.pc >= Math.round(CP_PASS * 100) ? "\u2713 " : "\u2717 ") +
                  "Lần trước: " + r.pc + "% (" + r.ok + "/" + r.n + ")"
                : "Chưa kiểm tra lần nào") +
           "</div></button>";
  });
  h += "</div>";
  mainEl.innerHTML = h;
  mainEl.querySelectorAll(".ot-card[data-g]").forEach(function(b){
    b.onclick = function(){ cpStart(parseInt(b.getAttribute("data-g"), 10)); };
  });
}

function cpStart(g){
  CP.g = g; CP.qs = null; CP.ans = null; CP.done = false; CP.res = null;
  mainEl.innerHTML = '<p style="color:var(--muted)">Đang chuẩn bị đề…</p>';
  cpLoadGroup(g).then(function(docs){
    if(current !== "cp" || CP.g !== g) return;
    var all = cpHarvest(docs);
    if(all.length < 5){
      mainEl.innerHTML = '<div class="eyebrow">Đánh giá</div><h1>Kiểm tra chặng</h1>' +
        '<div class="soon"><div class="big">&#127937;</div>' +
        "<p><b>Nhóm này chưa đủ câu để ra đề.</b></p>" +
        "<p>Cần thêm khối <code>pairs</code> hoặc <code>quiz</code> trong các bài của nhóm.</p></div>";
      return;
    }
    CP.qs  = cpPick(all);
    CP.ans = CP.qs.map(function(){ return null; });
    drawCp();
    window.scrollTo(0, 0);
  });
}

function cpScore(){
  var ok = 0, miss = {};
  CP.qs.forEach(function(q, i){
    if(CP.ans[i] === q.a){ ok++; return; }
    if(!miss[q.lesson]) miss[q.lesson] = { n: 0, title: q.title };
    miss[q.lesson].n++;
  });
  return { ok: ok, n: CP.qs.length,
           pc: Math.round(ok * 100 / CP.qs.length), miss: miss, at: Date.now() };
}

function drawCp(){
  var gname = (GINDEX.groups[CP.g - 1] || {}).name || "";
  var left  = CP.ans.filter(function(a){ return a === null; }).length;
  var h = '<div class="eyebrow">Kiểm tra chặng</div><h1>' + esc(gname) + "</h1>";
  if(CP.done) h += cpResultHTML();
  else h += '<p class="sub">' + CP.qs.length + " câu · chọn đáp án đúng. " +
            "Đề trộn lại mỗi lần làm nên không học thuộc được thứ tự.</p>";

  CP.qs.forEach(function(q, i){
    var pick = CP.ans[i], ok = pick === q.a;
    h += '<div class="pt-q' + (pick !== null ? " done" : "") + '">' +
           '<div class="no">Câu ' + (i + 1) + " / " + CP.qs.length + "</div>" +
           (q.vi ? '<div class="vi">' + esc(q.vi) + "</div>" : "") +
           (q.q  ? '<div class="en">' + esc(q.q) + "</div>" : "") +
           '<div class="pt-opts">';
    q.opts.forEach(function(o, j){
      var on = (CP.done ? (j === q.a || j === pick) : j === pick);
      h += '<button type="button" class="' + (on ? "pick" : "") + '" data-q="' + i +
           '" data-o="' + j + '"' + (CP.done ? " disabled" : "") + ">" + o + "</button>";
    });
    h += "</div>";
    if(CP.done){
      h += '<p class="pt-why' + (ok ? "" : " bad") + '">' +
           (ok ? "\u2713 Đúng. " : "\u2717 Đáp án đúng: <b>" + q.opts[q.a] + "</b>. ") +
           q.why + "</p>" +
           '<p class="pt-why"><button type="button" class="btn" data-go="' + q.lesson +
           '">Bài ' + pad3(q.lesson).slice(1) + " · " + esc(q.title) + "</button></p>";
    }
    h += "</div>";
  });

  h += '<div class="ot-bar">';
  if(!CP.done){
    h += '<button type="button" class="btn go" id="cpDone"' + (left ? " disabled" : "") + ">" +
         (left ? "Còn " + left + " câu chưa chọn" : "Chấm bài") + "</button>";
  }else{
    h += '<button type="button" class="btn go" id="cpAgain">Làm lại đề khác</button>';
  }
  h += '<button type="button" class="btn" id="cpBack">&larr; Chọn nhóm khác</button></div>';
  mainEl.innerHTML = h;

  mainEl.querySelectorAll(".pt-opts button").forEach(function(b){
    b.onclick = function(){
      CP.ans[parseInt(b.getAttribute("data-q"), 10)] = parseInt(b.getAttribute("data-o"), 10);
      drawCp();
    };
  });
  var d = document.getElementById("cpDone");
  if(d) d.onclick = function(){
    CP.res = cpScore();
    cpSaveRes(CP.g, { pc: CP.res.pc, ok: CP.res.ok, n: CP.res.n, at: CP.res.at });
    CP.done = true;
    drawCp();
    window.scrollTo(0, 0);
  };
  var ag = document.getElementById("cpAgain");
  if(ag) ag.onclick = function(){ cpStart(CP.g); };
  var bk = document.getElementById("cpBack");
  if(bk) bk.onclick = function(){ CP.g = 0; drawCpMenu(); window.scrollTo(0, 0); };
  mainEl.querySelectorAll("button[data-go]").forEach(function(b){
    b.onclick = function(){ show("g" + b.getAttribute("data-go")); };
  });
}

function cpResultHTML(){
  var r = CP.res;
  if(!r) return "";
  var pass = r.pc >= Math.round(CP_PASS * 100);
  var h = '<div class="pt-res">' +
            '<div class="lv">' + r.pc + "%</div>" +
            '<div class="lvn">Đúng ' + r.ok + " / " + r.n + " câu</div>";
  if(pass){
    h += '<p class="say">Đạt. Nhóm này coi như đã vững — sang nhóm tiếp theo được rồi.</p>';
  }else{
    h += '<p class="say">Chưa đạt ngưỡng ' + Math.round(CP_PASS * 100) +
         "%. Đừng sang nhóm mới vội; những bài dưới đây là chỗ bị trừ điểm nhiều nhất:</p>";
    var ls = Object.keys(r.miss).sort(function(a, b){ return r.miss[b].n - r.miss[a].n; });
    h += '<div class="pt-gs">';
    ls.forEach(function(id){
      h += '<div class="g start"><span class="nm">Bài ' + pad3(id).slice(1) + " · " +
           esc(r.miss[id].title) + '</span><span class="sc">' + r.miss[id].n + " sai</span></div>";
    });
    h += "</div>";
  }
  return h + "</div>";
}

/* ===================== BAN DANG O DAU (muc 21c) =====================
   Khong cho diem. Moi dong la MOT VIEC LAM DUOC, kem de tu kiem chung va moc
   dat — vi "biet ngu phap" va "lam duoc" la hai chuyen khac nhau, va cai thu hai
   moi la thu nguoi hoc can. Tich tay, luu trong localStorage theo khoa bac|so thu tu. */

function cdDone(){ return CANDO && CANDO.ticked || load("cd_done", []) || []; }
function cdSave(list){
  if(CANDO) CANDO.ticked = list;   // giu trong bo nho truoc, giong muc 21a
  save("cd_done", list);
}
function cdKey(lv, i){ return lv + "|" + i; }

/* Nhan cho mot bai duoc gan: tim ten that trong muc luc de nut co nghia,
   chu khong chi hien mot con so tran. */
function cdLabel(kind, id){
  var idx = kind === "g" ? GINDEX : kind === "s" ? SINDEX
          : kind === "n" ? BINDEX : INDEX;
  var nm = "";
  if(idx) (idx.groups || []).forEach(function(g){
    (g.items || []).forEach(function(it){ if(it.id === id) nm = it.vi || it.pat || ""; });
  });
  return nm;
}

function drawCando(){
  var done = cdDone();

          "/" + tot + "</b> việc.</p>" +

  (CANDO.levels || []).forEach(function(lv){

             '<span class="pc">' + n + "/" + items.length + "</span></div>";
    items.forEach(function(it, i){
      var k = cdKey(lv.lv, i), on = done.indexOf(k) > -1;
      h += '<div class="cd-it' + (on ? " on" : "") + '">' +
             '<div class="top">' +
               '<button type="button" class="bx' + (on ? " on" : "") + '" data-k="' + escAttr(k) +
                 '" aria-pressed="' + (on ? "true" : "false") + '">' + (on ? "\u2713" : "") + "</button>" +
               '<span class="do">' + it["do"] + "</span></div>" +
             '<div class="cd-task"><b>Tự kiểm chứng:</b> ' + it.task +
               '<br><b>Đạt khi:</b> ' + it.ok + "</div>";
      var links = "";

/* ===================== NGHE CHEP CHINH TA (muc 19a) =====================
   Khong co file du lieu rieng. Cau nghe chep rut thang tu cac khoi "ex",
   "bank" va "dialog" da co san: 5.284 cau tren toan bo tai lieu — gap nam lan
   chi tieu 1.000 cua ke hoach, va KHONG viet trung mot cau nao. Viet rieng
   1.000 cau moi chi tao ra mot ban sao thu hai phai bao tri song song. */
var DT_SRC = [["all", "Tất cả"], ["nm", "Nhập môn"], ["kc", "Khung câu"],
              ["ng", "Ngữ pháp"], ["sk", "Kỹ năng"]];
var DT_RATE = [[0.6, "Chậm"], [0.85, "Thường"], [1.05, "Nhanh"]];
var DT = { src: "all", rate: 0.85, pool: null, q: null,
           graded: null, n: 0, ok: 0, reveal: false };

/* Chuan hoa truoc khi so: viet thuong, bo dau cau, nhay cong ve nhay thang.
   Nguoi hoc go "dont" hay "don't" deu phai duoc tinh la dung — loi chinh ta dau
   nhay khong phai thu bai nay muon do. */
function dtNorm(w){
  return String(w).toLowerCase()
    .replace(/[\u2018\u2019\u02bc]/g, "'")
    .replace(/[\u201c\u201d]/g, '"')
    .replace(/[.,!?;:"()\u2014\u2013]/g, "")
    .replace(/'/g, "")
    .trim();
}
function dtWords(t){
  return String(t || "").split(/\s+/).map(dtNorm).filter(function(w){ return w.length; });
}

/* Cham tung tu bang LCS chu khong so theo vi tri. Thieu MOT tu ma so theo vi tri
   thi moi tu phia sau deu bi tinh sai — bao sai nhu the thi khong con dung duoc. */
function dtGrade(said, target){
  var a = dtWords(said), b = dtWords(target);
  var i, j, m = a.length, n = b.length;
  var L = [];
  for(i = 0; i <= m; i++) L.push(new Array(n + 1).fill(0));
  for(i = 1; i <= m; i++) for(j = 1; j <= n; j++){
    L[i][j] = a[i-1] === b[j-1] ? L[i-1][j-1] + 1 : Math.max(L[i-1][j], L[i][j-1]);
  }
  // Lan nguoc de biet tu nao cua DAP AN duoc khop, tu nao nguoi hoc go thua
  var hit = new Array(n).fill(false), extra = [];
  i = m; j = n;
  while(i > 0 && j > 0){
    if(a[i-1] === b[j-1]){ hit[j-1] = true; i--; j--; }
    else if(L[i-1][j] >= L[i][j-1]){ extra.unshift(a[i-1]); i--; }
    else j--;
  }
  while(i > 0){ extra.unshift(a[i-1]); i--; }
  var ok = hit.filter(Boolean).length;
  return { hit: hit, extra: extra, ok: ok, n: n,
           pc: n ? Math.round(ok * 100 / n) : 0 };
}

/* Gom cau tu moi nguon. Chi lay cau DU DAI DE NGHE duoc ma khong qua dai:
   3-14 tu. Ngan hon thi khong con la bai nghe, dai hon thi thanh bai tri nho. */
function dtHarvest(docs, src){
  var out = [];
  var take = function(en, vi, f){
    en = (en || "").trim(); vi = (vi || "").trim();
    var w = en.split(/\s+/).length;
    if(!en || !vi || w < 3 || w > 14) return;
    out.push({ en: en, vi: vi, src: src, lesson: f.id, title: f.title || "" });
  };
  eachBlock(docs, "ex", function(b, f){
    (b.items || []).forEach(function(it){ take(it.en, it.vi, f); });
  });
  eachBlock(docs, "bank", function(b, f){
    (b.groups || []).forEach(function(g){
      (g.items || []).forEach(function(it){
        take(it.en, it.vi, f);
        (it.vars || []).forEach(function(v){ take(v.en, v.vi, f); });
      });
    });
  });
  eachBlock(docs, "dialog", function(b, f){
    (b.lines || []).forEach(function(l){ take(l.en, l.vi, f); });
  });
  return out;
}

function dtPool(){
  if(DT.pool) return Promise.resolve(DT.pool);
  return Promise.all([loadAllBasics(), loadAllFrames(),
                      loadAllLessons(), loadAllSkills()]).then(function(r){
    DT.pool = dtHarvest(r[0], "nm").concat(dtHarvest(r[1], "kc"),
                        dtHarvest(r[2], "ng"), dtHarvest(r[3], "sk"));
    return DT.pool;
  });
}
function dtMatch(){
  return (DT.pool || []).filter(function(q){
    return DT.src === "all" || q.src === DT.src;
  });
}
function dtNext(){
  var hits = dtMatch();
  if(!hits.length){ DT.q = null; return; }
  DT.q = hits[Math.floor(Math.random() * hits.length)];
  DT.graded = null; DT.reveal = false;
}

    drawDictation();

/* ===================== NGHE CHON DAP AN (muc 19a) =====================
   Dung chung kho cau voi trang nghe chep (DT.pool). Hai kieu hoi, deu cham
   duoc CHAC vi dap an dung chinh la cau vua doc:
     "nghia" — nghe cau, chon nghia tieng Viet   -> do hieu y ca cau
     "cau"   — nghe cau, chon cau tieng Anh dung -> do nghe ro tung tu
   Kieu "cau" lay nhieu la nhung cau GIONG NHAU NHAT trong kho, khong phai cau
   ngau nhien — nghe loang thoang mot tu roi doan thi se chon truot. */
var LQ_MODE = [["nghia", "Nghe \u2192 chọn nghĩa"], ["cau", "Nghe \u2192 chọn câu"]];
var LQ = { mode: "nghia", src: "all", rate: 0.85, q: null, opts: null,
           pick: null, n: 0, ok: 0 };

/* Do do giong nhau giua hai cau: bao nhieu tu dung chung. Dung de chon nhieu. */
function lqSim(a, b){
  var wa = dtWords(a), wb = dtWords(b), i, set = {}, n = 0;
  for(i = 0; i < wb.length; i++) set[wb[i]] = true;
  for(i = 0; i < wa.length; i++) if(set[wa[i]]) n++;
  return n / Math.max(1, Math.max(wa.length, wb.length));
}

/* Lay 3 cau giong nhat trong mot mang. KHONG sort ca mang: sort goi ham so sanh
   2·n·log n lan tren kho 5.000 cau la treo may vai giay moi lan ra de — tren dien
   thoai thay ro. Duyet mot luot, moi cau tinh do giong DUNG MOT LAN, giu top 3. */
function lqTop3(cands, target){
  var top = [], i, j, sim;
  for(i = 0; i < cands.length; i++){
    sim = lqSim(cands[i].en, target);
    if(top.length < 3){
      top.push({ x: cands[i], s: sim });
      top.sort(function(a, b){ return b.s - a.s; });
    }else if(sim > top[2].s){
      top[2] = { x: cands[i], s: sim };
      for(j = 2; j > 0 && top[j].s > top[j-1].s; j--){
        var t = top[j]; top[j] = top[j-1]; top[j-1] = t;
      }
    }
  }
  return top.map(function(t){ return t.x; });
}

function lqMatch(){
  return (DT.pool || []).filter(function(q){
    return LQ.src === "all" || q.src === LQ.src;
  });
}

function lqNext(){
  var hits = lqMatch();
  if(hits.length < 4){ LQ.q = null; LQ.opts = null; return; }
  var q = hits[Math.floor(Math.random() * hits.length)];
  var key = LQ.mode === "cau" ? "en" : "vi";
  // Loai cau trung chu — kho cau gom tu nhieu bai nen co cau lap lai, de hai
  // phuong an giong het nhau thi cau hoi khong con dap an dung duy nhat.
  var seen = {}, cand = [];
  seen[dtNorm(q[key])] = true;
  hits.forEach(function(x){
    var k = dtNorm(x[key]);
    if(seen[k]) return;
    seen[k] = true;
    cand.push(x);
  });
  if(LQ.mode === "cau"){
    // Nhieu = cau GIONG NHAT, de buoc phai nghe ky chu khong doan duoc
    cand = lqTop3(cand, q.en);
  }else{
    cand = cpShuffle(cand).slice(0, 3);
  }
  if(cand.length < 3){ LQ.q = null; LQ.opts = null; return; }
  LQ.q = q;
  LQ.opts = cpShuffle([q].concat(cand));
  LQ.pick = null;
}
